    <style>
      @font-face {
        font-family: "Baloo2";
        src: url("assets/fonts/baloo-2-devanagari-800-normal.woff2") format("woff2");
        font-weight: 800;
        unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF;
      }
      @font-face {
        font-family: "Baloo2";
        src: url("assets/fonts/baloo-2-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
        unicode-range: U+0000-00FF;
      }
      :root {
        --red: #d7192b;
        --yellow: #f6c343;
        --ink: #2a1a12;
        --paper: #f7f2e6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--red);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Baloo2", sans-serif;
        font-weight: 800;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #art {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .draw {
        stroke-dasharray: 1;
      }
      .bubble {
        position: absolute;
        left: 110px;
        width: 860px;
        top: 1430px;
        padding: 34px 40px 30px;
        background: #fffdf6;
        border: 6px dashed var(--ink);
        border-radius: 44px;
        box-shadow: 0 0 0 10px #fffdf6, 0 0 0 14px var(--ink);
        text-align: center;
        font-size: 68px;
        line-height: 1.3;
        color: var(--ink);
        opacity: 0;
      }
      .bubble.moral {
        top: 1400px;
        font-size: 72px;
        background: #fff7d6;
        box-shadow: 0 0 0 10px #fff7d6, 0 0 0 14px var(--red);
      }
      .w {
        display: inline-block;
        margin: 0 10px;
        opacity: 0;
      }
      .w.key {
        color: var(--red);
      }
      .moral .lead {
        display: block;
        font-size: 92px;
        color: var(--red);
        margin-bottom: 4px;
      }
    </style>
  </head>

        // ---------- script, word timings from the voiceover transcript ----------
        const LINES = [
          { id: "b0", in: 0.25, out: 2.8, words: [["एक", 0.3], ["प्यासा", 0.42, 1], ["कौआ,", 0.74], ["पानी", 1.11], ["ढूंढ", 1.54], ["रहा", 1.95], ["था।", 2.23]] },
          { id: "b1", in: 2.85, out: 5.8, words: [["उसे", 2.88], ["एक", 3.05], ["घड़ा", 3.25], ["मिला,", 3.77], ["पर", 4.26], ["पानी", 4.34], ["बहुत", 4.6], ["नीचे", 4.95, 1], ["था।", 5.3]] },
          { id: "b2", in: 5.85, out: 9.4, words: [["कौए", 5.95], ["ने", 6.25], ["तरकीब", 6.46, 1], ["सोची,", 6.92], ["और", 7.33], ["घड़े", 7.44], ["में", 7.94], ["कंकड़", 8.1, 1], ["डालने", 8.29], ["लगा।", 8.65]] },
          { id: "b3", in: 9.4, out: 12.7, words: [["पानी", 9.43], ["ऊपर", 9.83, 1], ["आया,", 10.18], ["और", 10.62], ["कौए", 10.74], ["ने", 11.05], ["जी", 11.31], ["भर", 11.55], ["के", 11.8], ["पानी", 11.92], ["पिया!", 12.29, 1]] },
        ];
        const MORAL = { id: "b4", in: 12.75, lead: ["सीख:", 12.95], words: [["समझदारी", 13.12, 1], ["से", 13.62], ["हर", 13.74], ["मुश्किल", 13.78], ["आसान", 14.26], ["है।", 14.49]] };

        function fillBubble(line) {
          const el = document.getElementById(line.id);
          if (line.lead) {
            const s = document.createElement("span");
            s.className = "w lead";
            s.textContent = line.lead[0];
            el.appendChild(s);
          }
          line.words.forEach(([t, , key]) => {
            const s = document.createElement("span");
            s.className = "w" + (key ? " key" : "");
            s.textContent = t;
            el.appendChild(s);
          });
          return el;
        }
        LINES.forEach(fillBubble);
        fillBubble(MORAL);

        // ---------- generated folk ornaments ----------
        const NS = "http://www.w3.org/2000/svg";
        const spikes = document.getElementById("sunSpikes");
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2, b = a + 0.17, c = a - 0.17;
          const p = document.createElementNS(NS, "polygon");
          p.setAttribute("points", `${Math.cos(c) * 84},${Math.sin(c) * 84} ${Math.cos(a) * 128},${Math.sin(a) * 128} ${Math.cos(b) * 84},${Math.sin(b) * 84}`);
          p.setAttribute("fill", i % 2 ? "#e0362c" : "#f08a1c");
          p.setAttribute("stroke", "#7a1d10");
          p.setAttribute("stroke-width", "3");
          spikes.appendChild(p);
        }
        function petals(host, n, r0, r1, w, fill, stroke) {
          const g = document.getElementById(host);
          for (let i = 0; i < n; i++) {
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", `M0,${-r0} C${w},${-(r0 + r1) / 2} ${w * 0.4},${-r1} 0,${-r1} C${-w * 0.4},${-r1} ${-w},${-(r0 + r1) / 2} 0,${-r0}Z`);
            p.setAttribute("transform", `rotate(${(360 / n) * i})`);
            p.setAttribute("fill", fill);
            p.setAttribute("stroke", stroke);
            p.setAttribute("stroke-width", "4");
            g.appendChild(p);
          }
        }
        petals("petalsOuter", 16, 120, 330, 70, "url(#patMandala)", "#8a1550");
        petals("petalsInner", 16, 110, 230, 44, "#b5317a", "#5c0b33");

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true });
        const paper = document.getElementById("paper");
        const draw = (sel, t, d) => {
          tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, t);
        };
        const drawFill = (sel, t, d) => {
          draw(sel, t, d);
          tl.fromTo(sel, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.3, ease: "none" }, t + d * 0.7);
        };
        const show = (sel, t, d = 0.25) => tl.to(sel, { opacity: 1, duration: d, ease: "power1.out" }, t);
        const hide = (sel, t, d = 0.25) => tl.to(sel, { opacity: 0, duration: d, ease: "power1.in" }, t);
        const bg = (color, t) => tl.to(paper, { attr: { fill: color }, duration: 0.3, ease: "none" }, t);
        const flap = (t, n, speed = 0.12) => tl.fromTo("#wing", { rotation: 0 }, { rotation: -38, svgOrigin: "10 -122", duration: speed, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t);

        // initial states
        gsap.set(["#groundGrass", "#mandalaPos", "#lotuses", "#pot", "#pile", "#arrow", "#thoughtPos", "#flyers", "#joy", "#sweat"], { opacity: 0 });
        gsap.set("#pot", { x: 600, y: 1300 });
        gsap.set("#water", { y: -85 });
        gsap.set("#insidePebbles ellipse", { opacity: 0 });
        gsap.set("#crow", { x: -260, y: 700, scale: 1.1 });
        const PILE = [[205, 1300], [268, 1306], [236, 1270], [330, 1302], [300, 1272]];
        PILE.forEach(([x, y], i) => gsap.set(`#pb${i}`, { x, y }));
        gsap.set("#flyers ellipse", { opacity: 0 });

        // the frame's inner line, title and sun ink in first
        draw("#paper + rect", 0, 0.6);
        tl.fromTo("#title", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0.1);
        drawFill("#sun circle.draw", 0.15, 0.5);
        tl.fromTo("#sunSpikes", { scale: 0, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.45, ease: "back.out(2)" }, 0.4);
        tl.to("#sunSpikes", { rotation: 40, svgOrigin: "0 0", duration: 15.4, ease: "none" }, 0.4);

        // ---- scene 1: the hot day (0 - 2.85) ----
        drawFill("#groundDry path.draw", 0.1, 0.55);
        drawFill("#tree path.draw", 0.3, 0.6);
        draw("#heat path", 0.6, 0.6);
        tl.fromTo("#cracks", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
        tl.to("#sun", { scale: 1.08, svgOrigin: "0 0", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.5);
        tl.to("#crow", { x: 470, duration: 1.4, ease: "power2.out" }, 0.25);
        tl.fromTo("#crow", { y: 700 }, { y: 670, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 6, immediateRender: false }, 0.25);
        flap(0.25, 9);
        tl.fromTo("#sweat", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 1.4);
        tl.to("#sweat", { y: 24, opacity: 0, duration: 0.5, ease: "power1.in" }, 2.1);

        // ---- scene 2: the pot, water too low (2.85 - 5.85) ----
        bg("#f6c9d4", 2.85);
        hide(["#groundDry", "#tree", "#heat"], 2.85, 0.2);
        show("#groundGrass", 2.85, 0.2);
        tl.set("#pot", { opacity: 1 }, 3.0);
        drawFill("#pot > path.draw", 3.0, 0.45);
        tl.fromTo("#pot", { scale: 0.85, svgOrigin: "0 0" }, { scale: 1, svgOrigin: "0 0", duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, 3.0);
        // crow hops onto the rim
        tl.to("#crow", { x: 480, y: 822, scale: 0.85, duration: 0.6, ease: "power2.inOut" }, 3.2);
        flap(3.2, 3);
        // peeks in and sees the low water
        tl.to("#crowTilt", { rotation: 28, svgOrigin: "0 0", duration: 0.35, ease: "power2.out" }, 4.55);
        tl.set("#arrow", { opacity: 1 }, 4.85);
        draw("#arrow path:first-child", 4.85, 0.4);
        tl.to("#crowTilt", { rotation: 0, svgOrigin: "0 0", duration: 0.3, ease: "power2.inOut" }, 5.4);
        tl.set("#sweat", { y: 0 }, 5.0);
        tl.to("#sweat", { opacity: 1, duration: 0.2 }, 5.0);
        tl.to("#sweat", { opacity: 0, y: 20, duration: 0.4 }, 5.5);

        // ---- scene 3: the clever idea, pebbles (5.85 - 9.4) ----
        bg("#f7f2e6", 5.85);
        hide("#arrow", 5.85, 0.2);
        show("#pile", 5.9, 0.3);
        tl.fromTo("#thought", { scale: 0, svgOrigin: "150 200" }, { scale: 1, svgOrigin: "150 200", duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, 6.1);
        tl.set("#thoughtPos", { opacity: 1 }, 6.1);
        hide("#thoughtPos", 7.25, 0.25);
        tl.set("#flyers", { opacity: 1 }, 7.0);
        const BEAK = [640, 705];
        const LAND = [[-60, -52], [10, -46], [78, -56], [-30, -88], [44, -92]];
        const DROPS = [7.45, 7.9, 8.35, 8.8, 9.25];
        const LEVEL = [-160, -215, -270, -325, -370];
        DROPS.forEach((t, i) => {
          const [px, py] = PILE[i];
          tl.set(`#pb${i}`, { opacity: 0 }, t - 0.3);
          tl.set(`#fl${i}`, { opacity: 1, x: px, y: py }, t - 0.3);
          tl.to(`#fl${i}`, { x: BEAK[0], y: BEAK[1], duration: 0.22, ease: "power2.out" }, t - 0.3);
          tl.to(`#fl${i}`, { x: 600, y: 830, duration: 0.2, ease: "power2.in" }, t - 0.05);
          tl.set(`#fl${i}`, { opacity: 0 }, t + 0.15);
          tl.fromTo(`#in${i}`, { opacity: 1, y: -320 }, { y: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, t + 0.15);
          tl.to("#water", { y: LEVEL[i], duration: 0.3, ease: "back.out(2)" }, t + 0.33);
          tl.to("#crowTilt", { rotation: 14, svgOrigin: "0 0", duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1 }, t - 0.1);
        });

        // ---- scene 4: water rises, the crow drinks (9.4 - 12.75) ----
        bg("#dff2cf", 9.4);
        tl.to("#water", { y: -430, duration: 0.6, ease: "power2.out" }, 9.55);
        tl.set("#joy", { opacity: 1 }, 9.7);
        const SPK = [[470, 760], [760, 700], [820, 900], [400, 940]];
        document.querySelectorAll("#joy .spk").forEach((el, i) => {
          tl.fromTo(el, { x: SPK[i][0], y: SPK[i][1], scale: 0, rotation: 0 }, { scale: 1, rotation: 90, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 9.75 + i * 0.12);
          tl.to(el, { scale: 0.7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.2 + i * 0.12);
        });
        tl.to("#crowTilt", { rotation: 50, svgOrigin: "0 0", duration: 0.4, ease: "power2.inOut" }, 10.7);
        tl.to("#crowTilt", { rotation: 40, svgOrigin: "0 0", duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 11.15);
        tl.to("#water", { y: -405, duration: 0.8, ease: "sine.inOut" }, 11.2);
        tl.to("#crowTilt", { rotation: 0, svgOrigin: "0 0", duration: 0.35, ease: "power2.out" }, 12.0);
        const HRT = [[420, 640], [700, 600]];
        document.querySelectorAll("#joy .hrt").forEach((el, i) => {
          tl.fromTo(el, { x: HRT[i][0], y: HRT[i][1] + 60, scale: 0, opacity: 1 }, { y: HRT[i][1] - 40, scale: 1.4, duration: 0.8, ease: "power2.out", immediateRender: false }, 12.05 + i * 0.15);
        });
        flap(12.15, 2);

        // ---- scene 5: moral tableau (12.75 - 15.8) ----
        bg("#f9df7a", 12.75);
        hide(["#pot", "#pile", "#flyers", "#joy"], 12.75, 0.25);
        tl.to("#crow", { x: 505, y: 1010, scale: 1.4, duration: 0.6, ease: "power3.inOut" }, 12.8);
        flap(12.8, 3);
        tl.set("#mandalaPos", { opacity: 1 }, 12.8);
        tl.fromTo("#mandala", { scale: 0, rotation: -60, svgOrigin: "0 0" }, { scale: 1, rotation: 0, svgOrigin: "0 0", duration: 0.7, ease: "back.out(1.4)", immediateRender: false }, 12.8);
        tl.to("#petalsOuter", { rotation: 20, svgOrigin: "0 0", duration: 2.3, ease: "none" }, 13.5);
        tl.to("#petalsInner", { rotation: -20, svgOrigin: "0 0", duration: 2.3, ease: "none" }, 13.5);
        tl.fromTo("#lotuses", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)", immediateRender: false }, 13.1);

        // ---- speech bubbles, word by word ----
        LINES.concat([MORAL]).forEach((line) => {
          const el = document.getElementById(line.id);
          tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, line.in);
          const spans = el.querySelectorAll(".w");
          const words = line.lead ? [line.lead].concat(line.words) : line.words;
          words.forEach(([, t], i) => {
            tl.fromTo(spans[i], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
          });
          if (line.out) tl.to(el, { opacity: 0, duration: 0.15, ease: "power1.in" }, line.out);
        });
        gsap.set(".w", { opacity: 0 });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
