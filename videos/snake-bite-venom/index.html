<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Snake Bite — Venom Inside You</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #2a7fd4;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2a7fd4;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <section id="stage" class="clip" data-start="0" data-duration="30" data-track-index="0">
        <!-- 180x320 pixel world, upscaled 6x -->
        <canvas id="world" width="180" height="320" data-layout-allow-overflow></canvas>
        <!-- 360x640 caption layer, upscaled 3x -->
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <!-- built by scripts/synth_audio.py: sound effects only (no narration, no music, no text sounds) -->
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="1"></audio>
    </div>
    <script>
      // ---------------------------------------------------------------
      // Palette (frame.md, bright revision). Every pixel snaps to one of these.
      // ---------------------------------------------------------------
      var C = {
        skyTop: "#2a7fd4", sky: "#5aaee8", skyLight: "#9ad4f4", haze: "#ffe6b0", sun: "#fff6c8", sunGlow: "#ffd27a",
        mesaDark: "#a8442a", mesa: "#d9643a", mesaLight: "#f39a5a",
        sandDark: "#c47a3a", sand: "#e8a858", sandLight: "#f8d08a", rockDark: "#8a4a30", rock: "#c06a40",
        cactusDark: "#23803a", cactus: "#3cb44a", cactusLight: "#86e060",
        snakeDark: "#5a3a22", snake: "#c89a5a", snakeLight: "#f0d090", cream: "#fff2c8", eye: "#ffd040", mouth: "#ff7a9a", tongue: "#ff3050",
        jeans: "#2f5fc8", jeansLight: "#5a8af0", skin: "#ffc29a", skinShade: "#e8956a", sock: "#f8f4ec", boot: "#8a5230", bootDark: "#5a3218", lace: "#ffd060",
        air: "#bfe8ff", airLight: "#e6f7ff", epi: "#ffd0aa", epiLight: "#ffe6cc", derm: "#ff9e9e", dermLine: "#f27a8c",
        cap: "#e8303a", capLight: "#ff6a6a", fat: "#ffe08a", fatLine: "#f0b040", muscle: "#d8404a", muscleLine: "#a82a3a", nerve: "#fff070",
        fang: "#fffaf0", fangShade: "#d8cfc0",
        plasma: "#ffc890", plasmaLight: "#ffe2b8", rbc: "#e8202a", rbcLight: "#ff6a5a", rbcDark: "#a8101e",
        wall: "#f07aa0", wallDark: "#b84a78", nucleus: "#8a2a7a", tissue: "#7a2a5a", plate: "#ffe040", damaged: "#6a3a3a",
        venom: "#5cff2a", venomDark: "#1c9a1c", venomGlow: "#c8ff9a", bound: "#a0a8a0",
        antibody: "#5ae8ff", antibodyLight: "#e0fbff", antibodyDark: "#1a8ab0",
        ink: "#06050a", paper: "#f1eef4", gold: "#ffd23f", white: "#ffffff",
      };
      function hex(h) {
        return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      }
      var PAL = Object.keys(C).map(function (k) { return hex(C[k]); });
      function mix(a, b, t) {
        var x = hex(a), y = hex(b);
        t = Math.max(0, Math.min(1, t));
        return "rgb(" + Math.round(x[0] + (y[0] - x[0]) * t) + "," + Math.round(x[1] + (y[1] - x[1]) * t) + "," + Math.round(x[2] + (y[2] - x[2]) * t) + ")";
      }

      // ---------------------------------------------------------------
      // Deterministic helpers
      // ---------------------------------------------------------------
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function hash1(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
      function sstep(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
      function ease(t) { return 0.5 - 0.5 * Math.cos(Math.PI * clamp01(t)); }
      function ramp(t, a, b) { return ease((t - a) / (b - a)); }
      function easeOut(t) { t = clamp01(t); return 1 - Math.pow(1 - t, 3); }

      // ---------------------------------------------------------------
      // Cameras: [time, x, y, zoom] per scene. Zoom eases in log space and
      // position follows the zoom so big zooms dive toward their target.
      // ---------------------------------------------------------------
      function camAt(keys, t) {
        if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2], z: keys[0][3] };
        var L = keys[keys.length - 1];
        if (t >= L[0]) return { x: L[1], y: L[2], z: L[3] };
        var i = 0;
        while (t > keys[i + 1][0]) i++;
        var a = keys[i], b = keys[i + 1];
        var e = ease((t - a[0]) / (b[0] - a[0]));
        var z = Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * e);
        var k = e;
        if (Math.abs(Math.log(b[3] / a[3])) > 0.1) k = (1 - a[3] / z) / (1 - a[3] / b[3]);
        return { x: a[1] + (b[1] - a[1]) * k, y: a[2] + (b[2] - a[2]) * k, z: z };
      }
      var BITE = { x: 134, y: 231 };
      var CAM_DESERT = [
        [0, 90, 160, 1], [3.4, 92, 166, 1.08], [4.9, 106, 212, 1.9], [6.9, 112, 214, 2.2], [8.75, BITE.x, BITE.y, 40],
      ];
      var CAM_DESERT_END = [
        [26.85, BITE.x, BITE.y, 40], [29.2, 90, 160, 1], [30, 90, 160, 1],
      ];
      var CAM_SKIN = [
        [8.45, 90, 130, 40], [9.8, 90, 168, 1.0], [12.6, 90, 172, 1.06], [13.75, 90, 200, 40],
      ];
      var CAM_BLOOD = [
        [13.45, 90, 160, 40], [14.7, 90, 160, 1.0], [18.2, 92, 160, 1.05], [19.3, 96, 212, 1.7], [21.2, 100, 214, 1.75],
        [22.3, 90, 160, 1.12], [26.3, 94, 160, 1.22], [27.15, 94, 262, 40],
      ];

      // ---------------------------------------------------------------
      // Canvases
      // ---------------------------------------------------------------
      var W = 180, H = 320;
      var world = document.getElementById("world");
      var wctx = world.getContext("2d");
      var buf = document.createElement("canvas");
      buf.width = W; buf.height = H;
      var g = buf.getContext("2d", { willReadFrequently: true });
      var ui = document.getElementById("ui");
      var u = ui.getContext("2d", { willReadFrequently: true });

      function setCam(cam, f) {
        f = f === undefined ? 1 : f;
        var z = Math.pow(cam.z, f);
        var cx = 90 + (cam.x - 90) * f, cy = 160 + (cam.y - 160) * f;
        g.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
      }
      function screen() { g.setTransform(1, 0, 0, 1, 0, 0); }
      function disc(x, y, r, col) {
        g.fillStyle = col; g.beginPath(); g.arc(x, y, Math.max(r, 0.01), 0, 6.2832); g.fill();
      }
      function ell(x, y, rx, ry, rot, col) {
        g.fillStyle = col; g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.01), Math.max(ry, 0.01), rot, 0, 6.2832); g.fill();
      }
      function line(x1, y1, x2, y2, w, col) {
        g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round";
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }
      function vignette(alpha) {
        screen();
        var vg = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.7);
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(40,10,30," + alpha + ")");
        g.fillStyle = vg; g.fillRect(0, 0, W, H);
      }

      // =================================================================
      // SCENE 1 — THE DESERT
      // =================================================================
      var CLOUDS = (function () {
        var r = rng(2), a = [];
        for (var i = 0; i < 5; i++) a.push({ x: r() * 220 - 20, y: 20 + r() * 70, w: 18 + r() * 22, s: 0.6 + r() * 0.8 });
        return a;
      })();
      var DUST = (function () {
        var r = rng(4), a = [];
        for (var i = 0; i < 40; i++) a.push({ x: r() * W, y: r() * H, v: 2 + r() * 6, c: r() });
        return a;
      })();
      var PEBBLES = (function () {
        var r = rng(6), a = [];
        for (var i = 0; i < 120; i++) a.push({ x: r() * 300 - 60, y: 201 + r() * 130, w: 1 + r() * 4, c: r() });
        return a;
      })();
      function snakeState(t) {
        var s = 0;
        if (t >= 4.9) s = 0.85 * easeOut((t - 4.9) / 0.32);
        if (t >= 5.22) s = 0.85 + 0.12 * ((t - 5.22) / (6.85 - 5.22));
        if (t >= 6.85) s = 0.97 + 0.03 * clamp01((t - 6.85) / 0.05);
        if (t >= 6.9) s = 1;
        if (t >= 26.9) s = 1 - ramp(t, 27.2, 28.0);
        var open = t >= 4.85 && t < 27.6 ? sstep(4.85, 5.05, t) : 0;
        return { s: s, open: open };
      }
      function hikerOffset(t) {
        if (t < 3.4) return 70;
        if (t < 4.9) return 70 * (1 - easeOut((t - 3.4) / 1.5));
        if (t < 28.5) return 0;
        return 85 * ramp(t, 28.5, 29.6);
      }
      function spiral(uu) {
        var ang = Math.PI * 0.2 + uu * Math.PI * 3.4;
        var r = 20 - 9 * uu;
        return { x: 64 + Math.cos(ang) * r, y: 266 + Math.sin(ang) * r * 0.45 - uu * 7 };
      }
      function neckPoint(v, st, t) {
        var p0 = spiral(1);
        var bob = (1 - st.s) * Math.sin(t * 2.2) * 1.2;
        var h0 = { x: 80, y: 230 + bob }, c0 = { x: 58, y: 240 };
        var h1 = { x: 121, y: 233 }, c1 = { x: 96, y: 236 };
        var hx = h0.x + (h1.x - h0.x) * st.s, hy = h0.y + (h1.y - h0.y) * st.s;
        var cx = c0.x + (c1.x - c0.x) * st.s, cy = c0.y + (c1.y - c0.y) * st.s;
        var iv = 1 - v;
        return { x: iv * iv * p0.x + 2 * iv * v * cx + v * v * hx, y: iv * iv * p0.y + 2 * iv * v * cy + v * v * hy };
      }
      function patternCol(L) {
        var ph = ((L % 7) + 7) % 7 / 7;
        if (ph > 0.3 && ph < 0.7) return C.snakeDark;
        if ((ph > 0.22 && ph <= 0.3) || (ph >= 0.7 && ph < 0.78)) return C.cream;
        return C.snake;
      }
      function drawSnake(t) {
        var st = snakeState(t);
        // gather body discs (tail -> head) with arc length for the pattern
        var pts = [], L = 0, prev = null;
        for (var i = 0; i <= 90; i++) {
          var p = spiral(i / 90);
          if (prev) L += Math.hypot(p.x - prev.x, p.y - prev.y);
          pts.push({ x: p.x, y: p.y, r: 2.4 + 1.6 * Math.min(1, i / 25), L: L });
          prev = p;
        }
        for (var j = 1; j <= 40; j++) {
          var q = neckPoint(j / 40, st, t);
          L += Math.hypot(q.x - prev.x, q.y - prev.y);
          pts.push({ x: q.x, y: q.y, r: 4 - 1.2 * (j / 40), L: L, neck: true });
          prev = q;
        }
        // coil: back-to-front by depth, neck always on top
        var coil = pts.filter(function (p) { return !p.neck; }).sort(function (a, b) { return a.y - b.y; });
        var neck = pts.filter(function (p) { return p.neck; });
        // shadow
        ell(68, 270, 26, 5, 0, C.sandDark);
        drawRattle(t);
        coil.concat(neck).forEach(function (p) {
          disc(p.x, p.y + 0.6, p.r + 0.6, C.snakeDark);
          var col = patternCol(p.L);
          disc(p.x, p.y, p.r, col);
          if (col === C.snake) disc(p.x - 0.6, p.y - p.r * 0.45, p.r * 0.45, C.snakeLight);
        });
        // speed lines during the lunge
        if (t > 4.9 && t < 6.9) {
          var a = 0.9 * (1 - clamp01((t - 5.3) / 1.6));
          g.globalAlpha = Math.max(0.25, a);
          for (var k = 0; k < 5; k++) {
            var y = 226 + k * 3.4, x = 84 + (k % 2) * 6;
            line(x, y, x + 22 - k * 2, y + 1, 0.8, C.white);
          }
          g.globalAlpha = 1;
        }
        drawHead(t, st);
      }
      function drawRattle(t) {
        var tail = spiral(0);
        var buzz = Math.sin(t * 95) * 0.9;
        for (var ghost = -1; ghost <= 1; ghost++) {
          g.globalAlpha = ghost === 0 ? 1 : 0.4;
          for (var i = 0; i < 6; i++) {
            var x = tail.x - 3 + buzz * ghost * 1.5 + Math.sin(t * 95 + i) * 0.5, y = tail.y - 3 - i * 2.6;
            ell(x, y, 2.4 - i * 0.12, 1.4, 0, i % 2 ? C.cream : C.snakeLight);
            line(x - 2, y + 1, x + 2, y + 1, 0.4, C.snakeDark);
          }
        }
        g.globalAlpha = 1;
      }
      function drawHead(t, st) {
        var a = neckPoint(0.94, st, t), b = neckPoint(1, st, t);
        var th = Math.atan2(b.y - a.y, b.x - a.x);
        var dx = Math.cos(th), dy = Math.sin(th), px = -dy, py = dx;
        var hx = b.x + dx * 3, hy = b.y + dy * 3;
        var open = st.open;
        // lower jaw swings down when striking
        var jaw = th + 0.75 * open;
        ell(hx + Math.cos(jaw) * 2 + px * 1.6, hy + Math.sin(jaw) * 2 + py * 1.6, 5, 1.8, jaw, C.snakeLight);
        if (open > 0.1) {
          ell(hx + dx * 1.5 + px * 1.2, hy + dy * 1.5 + py * 1.2, 4.2, 1.8 * open, th + 0.35 * open, C.mouth);
          // fangs
          for (var f = 0; f < 2; f++) {
            var fx = hx + dx * (4.4 - f * 1.4), fy = hy + dy * (4.4 - f * 1.4);
            line(fx, fy, fx + dx * 0.8 + px * 3 * open, fy + dy * 0.8 + py * 3 * open, 0.9, C.fang);
          }
        }
        // upper head: wedge-shaped pit viper skull
        ell(hx, hy, 6.2, 3.8, th - 0.35 * open, C.snakeDark);
        ell(hx - px * 0.2, hy - py * 0.2, 5.5, 3.2, th - 0.35 * open, C.snake);
        ell(hx - px * 1.2 - dx, hy - py * 1.2 - dy, 3.2, 1.3, th - 0.35 * open, C.snakeLight);
        // dark stripe + eye
        var ex = hx + dx * 1.2 - px * 1.4, ey = hy + dy * 1.2 - py * 1.4;
        line(ex - dx * 3, ey - dy * 3, ex + dx * 2, ey + dy * 2, 1.4, C.snakeDark);
        disc(ex, ey, 1.25, C.eye);
        g.fillStyle = C.ink; g.fillRect(ex - 0.25, ey - 1, 0.5, 2);
        g.fillStyle = C.white; g.fillRect(ex + 0.3, ey - 0.9, 0.4, 0.4);
        // heat pit
        disc(hx + dx * 3.8 - px * 0.6, hy + dy * 3.8 - py * 0.6, 0.45, C.ink);
        // forked tongue flicks while coiled
        var flick = (t % 1.6) / 1.6;
        if (st.s < 0.05 && flick < 0.22) {
          var len = 4 * Math.sin(Math.PI * flick / 0.22);
          var tx = hx + dx * 6, ty = hy + dy * 6;
          line(tx, ty, tx + dx * len, ty + dy * len, 0.6, C.tongue);
          line(tx + dx * len, ty + dy * len, tx + dx * (len + 1.4) + px, ty + dy * (len + 1.4) + py, 0.5, C.tongue);
          line(tx + dx * len, ty + dy * len, tx + dx * (len + 1.4) - px, ty + dy * (len + 1.4) - py, 0.5, C.tongue);
        }
      }
      function drawHiker(t) {
        var off = hikerOffset(t);
        if (off > 80) return;
        var walking = (t > 3.4 && t < 4.9) || t > 28.5;
        var bob = walking ? Math.abs(Math.sin(t * 9)) * 2.2 : 0;
        var flinch = t > 6.9 && t < 7.4 ? Math.sin((t - 6.9) / 0.5 * Math.PI) * 1.5 : 0;
        var x = 124 + off, y = -bob - flinch;
        // jeans leg (from above the frame)
        g.fillStyle = C.jeans; g.fillRect(x + 2, 120 + y, 24, 106);
        g.fillStyle = C.jeansLight; g.fillRect(x + 4, 120 + y, 4, 104);
        g.fillStyle = C.jeansLight; g.fillRect(x + 1, 222 + y, 26, 4);
        // bare ankle (the bite target)
        g.fillStyle = C.skin; g.fillRect(x + 4, 226 + y, 20, 10);
        g.fillStyle = C.skinShade; g.fillRect(x + 18, 226 + y, 6, 10);
        // sock + boot (toe pointing left, toward the snake)
        g.fillStyle = C.sock; g.fillRect(x + 3, 236 + y, 22, 4);
        g.fillStyle = C.boot;
        g.beginPath(); g.moveTo(x + 1, 239 + y); g.lineTo(x + 27, 239 + y); g.lineTo(x + 28, 258 + y);
        g.lineTo(x - 12, 258 + y); g.quadraticCurveTo(x - 13, 248 + y, x + 1, 246 + y); g.closePath(); g.fill();
        g.fillStyle = C.bootDark; g.fillRect(x - 13, 257 + y, 42, 3);
        for (var i = 0; i < 3; i++) { g.fillStyle = C.lace; g.fillRect(x + 4 + i * 4, 241 + y + i, 2, 1); }
        // two puncture dots appear after the bite
        if (t > 7.0 && t < 29.6) {
          g.fillStyle = C.rbc;
          g.fillRect(x + 7, 230 + y, 1, 1); g.fillRect(x + 10, 231 + y, 1, 1);
        }
      }
      function drawCactus(x, base, h, s) {
        g.fillStyle = C.cactusDark;
        g.fillRect(x - 4 * s, base - h, 8 * s, h);
        g.fillStyle = C.cactus;
        g.fillRect(x - 3 * s, base - h, 5 * s, h);
        g.fillStyle = C.cactusLight;
        g.fillRect(x - 2 * s, base - h + 2, 1.4 * s, h - 4);
        // arms
        g.fillStyle = C.cactus;
        g.fillRect(x - 11 * s, base - h * 0.55, 7 * s, 4 * s); g.fillRect(x - 11 * s, base - h * 0.85, 4 * s, h * 0.32);
        g.fillRect(x + 4 * s, base - h * 0.4, 7 * s, 4 * s); g.fillRect(x + 8 * s, base - h * 0.7, 4 * s, h * 0.32);
        disc(x - 0.5 * s, base - h, 3 * s, C.cactus);
      }
      function drawDesert(t, cam) {
        screen();
        // sky
        var gr = g.createLinearGradient(0, 0, 0, H);
        var lift = clamp01((cam.y - 160) / 100);
        gr.addColorStop(0, C.skyTop);
        gr.addColorStop(0.4 - 0.2 * lift, C.sky);
        gr.addColorStop(0.62 - 0.25 * lift, C.skyLight);
        gr.addColorStop(0.75 - 0.25 * lift, C.haze);
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        // sun + posterized halo
        var sx = 138 - (cam.x - 90) * 0.12, sy = 58 - (cam.y - 160) * 0.12;
        var rings = [[44, mix(C.sky, C.skyLight, 0.6)], [33, C.skyLight], [23, mix(C.skyLight, C.haze, 0.6)], [15, C.sunGlow], [9, C.sun]];
        for (var i = 0; i < rings.length; i++) disc(sx, sy, rings[i][0] * (1 + 0.03 * Math.sin(t * 1.4 + i)), rings[i][1]);
        // clouds drift
        CLOUDS.forEach(function (c) {
          var x = ((c.x + t * 2 * c.s - (cam.x - 90) * 0.2) % 240 + 240) % 240 - 30;
          var y = c.y - (cam.y - 160) * 0.15;
          ell(x, y, c.w * 0.5, 3.5, 0, C.white);
          ell(x + c.w * 0.25, y - 2, c.w * 0.3, 3.5, 0, C.white);
          ell(x, y + 1.5, c.w * 0.5, 2, 0, C.skyLight);
        });
        // mesas (parallax)
        setCam(cam, 0.45);
        g.fillStyle = C.mesaDark;
        g.beginPath(); g.moveTo(-120, 205); g.lineTo(-60, 205); g.lineTo(-52, 160); g.lineTo(-8, 160); g.lineTo(0, 190);
        g.lineTo(40, 190); g.lineTo(46, 172); g.lineTo(78, 172); g.lineTo(86, 205); g.lineTo(140, 205); g.lineTo(150, 150);
        g.lineTo(200, 150); g.lineTo(212, 205); g.lineTo(320, 205); g.lineTo(320, 260); g.lineTo(-120, 260); g.closePath(); g.fill();
        g.fillStyle = C.mesa;
        g.fillRect(-52, 160, 40, 45); g.fillRect(46, 172, 28, 33); g.fillRect(150, 150, 46, 55);
        g.fillStyle = C.mesaLight;
        g.fillRect(-52, 160, 40, 3); g.fillRect(46, 172, 28, 3); g.fillRect(150, 150, 46, 3);
        for (var b = 0; b < 4; b++) { g.fillStyle = C.mesaDark; g.fillRect(150, 162 + b * 9, 46, 1); g.fillRect(-52, 170 + b * 9, 40, 1); }
        // ground
        setCam(cam, 1);

          var img = u.getImageData(x0, top, w, h), d = img.data;
          for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) {
            var k = (yy * w + xx) * 4;
            var th = BAYER[(((top + yy) >> 1) & 3) * 4 + (((x0 + xx) >> 1) & 3)] / 16;
            if (th < p * 1.15) d[k + 3] = 0;
            else d[k + 3] = d[k + 3] * (1 - p * 0.5);
          }
          u.putImageData(img, x0, top);
        }
      }
      function drawUI(t) {
        u.clearRect(0, 0, 360, 640);
        CAPTIONS.forEach(function (c) { if (t >= c.a && t < c.b) drawCaption(c, t); });
      }

      // ---------------------------------------------------------------
      // Frame: scenes joined by dither dissolves at full zoom
      // ---------------------------------------------------------------
      function shake(cam, t, t0, amp) {
        var s = 1 - clamp01((t - t0) / 0.45);
        if (t >= t0 && s > 0) {
          var f = Math.floor(t * 30);
          cam.x += (hash1(f) - 0.5) * amp * s / cam.z;
          cam.y += (hash1(f + 99) - 0.5) * amp * s / cam.z;
        }
        return cam;
      }
      function scene(name, t) {
        g.globalAlpha = 1;
        if (name === "desert") {
          var keys = t < 18 ? CAM_DESERT : CAM_DESERT_END;
          drawDesert(t, shake(camAt(keys, t), t, 6.9, 6));
        } else if (name === "skin") drawSkin(t, camAt(CAM_SKIN, t));
        else drawBlood(t, camAt(CAM_BLOOD, t));
        return g.getImageData(0, 0, W, H);
      }
      var CUTS = [[8.6, "desert", "skin"], [13.6, "skin", "blood"], [27.0, "blood", "desert"]];
      function render(t) {
        var img = null;
        for (var i = 0; i < CUTS.length; i++) {
          var c = CUTS[i];
          if (Math.abs(t - c[0]) < 0.15) {
            var p = (t - (c[0] - 0.15)) / 0.3;
            var A = scene(c[1], t), B = scene(c[2], t), a = A.data, b = B.data;
            for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
              if (BAYER[(y & 3) * 4 + (x & 3)] / 16 < p) {
                var k = (y * W + x) * 4;
                a[k] = b[k]; a[k + 1] = b[k + 1]; a[k + 2] = b[k + 2];
              }
            }
            img = A;
          }
        }
        if (!img) {
          var name = t < 8.6 ? "desert" : t < 13.6 ? "skin" : t < 27.0 ? "blood" : "desert";
          img = scene(name, t);
        }
        // strike flash
        quantize(img);
        drawUI(t);
      }

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: 30, duration: 30, ease: "none", onUpdate: function () { render(proxy.t); } }, 0);
      render(0);
      window.__timelines["main"] = tl;
    </script>
