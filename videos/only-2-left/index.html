<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Only 2 Left</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --cream: #fbf3e2;
        --mustard: #f2b631;
        --night: #1c1834;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Fredoka", sans-serif; }
      .clip { position: absolute; inset: 0; }
      #world { position: absolute; inset: 0; transform-origin: 1000px 640px; }
      #world svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #glow { mix-blend-mode: screen; }
      #title {
        position: absolute; left: 190px; top: 70px; z-index: 5;
        color: var(--cream); font-weight: 700; line-height: 0.86; letter-spacing: 4px;
        text-shadow: 0 10px 0 rgba(28, 20, 60, 0.28), 0 0 60px rgba(255, 200, 120, 0.18);
      }
      #title .line { display: flex; align-items: flex-end; font-size: 250px; }
      #title .word { display: inline-block; transform-origin: 50% 90%; }
      #title .two { color: var(--mustard); margin-left: 60px; transform-origin: 50% 60%; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 58%, rgba(0,0,0,0) 45%, rgba(10, 6, 30, 0.62) 100%);
      }
      #fade { position: absolute; inset: 0; background: #0c0a1a; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="world">
          <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="roadG" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#4d4577" />
                <stop offset="1" stop-color="#332d58" />
              </linearGradient>
              <linearGradient id="walkG" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#7a6f9e" />
                <stop offset="1" stop-color="#4e4673" />
              </linearGradient>
              <radialGradient id="poolG" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#ffc77e" stop-opacity="0.75" />
                <stop offset="0.45" stop-color="#ff9e5a" stop-opacity="0.32" />
                <stop offset="1" stop-color="#ff8a4a" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="bulbG" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#fff4d2" stop-opacity="1" />
                <stop offset="0.25" stop-color="#ffd08a" stop-opacity="0.7" />
                <stop offset="1" stop-color="#ff9a4a" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="winG" cx="0.5" cy="0.5" r="0.6">
                <stop offset="0" stop-color="#ffe2a6" />
                <stop offset="1" stop-color="#e9a04f" />
              </radialGradient>
              <pattern id="awning" width="56" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
                <rect width="28" height="10" fill="#e8513f" />
                <rect x="28" width="28" height="10" fill="#f6efe4" />
              </pattern>
              <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" /></filter>
            </defs>

            <!-- ground plane -->
            <polygon points="420,1100 1500,1100 1085,-20 760,-20" fill="url(#roadG)" />
            <polygon points="110,1100 420,1100 760,-20 610,-20" fill="url(#walkG)" />
            <polygon points="1500,1100 1830,1100 1270,-20 1085,-20" fill="url(#walkG)" />
            <line x1="420" y1="1100" x2="760" y2="-20" stroke="#9a90c0" stroke-width="7" opacity="0.55" />
            <line x1="1500" y1="1100" x2="1085" y2="-20" stroke="#9a90c0" stroke-width="7" opacity="0.55" />
            <!-- manhole -->
            <polygon points="560,760 700,760 712,840 552,840" fill="none" stroke="#2a2548" stroke-width="5" opacity="0.7" />

            <!-- left wall + shutters -->
            <polygon points="0,-20 610,-20 110,1100 0,1100" fill="#2c2750" />
            <g id="shutters"></g>

            <!-- right wall + shops -->
            <polygon points="1270,-20 1920,-20 1920,1100 1830,1100" fill="#352d57" />
            <g id="shops"></g>

            <!-- planters, bollards, cafe -->
            <g id="props"></g>

            <!-- shadows -->
            <g opacity="0.55" filter="url(#soft)">
              <path d="M874,860 L926,860 L600,1110 L500,1090 Z" fill="#120d2a" />
              <path d="M1078,875 L1122,875 L840,1120 L740,1100 Z" fill="#120d2a" />
            </g>

            <!-- man -->
            <g id="man" transform="translate(900,500) scale(1.45)">
              <g id="manBody">
                <rect x="-22" y="150" width="11" height="96" rx="5" fill="#141218" />
                <rect x="11" y="150" width="11" height="96" rx="5" fill="#141218" />
                <ellipse cx="-18" cy="248" rx="15" ry="8" fill="#141218" />
                <ellipse cx="18" cy="248" rx="15" ry="8" fill="#141218" />
                <rect x="-60" y="52" width="10" height="104" rx="5" fill="#141218" />
                <rect x="50" y="52" width="10" height="104" rx="5" fill="#141218" />
                <circle cx="-55" cy="160" r="9" fill="#141218" />
                <circle cx="55" cy="160" r="9" fill="#141218" />
                <path d="M-46,44 Q0,30 46,44 L62,86 L46,92 L46,162 Q0,170 -46,162 L-46,92 L-62,86 Z" fill="#f3efe8" />
                <path d="M46,44 L62,86 L46,92 L46,162 Q30,166 18,166 Q40,110 30,44 Z" fill="#ffd9a8" opacity="0.55" />
                <path d="M-16,46 Q0,66 16,46" fill="none" stroke="#e2b54a" stroke-width="3" />
              </g>
              <g id="manHead">
                <circle cx="0" cy="-8" r="50" fill="#131118" />
                <path d="M30,-46 A50,50 0 0 1 36,30" fill="none" stroke="#ffb867" stroke-width="4" opacity="0.6" stroke-linecap="round" />
                <g class="eyes" id="manEyes">
                  <ellipse cx="-17" cy="-12" rx="10" ry="12" fill="#fbf6ea" />
                  <ellipse cx="17" cy="-12" rx="10" ry="12" fill="#fbf6ea" />
                  <g id="manPupils">
                    <circle cx="-17" cy="-10" r="4.5" fill="#131118" />
                    <circle cx="17" cy="-10" r="4.5" fill="#131118" />
                  </g>
                </g>
                <path d="M-28,-30 L-8,-37" stroke="#fbf6ea" stroke-width="3.5" stroke-linecap="round" />
                <path d="M8,-37 L28,-30" stroke="#fbf6ea" stroke-width="3.5" stroke-linecap="round" />
                <path d="M-10,18 Q-5,13 0,16 Q5,19 10,15" fill="none" stroke="#fbf6ea" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>

            <!-- woman -->
            <g id="woman" transform="translate(1100,530) scale(1.45)">
              <g id="womanBody">
                <rect x="-19" y="150" width="10" height="86" rx="5" fill="#141218" />
                <rect x="9" y="150" width="10" height="86" rx="5" fill="#141218" />
                <ellipse cx="-16" cy="238" rx="13" ry="7" fill="#6b4630" />
                <ellipse cx="16" cy="238" rx="13" ry="7" fill="#6b4630" />
                <circle cx="-48" cy="152" r="8" fill="#141218" />
                <circle cx="48" cy="152" r="8" fill="#141218" />
                <path d="M-36,40 Q0,28 36,40 L58,150 Q0,166 -58,150 Z" fill="#e8b23a" />
                <path d="M36,40 L58,150 Q40,156 24,158 Q36,100 24,40 Z" fill="#ffd27a" opacity="0.7" />
                <path d="M-6,34 L6,34 L8,158 L-8,158 Z" fill="#f6efe2" />
                <path d="M-36,46 L-54,140 L-44,146 L-28,62 Z" fill="#d49a26" />
                <path d="M36,46 L54,140 L44,146 L28,62 Z" fill="#f0c04e" />
              </g>
              <g id="womanHead">
                <path d="M10,-52 Q58,-40 52,24 Q50,40 40,38 Q46,-10 10,-40 Z" fill="#3a2418" />
                <circle cx="0" cy="-8" r="46" fill="#131118" />
                <path d="M-42,-24 Q-20,-62 22,-52 Q48,-40 50,-10 Q30,-44 -42,-24 Z" fill="#2a1a12" />
                <path d="M28,-40 A46,46 0 0 1 34,26" fill="none" stroke="#ffb867" stroke-width="4" opacity="0.6" stroke-linecap="round" />
                <g class="eyes" id="womanEyes">
                  <ellipse cx="-15" cy="-8" rx="10" ry="12" fill="#fbf6ea" />
                  <ellipse cx="15" cy="-8" rx="10" ry="12" fill="#fbf6ea" />
                  <g id="womanPupils">
                    <circle cx="-15" cy="-6" r="4.5" fill="#131118" />
                    <circle cx="15" cy="-6" r="4.5" fill="#131118" />
                  </g>
                </g>
                <path d="M-26,-26 L-7,-32" stroke="#fbf6ea" stroke-width="3.5" stroke-linecap="round" />
                <path d="M7,-32 L26,-26" stroke="#fbf6ea" stroke-width="3.5" stroke-linecap="round" />
                <path d="M-8,20 Q0,15 8,20" fill="none" stroke="#fbf6ea" stroke-width="3" stroke-linecap="round" />
              </g>
            </g>

            <!-- street lamp (foreground) -->
            <g id="lamp" transform="translate(190,0)">
              <path d="M1250,1120 L1250,520 Q1250,440 1170,440 L1132,440" fill="none" stroke="#17142a" stroke-width="22" stroke-linecap="round" />
              <path d="M1062,486 Q1062,438 1118,436 Q1174,438 1174,486 Z" fill="#1d1a30" />
              <ellipse id="bulb" cx="1118" cy="490" rx="50" ry="14" fill="#fff1c8" />
            </g>
          </svg>

          <!-- additive light layer -->
          <svg id="glow" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <g id="pool">
              <ellipse cx="1010" cy="820" rx="600" ry="310" fill="url(#poolG2)" />
              <ellipse cx="1308" cy="500" rx="230" ry="190" fill="url(#bulbG2)" />
            </g>
            <defs>
              <radialGradient id="poolG2" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#ffb767" stop-opacity="0.55" />
                <stop offset="0.5" stop-color="#ff8f4a" stop-opacity="0.2" />
                <stop offset="1" stop-color="#ff7a3a" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="bulbG2" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0" stop-color="#fff0c4" stop-opacity="0.95" />
                <stop offset="0.3" stop-color="#ffc072" stop-opacity="0.4" />
                <stop offset="1" stop-color="#ff9a4a" stop-opacity="0" />
              </radialGradient>
            </defs>
            <g id="dust"></g>
          </svg>
        </div>

        <div id="title" data-layout-allow-occlusion>
          <div class="line"><span class="word" id="wOnly">ONLY</span><span class="word two" id="wTwo" data-layout-allow-occlusion>2</span></div>
          <div class="line"><span class="word" id="wLeft">LEFT</span></div>
        </div>
        <div id="vignette"></div>
        <div id="fade"></div>
      </section>

      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.35" data-duration="0.57" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="0.55" data-duration="0.4" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="0.85" data-duration="0.4" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="1.2" data-duration="2.1" data-track-index="13" data-volume="0.6"></audio>
    </div>

    <script>
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        parent.appendChild(n);
        return n;
      };
      // deterministic PRNG
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      // left facade: roller shutters along the curb line (110,1100) -> (610,-20)
      const shutters = document.getElementById("shutters");
      const L = (t) => [110 + 500 * t, 1100 - 1120 * t];
      [[0.04, 0.27], [0.32, 0.52], [0.57, 0.72], [0.76, 0.87], [0.9, 0.98]].forEach(([a, b]) => {
        const [ax, ay] = L(a), [bx, by] = L(b);
        const wa = 170 * (1 - a) + 30, wb = 170 * (1 - b) + 30;
        el("polygon", { points: `${ax},${ay} ${bx},${by} ${bx - wb},${by} ${ax - wa},${ay}`, fill: "#4a4470" }, shutters);
        for (let i = 1; i < 12; i++) {
          const t = a + ((b - a) * i) / 12;
          const [x, y] = L(t), w = 170 * (1 - t) + 30;
          el("line", { x1: x, y1: y, x2: x - w, y2: y, stroke: "#3a3560", "stroke-width": 3 }, shutters);
        }
      });

      // right facade: warm lit shop windows + awning, curb line (1830,1100) -> (1270,-20)
      const shops = document.getElementById("shops");
      const R = (t) => [1830 - 560 * t, 1100 - 1120 * t];
      const wins = [];
      [[0.08, 0.3], [0.36, 0.55], [0.6, 0.75], [0.8, 0.92]].forEach(([a, b], i) => {
        const [ax, ay] = R(a), [bx, by] = R(b);
        const wa = 150 * (1 - a) + 40, wb = 150 * (1 - b) + 40;
        const w = el("polygon", { points: `${ax + 20},${ay} ${bx + 20},${by} ${bx + wb},${by} ${ax + wa},${ay}`, fill: "url(#winG)", opacity: i === 1 ? 1 : 0.85 }, shops);
        wins.push(w);
        el("polygon", { points: `${ax + 20},${ay} ${bx + 20},${by} ${bx + wb},${by} ${ax + wa},${ay}`, fill: "none", stroke: "#1e2a2a", "stroke-width": 8 }, shops);
      });
      // awning over the nearest-to-centre shop
      {
        const [ax, ay] = R(0.36), [bx, by] = R(0.55);
        el("polygon", { points: `${ax - 30},${ay + 10} ${bx - 30},${by - 10} ${bx + 70},${by - 10} ${ax + 100},${ay + 10}`, fill: "url(#awning)" }, shops);
      }

      // props
      const props = document.getElementById("props");
      [[0.12], [0.45], [0.7]].forEach(([t]) => {
        const [x, y] = L(t), s = 1 - t * 0.6;
        el("rect", { x: x - 10 - 110 * s, y: y - 60 * s, width: 110 * s, height: 70 * s, rx: 6, fill: "#7a4a35" }, props);
        for (let i = 0; i < 5; i++) el("circle", { cx: x - 10 - 100 * s + i * 22 * s, cy: y - 64 * s - (i % 2) * 10 * s, r: 18 * s, fill: i % 2 ? "#3f7a4a" : "#4e9157" }, props);
      });
      [0.2, 0.38, 0.6, 0.8].forEach((t) => {
        const [x, y] = L(t), s = 1 - t * 0.6;
        el("rect", { x: x + 12, y: y - 46 * s, width: 13 * s, height: 46 * s, rx: 6 * s, fill: "#1b1830" }, props);
      });
      [0.22, 0.6, 0.85].forEach((t) => {
        const [x, y] = R(t), s = 1 - t * 0.6;
        el("rect", { x: x - 40, y: y - 46 * s, width: 13 * s, height: 46 * s, rx: 6 * s, fill: "#1b1830" }, props);
      });
      // cafe table
      el("ellipse", { cx: 1560, cy: 640, rx: 48, ry: 22, fill: "#f2ede4" }, props);
      el("rect", { x: 1556, y: 640, width: 8, height: 60, fill: "#1b1830" }, props);
      el("rect", { x: 1606, y: 600, width: 34, height: 70, rx: 4, fill: "#1b1830", opacity: 0.85 }, props);
      el("rect", { x: 1480, y: 620, width: 34, height: 70, rx: 4, fill: "#1b1830", opacity: 0.85 }, props);
      el("rect", { x: 1550, y: 622, width: 12, height: 14, rx: 2, fill: "#c9a27a" }, props);

      // dust motes in the lamp light
      const dust = document.getElementById("dust");
      const motes = [];
      for (let i = 0; i < 46; i++) {
        const c = el("circle", { cx: 600 + rand() * 860, cy: 420 + rand() * 560, r: 1.5 + rand() * 2.8, fill: "#ffe2a8", opacity: 0 }, dust);
        motes.push([c, rand()]);
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });

      tl.to("#fade", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
      tl.fromTo("#world", { scale: 1.0, y: 0 }, { scale: 1.07, y: -14, duration: 5, ease: "sine.inOut" }, 0);

      // title
      tl.from("#wOnly", { y: -140, scale: 0.6, opacity: 0, duration: 0.55, ease: "back.out(2.2)" }, 0.45);
      tl.from("#wLeft", { y: -140, scale: 0.6, opacity: 0, duration: 0.55, ease: "back.out(2.2)" }, 0.75);
      tl.from("#wTwo", { scale: 3.2, rotation: -18, opacity: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, 1.15);
      tl.to("#title", { keyframes: { x: [0, -10, 8, -5, 3, 0], y: [0, 6, -4, 3, -1, 0] }, duration: 0.35, ease: "none" }, 1.2);
      tl.to("#wTwo", { rotation: 6, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.7);

      // lamp flicker
      tl.to(["#pool", "#bulb"], { keyframes: { opacity: [1, 0.35, 0.9, 0.2, 1, 0.6, 1] }, duration: 0.45, ease: "none" }, 2.65);
      // far shop window dies -> loneliness
      tl.to(wins[3], { keyframes: { opacity: [0.85, 0.2, 0.7, 0] }, duration: 0.4, ease: "none" }, 3.0);

      // characters: breathing
      tl.to(["#manBody", "#manHead"], { y: -3, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.2);
      tl.to(["#womanBody", "#womanHead"], { y: -3, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0.5);

      // blinks
      [["#manEyes", 1.7], ["#womanEyes", 1.85], ["#manEyes", 4.05], ["#womanEyes", 3.95]].forEach(([s, t]) => {
        tl.to(s, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.07, ease: "power1.in", yoyo: true, repeat: 1 }, t);
      });

      // glances: at each other, then both look up at the camera
      tl.to("#manPupils", { x: 5, y: 2, duration: 0.25, ease: "power2.out" }, 2.25);
      tl.to("#manHead", { rotation: 6, svgOrigin: "0 30", duration: 0.35, ease: "power2.out" }, 2.25);
      tl.to("#womanPupils", { x: -5, y: 1, duration: 0.25, ease: "power2.out" }, 2.4);
      tl.to("#womanHead", { rotation: -6, svgOrigin: "0 30", duration: 0.35, ease: "power2.out" }, 2.4);
      tl.to(["#manPupils", "#womanPupils"], { x: 0, y: -5, duration: 0.25, ease: "power2.out" }, 3.45);
      tl.to(["#manHead", "#womanHead"], { rotation: 0, duration: 0.35, ease: "power2.out" }, 3.45);
      // tiny nervous shiver
      tl.to(["#manBody", "#manHead", "#womanBody", "#womanHead"], { keyframes: { x: [0, 1.5, -1.5, 1, 0] }, duration: 0.3, ease: "none" }, 3.6);

      // dust drift
      motes.forEach(([c, r], i) => {
        const start = 0.3 + r * 1.2;
        tl.to(c, { opacity: 0.35 + r * 0.5, duration: 0.8, ease: "sine.out" }, start);
        tl.to(c, { y: -40 - r * 70, x: (r - 0.5) * 40, duration: 5 - start, ease: "none" }, start);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
