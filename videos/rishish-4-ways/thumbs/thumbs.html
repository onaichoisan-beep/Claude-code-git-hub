<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('../edit/assets/fonts/Anton-400.woff2'); }
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../edit/assets/fonts/Inter-900.woff2'); }
@font-face { font-family: 'Marker'; src: url('../edit/assets/fonts/PermanentMarker-400.woff2'); }
@font-face { font-family: 'Mono'; src: url('../edit/assets/fonts/JetBrainsMono-700.woff2'); }
:root { --red: #e0141e; --glow: #ff2a2a; --money: #d8ff4f; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; display: flex; flex-direction: column; gap: 30px; padding: 30px; }
.t { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #fff; font-family: Inter, sans-serif; }
.bgred { background: radial-gradient(ellipse at 65% 45%, #6b0208 0%, #2a0104 50%, #080101 100%); }
.bgred::before { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,40,40,.10) 2px, transparent 2px), linear-gradient(90deg, rgba(255,40,40,.10) 2px, transparent 2px);
  background-size: 64px 64px; }
.bgdark { background: radial-gradient(ellipse at 50% 40%, #2b2b30 0%, #101012 60%, #050505 100%); }
.p { position: absolute; filter: brightness(1.08) contrast(1.1) saturate(1.15)
  drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff)
  drop-shadow(0 24px 40px rgba(0,0,0,.7)); }
.p.noline { filter: brightness(1.08) contrast(1.1) saturate(1.15) drop-shadow(0 24px 40px rgba(0,0,0,.6)); }
.anton { font-family: Anton, sans-serif; text-transform: uppercase; line-height: .9; }
.money { color: var(--money); text-shadow: 0 0 40px rgba(216,255,79,.5), 0 8px 0 rgba(0,0,0,.5); }
.red { color: var(--red); text-shadow: 0 0 40px rgba(255,42,42,.6), 0 8px 0 rgba(0,0,0,.5); }
.white { color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.45), 0 0 30px rgba(0,0,0,.4); }
.tag { position: absolute; display: inline-block; background: var(--red); padding: 8px 18px 4px; font-family: Anton; font-size: 46px;
  letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 30px rgba(255,42,42,.6); }
.marker { font-family: Marker, cursive; }
.card { position: absolute; background: #fff; padding: 12px; border-radius: 18px; box-shadow: 0 30px 60px rgba(0,0,0,.7); }
.card img { display: block; border-radius: 8px; }
.stamp { position: absolute; padding: 4px 18px; border: 6px solid var(--red); border-radius: 12px; color: var(--red);
  font-family: Anton; font-size: 64px; letter-spacing: 3px; background: rgba(255,255,255,.95); transform: rotate(-12deg); }
.tile { position: absolute; width: 120px; height: 120px; border-radius: 28px; display: grid; place-items: center;
  background: linear-gradient(160deg, #ff3b3b, #a5000a); border: 3px solid rgba(255,160,160,.9);
  box-shadow: 0 0 40px rgba(255,42,42,.6), 0 16px 30px rgba(0,0,0,.6); }
.tile svg { width: 64px; height: 64px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.arrow { position: absolute; stroke: var(--money); fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
</style></head><body>

<!-- 1: ₹80,000 behind head (matches the video's hook) -->
<div class="t bgred" id="t1">
  <div class="anton money" style="position:absolute;left:40px;top:60px;font-size:240px;letter-spacing:3px">₹80,000</div>
  <img class="p" src="cut/smile.png" style="width:1350px;left:380px;top:110px">
  <div class="tag" style="left:44px;top:330px;transform:rotate(-3deg)">1st year MBBS</div>
  <div class="anton white" style="position:absolute;left:44px;top:440px;font-size:120px">as a student</div>
</div>

<!-- 2: 4 WAYS + pointing -->
<div class="t bgred" id="t2">
  <div style="position:absolute;left:60px;top:70px">
    <div class="anton red" style="font-size:300px">4 WAYS</div>
    <div class="anton white" style="font-size:96px;margin-top:10px">to earn as</div>
    <div class="anton white" style="font-size:96px">a student</div>
    <div class="marker money" style="font-size:52px;margin-top:22px">all trusted ✓</div>
  </div>
  <img class="p" src="cut/point.png" style="width:1500px;left:300px;top:60px">
</div>

<!-- 3: proof card -->
<div class="t bgdark" id="t3">
  <img class="p" src="cut/grin2.png" style="width:1500px;left:-520px;top:60px">
  <div class="anton white" style="position:absolute;right:50px;top:40px;font-size:118px;text-align:right">MBBS student<br><span class="money">earning?</span></div>
  <div class="card" style="right:70px;top:330px;transform:rotate(4deg)"><img src="../edit/assets/proof/payment-10000.jpg" style="width:560px"></div>
  <div class="stamp" style="right:40px;top:520px">PAID</div>
</div>

<!-- 4: shock + ₹7K/month -->
<div class="t bgred" id="t4">
  <img class="p" src="cut/shock.png" style="width:1550px;left:330px;top:40px">
  <div style="position:absolute;left:50px;top:90px">
    <div class="anton money" style="font-size:250px">₹7K</div>
    <div class="anton white" style="font-size:120px">/ month</div>
    <div class="marker" style="font-size:54px;margin-top:26px;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.8)">while doing MBBS</div>
  </div>
  <svg class="arrow" style="left:560px;top:250px;width:220px;height:160px" viewBox="0 0 220 160"><path d="M10 120 C 70 30, 140 20, 200 60"/><path d="M200 60 L 165 30 M200 60 L 160 85"/></svg>
</div>

<!-- 5: open hands + 4 icons -->
<div class="t bgdark" id="t5">
  <div class="anton white" style="position:absolute;left:0;right:0;top:28px;text-align:center;font-size:120px;z-index:2">earn while <span class="red">studying</span></div>
  <img class="p" src="cut/open.png" style="width:1750px;left:-235px;top:70px">
  <div class="tile" style="left:110px;top:250px"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
  <div class="tile" style="left:180px;top:450px"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></div>
  <div class="tile" style="right:110px;top:250px"><svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
  <div class="tile" style="right:180px;top:450px"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.1 8.1 12 12"/><path d="M20 4 8.1 15.9"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg></div>
  <div class="tag" style="left:50%;bottom:30px;transform:translateX(-50%)">4 trusted ways</div>
</div>

</body></html>
