<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Why You Can't Tickle Yourself</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #ffe0e8; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffe0e8; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <!--
      "Why You Can't Tickle Yourself" — text cards + sound only (STYLE_GUIDE.md section 6), safe zone (section 8), layout
      checked with _engine/qa_layout.js. Facts: the cerebellum predicts the sensory result of your own movements and the
      expected touch is damped, so self-touch feels less ticklish (Blakemore, Wolpert & Frith 1998, Nat. Neurosci.;
      2000, NeuroReport); with a robot interface between hand and palm, adding a 100-300 ms delay (or a change in
      direction) made self-produced touch feel more ticklish (Blakemore, Frith & Wolpert 1999, J. Cogn. Neurosci.).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="27.2" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="27.2" data-track-index="0">
        <canvas id="world" width="360" height="640" data-layout-allow-overflow></canvas>
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="27.2" data-track-index="1"></audio>
    </div>
    <script src="pixel-engine.js"></script>
    <script src="captions.js"></script>
    <script src="short-kit.js"></script>
    <script>
      var T = window.BEATS || {};
      var C = {
        bg0: "#ffd8e4", bg1: "#ffb8cc", floor: "#c86a8a", floorD: "#9a4a6a", night0: "#2a2a5a", night1: "#141432",
        skin1: "#ffc8a0", skin1D: "#d8946a", skin2: "#c8845a", skin2D: "#9a5a3a",
        hairB: "#3a2418", hairY: "#ffd23a", shirtB: "#3a7aff", shirtG: "#3ac86a", pants: "#3a3a5a",
        brain: "#ff9ac0", brainD: "#d8608a", cere: "#ffb83a", cereD: "#c87a1a", clip: "#8a5a3a", paper: "#fff8e8",
        robot: "#a8b4c8", robotD: "#6a7488", foam: "#ffe87a", screenC: "#0a2a1a", screenL: "#3ae86a",
        ink: "#0a0614", mouth: "#7a1a3a", mouthIn: "#5a0a2a", tongue: "#ff7a9a", eyeW: "#ffffff", blush: "#ff6a8a", tear: "#9ae8ff",
        gold: "#ffc83a", green: "#3ae86a", pink: "#ff5ab8", cyan: "#3ae8ff", red: "#ff3a4a", white: "#ffffff",
      };
      DISSOLVE = 0.12;
      function arcS(cx, cy, r, a0, a1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke(); }
      function say(x, y, str) { g.save(); screen(); bubble(x, y, str, C.ink); g.restore(); }
      function label(str, x, y, col) { g.save(); screen(); worldText(str, x, y + 1, 1, C.ink); worldText(str, x, y, 1, col || C.white); g.restore(); }
      function tickling(t) { for (var i = 0; i < T.TICKLE.length; i++) { var s = T.TICKLE[i]; if (t >= s[0] && t < s[1]) return s; } return null; }
      function room(cam, night) { sky([[0, night ? C.night0 : C.bg0], [1, night ? C.night1 : C.bg1]]); setCam(cam, 1); rect(-60, 138, 300, 240, night ? "#0a0a1e" : C.floorD); rect(-60, 138, 300, 3, night ? C.night0 : C.floor); }

      // ============================================================ a person (front view): face "blank" | "laugh" | "o"
      function personC(x, y, s, t, o) {
        o = o || {};
        var sk = o.skin2 ? [C.skin2, C.skin2D] : [C.skin1, C.skin1D], sh = o.shirt || C.shirtB, w = o.wiggle ? Math.sin(t * 40) * 1.2 : 0;
        var shake = o.face === "laugh" ? Math.sin(t * 30) * 0.8 : 0;
        g.save(); g.translate(x + shake, y); g.scale(s, s);
        rect(-6, -16, 5, 16, C.pants); rect(1, -16, 5, 16, C.pants); rect(-7, -1, 6, 2, C.ink); rect(1, -1, 6, 2, C.ink);
        rrect(-9, -34, 18, 20, 4, sh);
        // arms: o.armL / o.armR = hand position relative to the body; default hanging
        var aL = o.armL || [-12, -17], aR = o.armR || [12, -17];
        line(-9, -31, aL[0] + w, aL[1], 3, sh); line(9, -31, aR[0] - w, aR[1], 3, sh);
        disc(aL[0] + w, aL[1], 2, sk[0]); disc(aR[0] - w, aR[1], 2, sk[0]);
        // head
        disc(0, -43, 9, sk[1]); disc(0, -43.5, 8.4, sk[0]);
        if (o.hairY) { disc(0, -50, 7, C.hairY); rect(-8.4, -50, 16.8, 3, C.hairY); } else ell(0, -49.5, 8.6, 4.4, 0, C.hairB);
        if (o.face === "laugh") { arcS(-3.5, -42, 1.6, Math.PI + 0.3, -0.3, 0.9, C.ink); arcS(3.5, -42, 1.6, Math.PI + 0.3, -0.3, 0.9, C.ink); ell(0, -37.5, 3.6, 2.6, 0, C.mouthIn); ell(0, -36.5, 2, 1, 0, C.tongue); ell(-7, -40, 0.8, 1.4, 0, C.tear); }
        else if (o.face === "o") { disc(-3.5, -43, 1.4, C.ink); disc(3.5, -43, 1.4, C.ink); ell(0, -38, 1.4, 1.8, 0, C.mouth); }
        else { disc(-3.5, -43, 1.3, C.ink); disc(3.5, -43, 1.3, C.ink); line(-2.5, -38, 2.5, -38, 0.9, C.mouth); line(-5.5, -46.5, -1.5, -46.5, 0.8, C.ink); line(1.5, -46.5, 5.5, -46.5, 0.8, C.ink); }
        disc(-6, -40, 1.3, C.blush); disc(6, -40, 1.3, C.blush);
        g.restore();
      }
      function person(x, y, s, t, o) { character(function () { personC(x, y, s, t, o); }); }
      // the cerebellum as a character (striped lobe, glasses, clipboard)
      function cereC(x, y, s, t, o) {
        o = o || {};
        g.save(); g.translate(x, y); g.scale(s, s);
        ell(0, 0, 20, 13, 0, C.cereD); ell(0, -0.6, 19, 12, 0, C.cere);
        g.save(); g.beginPath(); g.ellipse(0, -0.6, 19, 12, 0, 0, 6.28); g.clip(); for (var k = -2; k <= 2; k++) arcS(0, 18 + k * 4.5, 26, Math.PI * 1.25, Math.PI * 1.75, 0.8, C.cereD); g.restore();
        if (o.swirl) { g.strokeStyle = C.ink; g.lineWidth = 0.8; for (var e = -1; e <= 1; e += 2) { g.beginPath(); for (var a = 0; a < 10; a += 0.4) g.lineTo(e * 6 + Math.cos(a + t * 8) * a * 0.3, -1 + Math.sin(a + t * 8) * a * 0.3); g.stroke(); } }
        else { disc(-6, -1, 3.2, C.white); disc(6, -1, 3.2, C.white); disc(-5.6, -0.6, 1.5, C.ink); disc(6.4, -0.6, 1.5, C.ink); g.strokeStyle = C.ink; g.lineWidth = 0.8; g.beginPath(); g.arc(-6, -1, 3.6, 0, 6.28); g.stroke(); g.beginPath(); g.arc(6, -1, 3.6, 0, 6.28); g.stroke(); line(-2.4, -1, 2.4, -1, 0.8, C.ink); }
        if (o.swirl) ell(0, 6, 2, 2.4, 0, C.mouth); else arcS(0, 5, 2.6, 0.3, Math.PI - 0.3, 0.9, C.mouth);
        if (o.clip) { rect(14, 2, 12, 15, C.clip); rect(15.5, 4, 9, 12, C.paper); for (var l = 0; l < 4; l++) rect(17, 6 + l * 2.6, 6, 0.8, C.ink); line(12, 6, 15, 8, 2, C.cereD); }
        g.restore();
      }
      function cere(x, y, s, t, o) { character(function () { cereC(x, y, s, t, o); }); }

      // ============================================================ scenes
      function scene_self(t) {
        var tt = tapeT(t, T);
        var friend = tt >= T.FRIEND && tt < T.CERE;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        var tk = tickling(tt);
        if (!friend) {
          person(70, 138, 1.25, tt, { face: tt > T.WHY && tt < T.FRIEND ? "o" : "blank", armR: [-8, -28], wiggle: !!tk });
          if (tk) for (var k = 0; k < 3; k++) { var a = tt * 6 + k * 2.1; line(56 + Math.cos(a) * 6, 102 + Math.sin(a) * 4, 58 + Math.cos(a) * 9, 102 + Math.sin(a) * 6, 0.8, C.ink); }
          if (tt > T.WHY + 0.3 && tt < T.FRIEND - 0.2) say(116, 80, "NOTHING?");
        } else {
          person(64, 138, 1.2, tt, { face: tk ? "laugh" : "o", armL: [-14, -40], armR: [14, -40] });
          person(124, 138, 1.2, tt, { face: "o", shirt: C.shirtG, skin2: true, hairY: true, armL: [-18, -24], armR: [-14, -30], wiggle: true });
          if (tt > T.FRIEND + 0.6) say(64, 63, "HAHAHA!");
        }
      }
      function scene_head(t) {
        var pred = t >= T.PRED;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, true);
        if (!pred) {
          // a head in profile with the brain inside; the cerebellum lights up at the back
          var hx = 92, hy = 104;
          disc(hx, hy, 36, C.skin1D); disc(hx, hy - 0.6, 35, C.skin1); ell(hx + 34, hy + 6, 5, 7, 0, C.skin1);
          ell(hx - 2, hy - 8, 26, 18, 0, C.brainD); ell(hx - 2, hy - 8.6, 25, 17, 0, C.brain);
          g.strokeStyle = C.brainD; g.lineWidth = 1; for (var k = 0; k < 5; k++) { g.beginPath(); g.arc(hx - 18 + k * 8, hy - 12 + (k % 2) * 6, 4.5, 0.3, 2.8); g.stroke(); }
          var gl = 0.5 + 0.5 * Math.sin(t * 6);
          lighter(); glow(hx - 18, hy + 16, 16, C.cere, 0.4 + 0.3 * gl); normalBlend();
          cere(hx - 18, hy + 16, 0.55, t, {});
          disc(hx + 22, hy - 4, 2, C.ink);
          line(hx - 26, hy + 22, hx - 36, hy + 30, 1, C.gold); label("CEREBELLUM", 50, 136, C.gold);
        } else {
          cere(90, 108, 2.4, t, { clip: true });
          // the checklist (screen space, lower band)
          g.save(); screen();
          var rows = ["MOVE: ARM", "TOUCH: SIDE", "TICKLE: NO"];
          for (var r = 0; r < 3; r++) { if (t < T.PRED + 0.3 + r * 0.55) break; worldText(rows[r], 80, 190 + r * 10, 1, C.white); worldText(r < 2 ? "OK" : "X", 134, 190 + r * 10, 1, r < 2 ? C.green : C.red); }
          g.restore();
        }
      }
      function scene_cancel(t) {
        var surp = t >= T.SURP;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, !surp ? true : false);
        if (!surp) {
          var hk = clamp01((t - T.HIT) / 0.15);
          rrect(30, 70, 120, 56, 6, C.paper); worldText("TICKLE", 90, 84, 2, C.ink); worldText("SIGNAL", 90, 102, 2, C.ink);
          if (t >= T.HIT) { g.save(); g.translate(90, 98); g.rotate(-0.2); var k = lerp(1.8, 1, easeOut(hk)); g.scale(k, k); rrect(-50, -11, 100, 22, 3, C.red); rrect(-47, -8, 94, 16, 2, C.paper); worldText("CANCELLED", 0, -3.5, 1, C.red); g.restore(); }
          cere(146, 132, 0.7, t, { clip: true });
        } else {
          // a surprise poke from behind
          person(66, 138, 1.4, t, { face: t > T.SURP + 0.5 ? "laugh" : "o", armL: [-14, -40], armR: [14, -40] });
          person(124, 138, 1.4, t, { face: "blank", shirt: C.shirtG, skin2: true, hairY: true, armL: [-24, -26], wiggle: true });
          worldText("!", 66, 62, 2, C.red);
        }
      }
      function scene_robot(t) {
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        var works = t >= T.WORKS, fool = t >= T.FOOL;
        if (fool) { cere(90, 106, 2.4, t, { swirl: true }); worldText("?!", 146, 66, 2, C.red); return; }
        var jw = Math.sin(t * 5) * 4;
        person(58, 138, 1.4, t, { face: works ? "laugh" : "blank", armL: [-14 + jw * 0.3, -18], armR: [16, -32] });
        // joystick under the left hand, robot arm with foam to the right palm
        rect(36 + jw * 0.4, 112, 2, 10, C.ink); disc(37 + jw * 0.4, 111, 2.4, C.red); rect(30, 122, 16, 6, C.robotD);
        var lag = works ? Math.sin((t - 0.2) * 5) * 4 : jw;
        rect(132, 92, 18, 46, C.robotD); rect(134, 94, 14, 42, C.robot); disc(141, 88, 6, C.robotD);
        line(141, 88, 110, 84 + lag, 3, C.robotD); line(110, 84 + lag, 90, 92 + lag, 3, C.robot); disc(88, 92 + lag, 3, C.foam);
        disc(139, 86, 1.2, C.cyan); disc(144, 86, 1.2, C.cyan);
        // cable joystick -> robot
        g.strokeStyle = C.ink; g.lineWidth = 0.8; g.beginPath(); g.moveTo(46, 126); g.quadraticCurveTo(90, 150, 132, 128); g.stroke();
        // the delay readout (screen space, lower band)
        g.save(); screen();
        var d = t < T.DELAY ? 0 : Math.min(0.2, (t - T.DELAY - 0.3) / 1.2 * 0.2);
        rect(52, 188, 76, 22, C.ink); rect(54, 190, 72, 18, C.screenC);
        worldText("DELAY " + Math.max(0, d).toFixed(1) + " S", 90, 196, 1, C.screenL);
        g.restore();
      }

      function sceneAt(t) {
        var tt = tapeT(t, T);
        return tt < T.CERE || tt >= T.CTA ? "self" : tt < T.BREAK + 0.25 ? "head" : tt < T.ROBOT ? "cancel" : "robot";
      }
      function drawUI(t) {
        var tt = tapeT(t, T), tk = tickling(tt);
        var lvl = tt < T.FRIEND ? 0 : tt < T.CERE ? 100 : tt < T.HIT ? 0 : tt < T.SURP ? 0 : tt < T.ROBOT ? 100 : tt < T.WORKS ? 0 : tt < T.FOOL ? Math.round(100 * clamp01((tt - T.WORKS) / 0.8)) : tt < T.CTA ? 100 : 0;
        if (tt >= T.FRIEND && tt < T.CERE) lvl = Math.round(100 * clamp01((tt - T.FRIEND - 0.3) / 0.8));
        var l2 = tt < T.FRIEND ? "SELF-TICKLE" : tt < T.CERE ? "FRIEND-TICKLE" : tt < T.PRED ? "BACK OF BRAIN" : tt < T.HIT ? "PREDICTING..." : tt < T.SURP ? "SIGNAL: MUTED" : tt < T.ROBOT ? "SURPRISE!" : tt < T.WORKS ? "ROBOT + DELAY" : tt < T.FOOL ? "IT WORKS!" : tt < T.CTA ? "BRAIN: FOOLED" : "SELF-TICKLE";
        counterLines("TICKLE " + lvl + "%", lvl > 50 ? C.green : C.red, 3, l2, tt >= T.CERE && tt < T.SURP ? C.white : C.ink);
      }

      KIT.start(C, T, {
        scenes: { self: scene_self, head: scene_head, cancel: scene_cancel, robot: scene_robot },
        sceneAt: sceneAt, ui: drawUI, hitCol: C.red,
        cuts: [[T.CERE, "self", "head"], [T.ROBOT, "cancel", "robot"], [T.CTA, "robot", "self"]],
      });
    </script>
  </body>
</html>
