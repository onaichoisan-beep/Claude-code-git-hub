        for (var k = 0; k < 10; k++) rect(48 + hash1(k) * 30, 182 + ((t * 20 + k * 13) % 66), 1, 1, C.white);
        person(68, 244, 1.05, { kind: "wife", t: t, look: 1, face: "angry", talk: talk("wife", t), aB: [1.9, 1.7], aF: t > tg - 0.1 ? [-0.25, -0.15] : [0.9, -1.4] });
        rect(46, 180, 2, 70, C.woodD); rect(78, 180, 2, 70, C.woodD);
        vignette(0.35, "rgba(30,10,40,");
      }

      // SO HE ROWED INTO THE BLACK SEA, AND SET THE SUN FREE
      function sceneRow(t) {
        var tf = T_FREE, up = clamp01((t - tf) / 1.1), dawn = clamp01((t - tf - 0.05) / 0.6);
        var cam = camAt([[T_ROW, 80, 182, 1.5], [tf - 0.4, 92, 182, 1.45], [tf + 0.3, 92, 150, 1.05], [T_CRUMB, 90, 140, 1.0]], t);
        shake(cam, t, tf, 5, 0.5);
        var nightTop = C.night;
        sky([[0, nightTop], [0.6, C.nightMid], [1, C.nightLow]]);
        if (dawn > 0) { g.globalAlpha = dawn; sky([[0, C.dawnTop], [0.55, C.dawnMid], [0.8, C.dawnLow], [1, C.duskGold]]); g.globalAlpha = 1; }
        setCam(cam, 0.3); stars(t, 1 - dawn);
        setCam(cam, 1);
        seaBody(226, t, dawn > 0.5 ? C.sea : C.seaNightL, dawn > 0.5 ? C.seaDeep : C.seaNight, dawn > 0.5 ? C.foam : C.seaLight, -60, 240, { x: 104, w: 10 });
        var bx = 70 + (t - T_ROW) * 6, row = Math.sin((t - T_ROW) * 6.6);
        // the Sun in the bow, then hurled up into the sky
        var sx = bx + 22, sy = 218;
        if (up > 0) { sx = lerp(bx + 10, 96, easeOut(up)); sy = lerp(196, 70, easeOut(up)); }
        var lift = clamp01((t - tf + 0.5) / 0.5);
        if (up <= 0 && lift > 0) { sx = lerp(bx + 22, bx + 6, lift); sy = lerp(218, 192, lift); }
        sunFace(sx, sy, up > 0 ? 9 + 12 * easeOut(up) : 9, t, up > 0.2 ? "happy" : "worried", 1);
        if (up <= 0) netBag(sx, sy, 9, bx + 4, 210, t);
        var arms = lift > 0 ? { aB: [-1.9, -1.7], aF: [-1.4, -1.5] } : { aB: [0.4 + row * 0.6, 1.2], aF: [0.6 + row * 0.6, 1.0] };
        person(bx - 4, 238, 1.05, { kind: "raghu", t: t, look: 1, legs: false, lean: lift > 0 ? -0.1 : row * 0.08, face: up > 0 ? "happy" : "calm", aB: arms.aB, aF: arms.aF });
        if (lift <= 0) { line(bx - 2 + row * 4, 222, bx - 20 - row * 8, 240, 1.6, C.woodL); ell(bx - 21 - row * 8, 241, 3, 1.2, -0.6, C.woodL); }
        boat(bx, 232, 30, t, C.wood);
        waterLine(-60, 240, 234, t, dawn > 0.5 ? C.sea : C.seaNightL, dawn > 0.5 ? C.foam : C.seaLight);
        if (t > tf && t < tf + 0.5) { lighter(); glow(sx, sy, 90, C.white, 0.6 * (1 - (t - tf) / 0.5)); normalBlend(); }
        if (dawn > 0) for (var b = 0; b < 5; b++) gullSprite(20 + b * 30 + Math.sin(t + b) * 6 + (t - tf) * 10, 120 - b * 6 + Math.sin(t * 2 + b) * 3, t, b);
        vignette(0.3 * (1 - dawn) + 0.15, "rgba(10,5,40,");
      }

      // BUT FIRST... HE BROKE OFF ONE TINY CRUMB
      function hand(x, y, s, rot, pinch) {
        // right hand coming in from the lower right: forearm, palm, index finger + thumb meeting at (x, y)
        g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
        poly([[6, 2], [40, 18], [40, 34], [3, 9]], C.ink); poly([[6.5, 3], [40, 19], [40, 32.5], [4, 8]], C.skin);
        line(10, 7, 38, 22, 1, C.skinL);
        ell(8, 5, 6.5, 5.2, 0.35, C.ink); ell(8, 5, 5.8, 4.6, 0.35, C.skin); ell(6.5, 3.5, 2.6, 1.6, 0.35, C.skinL);
        var o = pinch ? 0 : 1.4;
        line(4, 1, 0, -o, 3.2, C.ink); line(4, 1, 0, -o, 2.3, C.skin);       // index finger
        line(5, 8, 0.4, o, 3.2, C.ink); line(5, 8, 0.4, o, 2.3, C.skinL);   // thumb
        line(9, 0, 6, -2.5, 3, C.ink); line(9, 0, 6, -2.5, 2.1, C.skinD);   // curled fingers behind
        g.restore();
      }
      function sceneCrumb(t) {
        var tb = WT(7, "broke"), tc = WT(7, "crumb");
        var sx = 62, sy = 236, sr = 28, ca = -0.55;
        var c0x = sx + Math.cos(ca) * sr, c0y = sy + Math.sin(ca) * sr;
        var pull = easeOut(clamp01((t - tb) / 0.5)), reach = ease(clamp01((t - T_CRUMB) / 0.9));
        var cx = lerp(c0x, 112, pull), cy = lerp(c0y, 210, pull);
        var cam = camAt([[T_CRUMB, 88, 196, 1.0], [tb, 88, 194, 1.12], [tc, 108, 190, 1.9], [T_DIYA, 110, 189, 2.3]], t);
        shake(cam, t, tb, 3, 0.3);
        sky([[0, C.night], [1, C.nightMid]]);
        setCam(cam, 0.3); stars(t, 1);
        setCam(cam, 1);
        seaBody(250, t, C.seaNightL, C.seaNight, C.seaLight);
        sunFace(sx, sy, sr, t, t > tc - 0.2 ? "wink" : t > tb ? "wow" : "calm", 0.9);
        // the bite taken out of the Sun's edge
        if (t > tb) disc(c0x, c0y, 2.2 * (1 - clamp01((t - tb - 0.6) / 0.6)), C.sunGlow);
        // his left hand cups the Sun from below
        ell(sx - 6, sy + sr + 2, 16, 5, 0.1, C.ink); ell(sx - 6, sy + sr + 1.5, 15, 4.2, 0.1, C.skin); ell(sx + 7, sy + sr - 2, 3, 5, -0.5, C.skin);
        // the crumb, glowing between his fingertips
        if (t > tb) {
          lighter(); glow(cx, cy, 16, C.sunGlow, 0.8); glow(cx, cy, 6, C.white, 0.9); normalBlend();
          disc(cx, cy, 1.9, C.sunCore); disc(cx, cy, 1, C.white);
          if (t < tb + 0.45) for (var k = 0; k < 12; k++) { var a = k * 0.52, d = (t - tb) * 70; rect(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1, 1, C.sunGlow); }
          if (t > tc) for (var sp = 0; sp < 6; sp++) { var su = ((t * 1.3 + sp / 6) % 1); rect(cx + Math.cos(sp) * su * 10, cy - su * 9, 1, 1, C.sunCore); }
        }
        var hx = t > tb ? cx : lerp(150, c0x, reach), hy = t > tb ? cy : lerp(260, c0y, reach);
        hand(hx + 1, hy, 1.0, 0, t > tb - 0.15);
        vignette(0.35, "rgba(10,5,40,");
      }

      // THAT'S WHY WE LIGHT DIYAS. EVERY LITTLE FLAME... IS A CRUMB OF THE SUN.
      var DIYAS = (function () { var a = []; for (var row = 0; row < 3; row++) for (var i = 0; i < 7 - row; i++) { var x = 14 + i * 26 + row * 13; if (row === 0 && Math.abs(x - 90) < 16) continue; a.push([x, 266 - row * 18, 1.15 - row * 0.2]); } return a; })();
      function sceneDiya(t) {
        var tf = WT(8, "every"), tc = WT(8, "crumb"), zEnd = DUR;
        var cam = camAt([[T_DIYA, 90, 196, 1.0], [tf, 92, 220, 1.4], [tc - 0.2, 96, 246, 2.6], [B(8) + 0.2, 97, 252, 3.4], [zEnd, 97.5, 268, 12]], t);
        sky([[0, C.night], [0.55, C.nightMid], [1, C.purple]]);
        setCam(cam, 0.25); stars(t, 0.8);
        // fireworks over the sea
        [[40, 70, 0.3, C.saree], [130, 56, 1.15, C.green], [90, 90, 2.0, C.gold], [30, 50, 2.85, C.blue], [150, 80, 3.7, C.red], [70, 44, 4.55, C.flame], [120, 100, 5.4, C.purple]].forEach(function (f, i) { burst(f[0], f[1], T_DIYA + f[2], t, f[3], 10 + i); });
        setCam(cam, 0.6);
        seaBody(206, t, C.nightLow, C.seaNight, C.seaGold);
        setCam(cam, 1);
        // ghat steps
        for (var s = 0; s < 4; s++) { rect(-40, 230 + s * 18, 260, 18, s % 2 ? C.stoneD : C.stone); rect(-40, 230 + s * 18, 260, 1.5, C.stoneL); }
        DIYAS.forEach(function (d, i) {
          var lt = T_DIYA + 0.25 + 0.22 * (i % 6) + 0.05 * i;
          diya(d[0], d[1] - 2, d[2], t, clamp01((t - lt) / 0.2), i, false);
        });
        // the hero diya, centre front: its flame has a tiny Sun face
        diya(82, 280, 1.8, t, 1, 99, t > tc - 0.1);
        vignette(0.25, "rgba(30,5,60,");
      }

      // ============================================================ the film
      PX.setup(C, {
        scenes: { hook: sceneHook, sunset: sceneSunset, net: sceneNet, hut: sceneHut, nomorning: sceneNoMorning, cold: sceneCold, wife: sceneWife, row: sceneRow, crumb: sceneCrumb, diya: sceneDiya },
        sceneAt: function (t) {
          return t < T_SUNSET ? "hook" : t < T_NET ? "sunset" : t < T_HUT ? "net" : t < T_NOMORN ? "hut" : t < T_COLD ? "nomorning"
            : t < T_WIFE ? "cold" : t < T_ROW ? "wife" : t < T_CRUMB ? "row" : t < T_DIYA ? "crumb" : t < LOOP ? "diya" : "hook";
        },
        cuts: [[T_NET, "sunset", "net"], [T_HUT, "net", "hut"], [T_NOMORN, "hut", "nomorning"], [T_COLD, "nomorning", "cold"], [T_WIFE, "cold", "wife"], [T_ROW, "wife", "row"], [T_DIYA, "crumb", "diya"]],
        post: function (t, img) {
          if (t < 0.14) tintImg(img, C.white, 1 - t / 0.14);
          var gl = T_SUNSET - 0.3;
          if (t > gl && t < gl + 0.5) glitchRows(img, 24 * Math.sin((t - gl) / 0.5 * Math.PI), Math.floor(t * 30));
          var tb = WT(2, "burning");
          if (t > tb && t < tb + 0.18) tintImg(img, C.white, 0.9 * (1 - (t - tb) / 0.18));
          if (t > T_FREE && t < T_FREE + 0.25) tintImg(img, C.sunCore, 0.8 * (1 - (t - T_FREE) / 0.25));
          var rw = T_CRUMB - 0.42;
          if (t > rw && t < T_CRUMB + 0.05) glitchRows(img, 18 * Math.sin((t - rw) / 0.47 * Math.PI), Math.floor(t * 30) + 5);
          var tc = WT(7, "broke");
          if (t > tc && t < tc + 0.12) tintImg(img, C.sunCore, 0.6 * (1 - (t - tc) / 0.12));
          if (t > LOOP - 0.9 && t < LOOP) tintImg(img, C.sunCore, 0.95 * ramp(t, LOOP - 0.9, LOOP));
          if (t >= LOOP) tintImg(img, C.white, 1);
        },
        captions: (window.CAPS || []).map(function (c) {
          return { a: c.a, b: c.b, lines: c.segs.map(function (ln) { return ln.map(function (s) { return [s[0], s[1] === "g" ? C.gold : C.paper]; }); }) };
        }),
        ui: clockUI,
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { PX.render(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
