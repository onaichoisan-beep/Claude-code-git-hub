<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Who's Fishing Who</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <section id="stage" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <canvas id="world" width="180" height="320" data-layout-allow-overflow></canvas>
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <!-- built by scripts/synth_audio.py: sound effects only, no narration -->
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="18" data-track-index="1"></audio>
    </div>
    <script src="pixel-engine.js"></script>
    <script>
      var C = {
        sky: "#3ab4ff", skyHi: "#a8e8ff", sun: "#fff27a", sunHalo: "#ffd040", cloud: "#ffffff", cloudShade: "#c8e4ff",
        seaTop: "#22d8e8", seaMid: "#1a84e0", seaDeep: "#3a34b8", abyss: "#24166a", foam: "#e8ffff", ray: "#bff8ff",
        boat: "#ff4a4a", boatDark: "#b02a40", boatWhite: "#f4f4ff", wood: "#c87a3a",
        coat: "#ffd02a", coatDark: "#d09a10", pants: "#2a4ad8", skin: "#f0aa78", skinShade: "#c07a50", cap: "#ff5a2a",
        fishS: "#ff8a1a", fishS2: "#ffd04a", fishM: "#3ae070", fishM2: "#c8ff6a", giant: "#8a3ad8", giant2: "#c070ff",
        lantern: "#fff27a", lanternGlow: "#ffe040", teeth: "#ffffff", hat: "#ff3a8a", hat2: "#2a8aff",
        bun: "#f0a840", bunDark: "#b0602a", patty: "#6a3a2a", lettuce: "#5ae050", tomato: "#ff3a3a",
        worm: "#ff7ab8", wormDark: "#c84a8a", lure: "#e8f4ff", lureGold: "#ffc83a",
        rock: "#2a9aaa", rockDark: "#1a5a8a", kelp: "#3ad07a", kelpDark: "#1a8a5a", plankton: "#7affd8",
        rod: "#8a4a2a", fline: "#f0faff", white: "#ffffff", ink: "#06050a", gold: "#ffe27a", bubble: "#c8f8ff",
      };

      // ============================================================ helpers
      // keyed path: [[t, x, y], ...] eased between keys
      function path(keys, t) {
        if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2] };
        for (var i = 0; i < keys.length - 1; i++) {
          var a = keys[i], b = keys[i + 1];
          if (t < b[0]) { var e = ease((t - a[0]) / (b[0] - a[0])); return { x: lerp(a[1], b[1], e), y: lerp(a[2], b[2], e) }; }
        }
        var L = keys[keys.length - 1];
        return { x: L[1], y: L[2] };
      }
      function bob(t, k, amp) { return Math.sin(t * 2.2 + k) * (amp || 1.2); }
      function pulse(t, a, b) { return t >= a && t < b ? Math.sin(Math.PI * (t - a) / (b - a)) : 0; }

      // ============================================================ story timeline (story time)
      var T = { burgerUp: 2.3, sniff: 3.5, manChomp: 4.1, yank: 4.4, splash: 4.6,
        sCheer: 6.0, wormSeen: 7.2, sChomp: 7.8, sYank: 7.95, mCheer: 9.2, mChomp: 10.3, mYank: 10.45,
        gReveal: 11.8, gSee: 12.6, gChomp: 13.3, bang: 13.45, ring: 13.9, tug: 16.8, whip: 17.3 };

      var MAN = [[0, 92, -12], [4.4, 92, -12], [4.52, 84, -34], [4.66, 78, 6], [6.0, 76, 104], [7.95, 76, 104], [9.3, 92, 262], [10.45, 92, 262], [11.9, 112, 448], [13.9, 112, 448], [14.9, 146, 496]];
      var S = [[0, 52, 152], [7.95, 52, 152], [9.3, 72, 300], [10.45, 72, 300], [11.9, 72, 500], [13.9, 72, 500], [14.9, 86, 464]];
      var M = [[0, 130, 338], [10.45, 130, 338], [11.9, 44, 540], [13.9, 44, 540], [14.9, 30, 574]];
      var G = { x: 95, y: 612 };
      var MANWORM = [[0, 130, 62], [4.4, 130, 62], [6.0, 108, 150], [9.3, 124, 312], [11.9, 156, 566], [12.8, 152, 598]];
      var CAM = [[0, 90, -70, 1], [4.75, 90, -70, 1], [6.1, 82, 72, 1.12], [7.95, 82, 72, 1.12], [9.3, 100, 236, 1.05], [10.45, 100, 236, 1.05], [11.9, 92, 470, 0.92], [13.5, 96, 492, 1.0], [14.9, 90, 536, 0.85], [17.3, 90, 536, 0.88], [17.75, 92, 60, 1.0]];

      // ============================================================ world
      function sky(cam) {
        rect(-400, -600, 980, 600, vgrad(-260, 0, [[0, C.sky], [1, C.skyHi]]));
        lighter(); glow(150, -160, 60, C.sunHalo, 0.5); normalBlend();
        disc(150, -160, 16, C.sun);
        [[30, -150, 1], [120, -112, 0.8], [-10, -96, 0.7]].forEach(function (c) {
          var x = c[0], y = c[1], s = c[2];
          ell(x, y, 22 * s, 7 * s, 0, C.cloudShade); ell(x - 4 * s, y - 4 * s, 16 * s, 8 * s, 0, C.cloud); ell(x + 10 * s, y - 2 * s, 10 * s, 6 * s, 0, C.cloud);
        });
      }
      function gull(x, y, t) {
        var f = Math.sin(t * 9) * 2.5;
        line(x - 6, y - f, x, y, 1.2, C.white); line(x, y, x + 6, y - f, 1.2, C.white);
      }
      function sea(t) {
        rect(-400, 0, 980, 1400, vgrad(0, 700, [[0, C.seaTop], [0.28, C.seaMid], [0.62, C.seaDeep], [1, C.abyss]]));
        // light rays from the surface
        lighter();
        var rg = g.createLinearGradient(0, 0, 0, 380);
        rg.addColorStop(0, "rgba(191,248,255,0.16)"); rg.addColorStop(1, "rgba(191,248,255,0)");
        for (var i = 0; i < 7; i++) {
          var x = -30 + i * 38 + Math.sin(t * 0.6 + i) * 6;
          g.fillStyle = rg; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 10, 0); g.lineTo(x + 80, 380); g.lineTo(x + 46, 380); g.closePath(); g.fill();
        }
        normalBlend();
      }
      function surface(t) {
        // wavy surface band
        g.fillStyle = C.foam; g.beginPath(); g.moveTo(-400, 0);
        for (var x = -400; x <= 580; x += 6) g.lineTo(x, Math.sin(x * 0.15 + t * 3) * 1.2);
        g.lineTo(580, 3); g.lineTo(-400, 3); g.closePath(); g.fill();
        for (var k = 0; k < 14; k++) { var wx = ((k * 37 + t * 12) % 260) - 40; rect(wx, 5 + (k % 3) * 3, 6, 1, C.foam); }
      }
      function rockKelp(t) {
        for (var k = 0; k < 4; k++) {
          var bx = 18 + k * 12, h = 46 + k * 9;
          g.strokeStyle = k % 2 ? C.kelp : C.kelpDark; g.lineWidth = 3; g.lineCap = "round"; g.beginPath(); g.moveTo(bx, 210);
          for (var s = 1; s <= 8; s++) g.lineTo(bx + Math.sin(t * 1.6 + s * 0.8 + k) * 4, 210 - h * s / 8);
          g.stroke();
        }
        ell(52, 182, 30, 18, 0, C.rockDark); ell(48, 174, 24, 12, 0, C.rock); rect(40, 168, 10, 2, C.ray);
      }
      function plankton(t, y0, y1) {
        lighter();
        for (var i = 0; i < 40; i++) {
          var x = hash1(i * 3.3) * 220 - 20, y = y0 + hash1(i * 7.1) * (y1 - y0) + Math.sin(t + i) * 3;
          var a = 0.4 + 0.4 * Math.sin(t * 3 + i * 2);
          glow(x, y, 3, C.plankton, a); rect(x, y, 1, 1, C.plankton);
        }
        normalBlend();
      }
      function bubbles(x, y, t, n, seed, spread) {
        for (var i = 0; i < n; i++) {
          var ph = (t * (0.7 + hash1(i + seed) * 0.6) + hash1(i * 5 + seed)) % 1;
          var bx = x + (hash1(i * 9 + seed) - 0.5) * (spread || 8) + Math.sin(t * 5 + i) * 1.5, by = y - ph * 40;
          g.strokeStyle = C.bubble; g.lineWidth = 0.8; g.beginPath(); g.arc(bx, by, 0.8 + hash1(i + seed * 2) * 1.6, 0, 6.28); g.stroke();
        }
      }
      function splash(x, t, t0) {
        var d = t - t0;
        if (d < 0 || d > 0.9) return;
        var k = 1 - d / 0.9;
        ell(x, 0, 30 * easeOut(d / 0.3) + 4, 5 * k + 1, 0, C.foam);
        for (var i = 0; i < 26; i++) {
          var a = -Math.PI * (0.1 + 0.8 * hash1(i * 3.1)), v = 60 + 90 * hash1(i * 7.7);
          var px = x + Math.cos(a) * v * d * 0.8, py = Math.sin(a) * v * d + 160 * d * d;
          if (py < 2) disc(px, py, 1.6 + 1.4 * hash1(i), i % 3 ? C.foam : C.seaTop);
        }
        // crown
        for (var j = -3; j <= 3; j++) { var h = (22 - Math.abs(j) * 4) * Math.sin(Math.PI * Math.min(1, d / 0.6)); poly([[x + j * 6 - 2, 0], [x + j * 6 + 2, 0], [x + j * 7.5, -h]], C.foam); }
      }

      // ============================================================ props
      function burger(x, y, s) {
        g.save(); g.translate(x, y); g.scale(s, s);
        ell(0, -3, 6, 3.6, 0, C.bun); rect(-6, -2, 12, 1.5, C.lettuce); rect(-5.5, -0.6, 11, 1.2, C.tomato); rect(-6, 0.6, 12, 2, C.patty); ell(0, 3.2, 6, 1.8, 0, C.bunDark);
        rect(-3, -5, 1, 1, C.white); rect(1, -5.5, 1, 1, C.white); rect(3, -4, 1, 1, C.white);
        g.restore();
      }
      function worm(x, y, t) {
        for (var i = 0; i < 6; i++) disc(x + Math.sin(t * 8 + i * 0.9) * 2, y + i * 2.2, 1.7, i % 2 ? C.worm : C.wormDark);
        disc(x + Math.sin(t * 8) * 2, y - 0.5, 1.2, C.ink);
      }
      function lure(x, y, t) {
        var w = Math.abs(Math.cos(t * 7)) * 3.5 + 0.8;
        ell(x, y, w, 5, 0, C.lure); ell(x, y + 1, w * 0.5, 3, 0, C.lureGold);
        if (Math.cos(t * 7) > 0.85) { lighter(); glow(x, y, 9, C.white, 0.9); normalBlend(); }
      }
      function fline(x1, y1, x2, y2) { line(x1, y1, x2, y2, 0.7, C.fline); }
      function bang(x, y, t, t0) {
        var d = t - t0; if (d < 0 || d > 0.9) return;
        var s = d < 0.12 ? d / 0.12 * 1.3 : 1;
        rrect(x - 3 * s, y - 13 * s, 6 * s, 9 * s, 1, C.white); rect(x - 1.2 * s, y - 12 * s, 2.4 * s, 6 * s, C.tomato); rect(x - 1.2 * s, y - 4.5 * s, 2.4 * s, 2 * s, C.tomato);
      }

      // ============================================================ characters
      // fisherman: origin at hips. o: rot, sleep, chomp(0..1), puff, rodA (radians, up-right), hold (burger in mouth)
      function man(x, y, s, o, t) {
        g.save(); g.translate(x, y); g.rotate(o.rot || 0); g.scale(s, s);
        var under = o.under;
        // legs
        if (under) { line(-2, 2, -4 + Math.sin(t * 9) * 2, 11, 3, C.pants); line(2, 2, 4 - Math.sin(t * 9) * 2, 11, 3, C.pants); }
        else { line(-2, 2, 8, 3, 3, C.pants); line(2, 2, 10, 5, 3, C.pants); }
        rrect(-4.5, -9, 9, 12, 2, C.coat); rect(-4.5, -3, 9, 1, C.coatDark);
        // rod arm
        var a = o.rodA, hx = 5, hy = -4;
        line(0, -7, hx, hy, 2.2, C.coat); disc(hx, hy, 1.4, C.skin);
        line(hx, hy, hx + Math.cos(a) * 18, hy - Math.sin(a) * 18, 1.1, C.rod);
        // other arm
        if (under) line(0, -7, -6 + Math.sin(t * 10) * 2, -14, 2.2, C.coat); else line(0, -7, -5, -1, 2.2, C.coat);
        // head
        disc(0, -13.5, 4.4, C.skin);
        if (o.puff) { disc(-3.4, -12, 2.2, C.skinShade); disc(3.4, -12, 2.2, C.skinShade); disc(-3, -12.5, 1.8, C.skin); disc(3, -12.5, 1.8, C.skin); }
        ell(0, -17.2, 4.8, 2.4, 0, C.cap); rect(1, -16.2, 6, 1.4, C.cap);
        if (o.sleep) { rect(-2.5, -14, 2, 0.8, C.ink); rect(1, -14, 2, 0.8, C.ink); }
        else { disc(-1.5, -14, 1.3, C.white); disc(2, -14, 1.3, C.white); rect(-1.4, -14.4, 0.9, 0.9, C.ink); rect(2.1, -14.4, 0.9, 0.9, C.ink); }
        if (o.chomp > 0) ell(1, -10.6, 2.2, 1.6 * o.chomp, 0, C.ink);
        g.restore();
        // world-space rod tip and mouth
        var ca = Math.cos(o.rot || 0), sa = Math.sin(o.rot || 0);
        function W(px, py) { return { x: x + (px * ca - py * sa) * s, y: y + (px * sa + py * ca) * s }; }
        return { tip: W(hx + Math.cos(a) * 18, hy - Math.sin(a) * 18), mouth: W(1, -10.4) };
      }
      // fish: origin at body centre. o: face(1 right/-1 left), col, col2, s, mouth(0..1), rodA, reel, cheer, hat, angler
      function fish(x, y, o, t) {
        var s = o.s, f = o.face;
        g.save(); g.translate(x, y); g.scale(f * s, s);
        var wag = Math.sin(t * 7) * 2;
        poly([[-8, 0], [-17, -7 + wag], [-15, 0], [-17, 7 + wag]], o.col2);
        ell(0, 0, 11, o.angler ? 9 : 7, 0, o.col);
        ell(1, 2.6, 7.5, o.angler ? 5 : 3.4, 0, o.col2);
        poly([[-4, -6], [4, -6.5], [-2, -11]], o.col2);
        if (o.angler) {
          // lantern stalk + bulb
          g.strokeStyle = o.col2; g.lineWidth = 1.2; g.beginPath(); g.moveTo(3, -8); g.quadraticCurveTo(10, -20, 15, -14); g.stroke();
        }
        // eye
        disc(5, -2.5, o.angler ? 3.2 : 2.7, C.white); disc(5.8 + (o.look || 0), -2.5, o.angler ? 1.6 : 1.3, C.ink);
        if (o.angler) poly([[2.2, -6.4], [7.8, -5.4], [7.4, -4.6], [2.4, -5.6]], C.ink);
        // mouth
        var m = o.mouth || 0;
        if (o.angler) {
          poly([[11, 0.5], [3, 1.5 + 4 * m], [11, 2 + 6 * m]], C.ink);
          for (var k = 0; k < 3; k++) { poly([[10 - k * 2.5, 0.5], [9 - k * 2.5, 0.5], [9.5 - k * 2.5, 2.2]], C.teeth); poly([[10 - k * 2.5, 2 + 6 * m], [9 - k * 2.5, 2 + 6 * m], [9.5 - k * 2.5, 0.3 + 6 * m]], C.teeth); }
        } else if (m > 0) ell(10, 1, 1.8, 1.8 * m, 0, C.ink);
        else rect(8.6, 1, 2.2, 0.8, C.ink);
        // hat
        if (o.hat) { rect(-4, -8.6, 9, 1.4, o.hat); rrect(-2.4, -12, 6, 3.6, 1.4, o.hat); rect(-2.4, -9.6, 6, 0.8, C.white); }
        // fins: cheering = up, else holding the rod
        var a = o.rodA, hx = 1, hy = 3;
        if (o.cheer > 0) {
          var up = Math.sin(t * 18) * 1.5;
          ell(-2, -9 - up, 1.8, 3.4, -0.4, o.col2); ell(5, -9 + up, 1.8, 3.4, 0.4, o.col2);
        }
        ell(hx, hy + 1, 3.2, 1.8, 0.5, o.col2);
        line(hx, hy, hx + Math.cos(a) * 16, hy - Math.sin(a) * 16, 1.1, C.rod);
        // reel with spinning crank
        disc(hx + 2, hy + 1, 1.8, C.lure);
        var cr = o.reel ? t * 30 : 0.6;
        line(hx + 2, hy + 1, hx + 2 + Math.cos(cr) * 2.6, hy + 1 + Math.sin(cr) * 2.6, 0.8, C.ink);
        g.restore();
        var tip = { x: x + f * s * (hx + Math.cos(a) * 16), y: y + s * (hy - Math.sin(a) * 16) };
        var mouth = { x: x + f * s * 10.5, y: y + s * 1.2 };
        if (o.angler) {
          var bulb = { x: x + f * s * 15, y: y + s * -13 };
          lighter(); glow(bulb.x, bulb.y, 26 * s / 2, C.lanternGlow, 0.65); normalBlend();
          disc(bulb.x, bulb.y, 2.4 * s, C.lantern);
        }
        return { tip: tip, mouth: mouth };
      }

      // ============================================================ the scene (continuous)
      function sceneOcean(t, rt) {
        var cam = camAt(CAM, t);
        // cold open + loop tail: a tight close-up on the yank
        if (rt < 1.6 || rt >= 17.75) { cam.z *= 1.7; cam.x = 86; cam.y = -36; }
        shake(cam, t, T.splash, 7, 0.5);
        shake(cam, t, T.gChomp, 9, 0.6);
        shake(cam, t, T.tug, 5, 0.6);
        if (t > T.tug && t < T.whip) { var f = Math.floor(rt * 30); cam.x += (hash1(f) - 0.5) * 3; cam.y += (hash1(f + 9) - 0.5) * 3; }
        screen(); g.fillStyle = C.abyss; g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        sky(cam); gull(40 + ((rt * 14) % 160), -60 + Math.sin(rt) * 4, rt); gull(150 - ((rt * 9) % 180), -84, rt + 1);
        sea(t);
        rockKelp(t);
        plankton(t, 420, 720);

        // ---- the giant (deep)
        var gMouth = 0, gLook = 0;
        if (t > T.gReveal && t < T.gSee) gMouth = 0.3 + 0.2 * Math.sin(t * 6); // grin
        if (t > T.gSee) gLook = 0.6;
        if (t > T.gChomp - 0.25 && t < T.gChomp + 0.3) gMouth = t < T.gChomp ? ramp(t, T.gChomp - 0.25, T.gChomp) : 1 - ramp(t, T.gChomp, T.gChomp + 0.3);
        var gReel = t > T.mYank && t < T.gReveal;
        var gfx = fish(G.x, G.y + bob(t, 0, 2), { s: 2.4, face: 1, col: C.giant, col2: C.giant2, mouth: gMouth, rodA: 2.2, reel: gReel, cheer: (t > T.gReveal && t < T.gSee) ? 1 : 0, hat: C.hat2, angler: true, look: gLook }, t);

        // ---- the medium fish
        var mp = path(M, t);
        var mHooked = t >= T.mChomp;
        var mMouth = pulse(t, T.mChomp - 0.2, T.mChomp + 0.15);
        var mfx = fish(mp.x, mp.y + bob(t, 1), { s: 1.35, face: t > 9.9 && t < T.mChomp + 0.4 ? 1 : -1, col: C.fishM, col2: C.fishM2, mouth: mMouth, rodA: 1.9, reel: t > T.sYank && t < T.mCheer, cheer: t > T.mCheer && t < 9.95 ? 1 : 0, hat: C.hat }, t);

        // ---- the small fish
        var sp = path(S, t);
        var sMouth = pulse(t, T.sChomp - 0.2, T.sChomp + 0.15);
        var sface = t > T.wormSeen && t < T.sChomp + 0.3 ? -1 : 1;
        var sfx = fish(sp.x, sp.y + bob(t, 2), { s: 1.0, face: sface, col: C.fishS, col2: C.fishS2, mouth: sMouth, rodA: 1.25, reel: t > T.splash && t < T.sCheer, cheer: t > T.sCheer && t < 7.0 ? 1 : 0, hat: C.cap }, t);

        // ---- the fisherman
        var mn = path(MAN, t), under = t > T.splash;
        var rot = 0;
        if (t > T.yank) rot = t < T.splash ? lerp(0, 2.6, ramp(t, T.yank, T.splash)) : 2.9 + Math.sin(t * 2) * 0.15;
        var chomp = t > T.sniff + 0.3 && t < T.manChomp ? ramp(t, T.sniff + 0.3, T.manChomp - 0.1) : 0;
        var mfr = man(mn.x, mn.y + (t < T.yank ? Math.sin(t * 1.8) * 0.8 : 0), 1, { rot: rot, sleep: t < T.sniff, chomp: chomp, puff: under, under: under, rodA: under ? 0.4 : 0.9 }, t);

        // boat (in front of the man's legs)
        if (cam.y < 200) {
          var by = Math.sin(t * 1.8) * 0.8 + (t > T.yank && t < T.yank + 1 ? Math.sin((t - T.yank) * 20) * 2 * (1 - (t - T.yank)) : 0);
          poly([[62, -6 + by], [124, -6 + by], [116, 6 + by], [70, 6 + by]], C.boat);
          rect(62, -6 + by, 62, 2, C.boatWhite); rect(68, 1 + by, 52, 1.5, C.boatDark);
          worldText("FISH", 93, -2 + by, 0.5, C.boatWhite);
        }
        surface(t);

        // ---- lines + baits
        // the small fish's burger line
        var burgerPos;
        if (t < T.manChomp) burgerPos = { x: 100, y: lerp(30, -10, ramp(t, T.burgerUp, T.burgerUp + 1.1)) + Math.sin(t * 2.5) };
        else burgerPos = mfr.mouth;
        fline(sfx.tip.x, sfx.tip.y, burgerPos.x, burgerPos.y - 4);
        burger(burgerPos.x, burgerPos.y, t < T.manChomp ? 1 : 0.6);
        // the medium fish's worm (for the small fish)
        var mw = t < T.sChomp ? { x: 34 + Math.sin(t * 1.3) * 2, y: lerp(60, 128, ramp(t, 6.4, 7.2)) } : sfx.mouth;
        fline(mfx.tip.x, mfx.tip.y, mw.x, mw.y);
        if (t > 6.2) worm(mw.x, mw.y, t);
        // the giant's lure (for the medium fish)
        var gl = t < T.mChomp ? { x: 152 + Math.sin(t * 1.1) * 2, y: lerp(260, 318, ramp(t, 8.8, 9.6)) } : mfx.mouth;
        fline(gfx.tip.x, gfx.tip.y, gl.x, gl.y);
        lure(gl.x, gl.y, t);
        // the fisherman's own worm (for the giant)
        var ww = t < T.gChomp ? path(MANWORM, t) : gfx.mouth;
        fline(mfr.tip.x, mfr.tip.y, ww.x, ww.y);
        worm(ww.x, ww.y, t + 1);

        // bubbles from the man
        if (under) bubbles(mn.x, mn.y + 6, t, 6, 3, 6);
        // Z's while napping
        if (t < T.sniff) for (var z = 0; z < 3; z++) { var ph = (t * 0.6 + z / 3) % 1; worldText("Z", mn.x + 8 + ph * 10, mn.y - 22 - ph * 16, 0.5 + ph * 0.4, C.white); }
        // the big "!" moment: everybody realises
        bang(mn.x, mn.y - 24, t, T.bang);
        bang(sp.x, sp.y - 16, t, T.bang + 0.08);
        bang(mp.x, mp.y - 20, t, T.bang + 0.16);
        bang(G.x + 6, G.y - 46, t, T.bang + 0.24);
        // giant reveal: lantern pulses the water
        if (t > T.gReveal - 0.4 && t < T.ring) { lighter(); glow(G.x + 36, G.y - 31, 70, C.lanternGlow, 0.25 * ramp(t, T.gReveal - 0.4, T.gReveal + 0.3)); normalBlend(); }
        // whip up: speed lines
        if (t > T.whip) {
          screen(); g.globalAlpha = 0.7;
          for (var i = 0; i < 24; i++) rect(hash1(i * 4.1) * W, ((hash1(i * 2.3) * H) + rt * 900) % H, 1, 20 + hash1(i) * 30, C.white);
          g.globalAlpha = 1;
        }
        splash(80, t, T.splash);
        vignette(0.4, "rgba(10,10,60,");
      }

      // real time -> story time: the cold open is a slow-motion replay of the splash,
      // the story runs 1.6 -> 17.75, and the last quarter-second leads back into the splash (loop)
      function storyT(t) {
        if (t < 1.6) return 4.45 + t * 0.35;
        if (t >= 17.75) return 4.45 - (18 - t);
        return t;
      }

      var WH = C.white, GD = C.gold;
      PX.setup(C, {
        scenes: { ocean: function (t) { sceneOcean(storyT(t), t); } },
        sceneAt: function () { return "ocean"; },
        cuts: [],
        post: function (t, img) {
          if (t > 1.42 && t < 1.92) glitchRows(img, 34 * (1 - Math.abs(t - 1.67) / 0.25), Math.floor(t * 30));
          if (t < 1.6) { var sp = 0.43; if (t > sp && t < sp + 0.3) tintImg(img, C.white, 0.7 * (1 - ramp(t, sp, sp + 0.3))); }
          if (t > 4.6 && t < 4.9) tintImg(img, C.white, 0.55 * (1 - ramp(t, 4.6, 4.9)));
          if (t > 13.3 && t < 13.55) tintImg(img, C.white, 0.5 * (1 - ramp(t, 13.3, 13.55)));
          if (t > 17.45 && t < 17.95) tintImg(img, C.white, t < 17.75 ? ramp(t, 17.45, 17.75) : 1 - ramp(t, 17.75, 17.95));
        },
        captions: [
          { a: 0.4, b: 1.5, lines: [[["TODAY'S CATCH:", WH]], [["A HUMAN", GD]]] },
          { a: 14.6, b: 17.35, lines: [[["WHO'S FISHING", WH]], [["WHO?", GD]]] },
        ],
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: 18, duration: 18, ease: "none", onUpdate: function () { PX.render(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
