        vignette(0.35, "rgba(10,6,30,");
      }

      function sceneAt(t) { return t < T.COUNT ? "now" : t < T.HIT ? "road" : t < T.ANC ? "grid" : t < T.REWIND ? "anc" : "now"; }

      function drawUI(t) {
        var l1, l2 = "", c1 = C.gold, c2 = C.white, S1 = 3;
        if (t < T.COUNT || t >= T.REWIND) { l1 = "ALIVE NOW: ~8 BILLION"; S1 = 2; c1 = C.gold; l2 = "EVER LIVED: ???"; }
        else if (t < T.START) { l1 = "REWINDING..."; S1 = 2; c1 = C.white; }
        else if (t < T.HUNT) { l1 = commas(yearsAgo(camX(t))); l2 = "YEARS AGO"; }
        else if (t < T.BREAK) { l1 = commas(bornAt(t)); l2 = "HUMANS EVER BORN"; c1 = C.gold; }
        else if (t < T.HIT) { l1 = ""; }
        else if (t < T.GONE) { l1 = "117,000,000,000"; c1 = Math.floor(t * 6) % 2 ? C.red : C.white; l2 = "HUMANS EVER BORN"; c2 = C.gold; }
        else if (t < T.SEVEN) { l1 = "1 ALIVE : 14 GONE"; S1 = 2; c1 = C.gold; l2 = "~109 BILLION GONE"; c2 = C.cyan; }
        else if (t < T.ANC) { l1 = "7%"; c1 = C.green; l2 = "OF ALL HUMANS EVER"; }
        else { l1 = "YOU: 1 OF THE 7%"; S1 = 2; c1 = C.gold; l2 = "MAKE IT COUNT"; c2 = C.green; }
        if (l1) counterLines(l1, c1, S1, l2, c2);
      }

      KIT.start(C, T, {
        scenes: { now: scene_now, road: scene_road, grid: scene_grid, anc: scene_anc }, sceneAt: sceneAt, ui: drawUI, hitCol: "#fff0a0",
        cuts: [[T.COUNT, "now", "road"], [T.ANC, "grid", "anc"]],
      });
    </script>
  </body>
</html>
