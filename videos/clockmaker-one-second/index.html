        // a tall brass clock-machine with glass tubes
        rect(x - 24, y - 110, 48, 110, C.ink); rect(x - 23, y - 109, 46, 108, C.brassD); rect(x - 23, y - 109, 46, 4, C.brass);
        for (var i = 0; i < 4; i++) { var tx = x - 18 + i * 12; rect(tx, y - 70, 6, 50, C.ink); rect(tx + 1, y - 69, 4, 48, C.zap); var lv = on * (0.4 + 0.6 * Math.abs(Math.sin(t * 3 + i))); rect(tx + 1, y - 21 - 48 * lv, 4, 48 * lv, C.gold); }
        clockFace(x, y - 88, 15, on > 0 ? t * 6 : 2.1, C.face);
        gear(x - 26, y - 40, 9, t * 2 * on, 9, C.copper, C.copperD); gear(x + 26, y - 60, 7, -t * 2.6 * on, 8, C.copper, C.copperD);
        for (var p = 0; p < 3; p++) line(x + 24, y - 100 + p * 30, x + 40, y - 96 + p * 30, 2, C.copper);
        if (on > 0) { lighter(); glow(x, y - 60, 60 * on, C.zap, 0.35); normalBlend(); }
      }
      function sceneShop(t) {
        var ts = WT(3, "steal"), tj = WT(3, "just"), t1 = WT(3, "second");
        var cam = camAt([[T_SHOP, 90, 176, 1.05], [ts, 96, 178, 1.15], [tj, 96, 160, 1.35], [T_EARTH, 96, 150, 1.6]], t);
        shake(cam, t, ts, 5, 0.5); shake(cam, t, t1, 4, 0.3);
        sky([[0, C.cityD], [1, C.city]]);
        setCam(cam, 1);
        // shelves of parts
        for (var sh = 0; sh < 3; sh++) { rect(-60, 70 + sh * 40, 300, 3, C.woodD); for (var q = 0; q < 10; q++) gear(-40 + q * 26 + sh * 9, 62 + sh * 40, 4 + (q % 3), t * (q % 2 ? 1 : -1), 7, C.brass, C.brassD); }
        rect(-60, 282, 300, 60, C.woodD);
        var on = clamp01((t - ts) / 0.4);
        machine(96, 282, t, on);
        // the clockmaker hammering at the bench (before) / standing back in awe (after)
        var ham = t < ts ? Math.max(0, Math.sin((t - T_SHOP) * 19.6)) : 0;
        rect(10, 254, 44, 6, C.woodL); rect(14, 260, 4, 22, C.woodD); rect(46, 260, 4, 22, C.woodD);
        clockmaker(30, 282, 1.25, t, { pose: t < ts ? "work" : "stand", look: 1 });
        if (t < ts) { line(48, 236 - ham * 6, 52, 252 - ham * 8, 1.4, C.woodL); rect(49, 234 - ham * 6, 6, 3, C.greyD);
          if (ham > 0.95) for (var s = 0; s < 6; s++) rect(54 + (hash1(s + Math.floor(t * 30)) - 0.5) * 14, 250 - hash1(s + 4 + Math.floor(t * 30)) * 10, 1, 1, C.spark); }
        if (on > 0 && t < ts + 0.6) for (var z = 0; z < 4; z++) { var zx = 96 + (hash1(z + Math.floor(t * 20)) - 0.5) * 60; line(zx, 170, zx + 8, 190, 1, C.zap); line(zx + 8, 190, zx - 4, 206, 1, C.zap); }
        // "just one second": a single glowing second pops out of the dial
        var sk = pop(t, t1 - 0.1);
        if (sk > 0) { lighter(); glow(96, 194, 26 * sk, C.gold, 0.8); normalBlend(); g.save(); g.translate(96, 194); g.scale(sk, sk); disc(0, 0, 6, C.gold); worldText("1", 0, -3.5, 1, C.ink); g.restore(); }
        vignette(0.4, "rgba(10,5,40,");
      }

      // ...FROM EVERY PERSON ON EARTH
      function sceneEarth(t) {
        var cam = camAt([[T_EARTH, 90, 200, 1.3], [T_POUR, 90, 186, 1.05]], t);
        sky([[0, C.space], [1, C.night]]);
        setCam(cam, 0.3); stars(t, 1);
        setCam(cam, 1);
        var ex = 90, ey = 262, er = 52;
        lighter(); glow(ex, ey, er + 20, C.earth, 0.5); normalBlend();
        disc(ex, ey, er, C.earth);
        g.save(); g.beginPath(); g.arc(ex, ey, er, 0, 6.2832); g.clip();
        var rot = t * 8;
        [[0, -20, 22, 14], [40, 10, 26, 18], [-30, 20, 18, 22], [70, -24, 16, 10], [-60, -10, 20, 12]].forEach(function (c) { var x = ((c[0] + rot + 200) % 240) - 120; ell(ex + x, ey + c[1], c[2], c[3], 0.3, C.earthG); });
        // night-side city lights: each one gives up a second
        for (var i = 0; i < 70; i++) { var lx = ex + (hash1(i) - 0.5) * er * 2, ly = ey + (hash1(i + 30) - 0.5) * er * 2; rect(lx, ly, 1, 1, C.win); }
        g.restore();
        for (var j = 0; j < 220; j++) {
          var a = hash1(j) * 6.2832, d = er * Math.sqrt(hash1(j + 9)), sx = ex + Math.cos(a) * d * 0.95, sy = ey + Math.sin(a) * d * 0.95;
          var u = ((t * 0.7 + hash1(j * 1.7)) % 1), px = lerp(sx, 90 + Math.sin(j) * 6, u * u), py = lerp(sy, 120, u);
          g.globalAlpha = Math.sin(u * Math.PI); rect(px, py, j % 4 ? 1 : 2, j % 4 ? 1 : 2, j % 3 ? C.gold : C.white);
        }
        g.globalAlpha = 1;
        vignette(0.3, "rgba(0,0,20,");
      }

      // EIGHT BILLION SECONDS... 250 YEARS OF LIFE (the river pours into her heart)
      function scenePour(t) {
        var tt = WT(4, "two"), cam = camAt([[T_POUR, 80, 190, 1.2], [tt, 72, 198, 1.45], [T_SPRING, 70, 200, 1.5]], t);
        bedroom(t, cam, true);
        var heal = clamp01((t - tt) / 1.2);
        river(t, 150, 140, 60, 246, 140, 0.9, 30, 7, 1);
        lighter(); glow(62, 248, 16 + 8 * Math.sin(t * 8), C.gold, 0.5 + 0.3 * heal); normalBlend();
        girl(64, 252, 1.25, t, { pose: "bed", pale: 1 - heal, eyes: heal > 0.4 ? "open" : "shut" });
        vignette(0.4, "rgba(10,10,40,");
      }

      // SHE SAW EVERY SPRING AFTER THAT (the seasons spin; she grows old at the window)
      function sceneSpring(t) {
        var p = clamp01((t - T_SPRING) / (T_LEAP - T_SPRING - 0.2)), years = p * 250, season = (years * 4) % 4;
        var cam = { x: 90, y: 182, z: 1.12 };
        sky([[0, C.wallD], [1, C.wall]]);
        setCam(cam, 1);
        // a big window onto the garden
        rect(16, 120, 148, 150, C.ink); rect(20, 124, 140, 142, season < 3 ? C.skyDay : C.skyDay2);
        g.save(); g.beginPath(); g.rect(20, 124, 140, 142); g.clip();
        rect(20, 236, 140, 30, season >= 3 ? C.snow : C.leaf);
        // the tree, cycling through spring / summer / autumn / winter
        rect(118, 170, 6, 70, C.woodD); line(121, 190, 104, 172, 3, C.woodD); line(121, 184, 138, 168, 3, C.woodD);
        var fol = season < 1 ? C.blossom : season < 2 ? C.leaf : season < 3 ? C.autumn : null, folL = season < 1 ? C.blossomL : season < 2 ? C.earthG : C.flame;
        if (fol) { [[121, 158, 22], [104, 166, 14], [140, 162, 15], [121, 140, 14]].forEach(function (c) { disc(c[0], c[1], c[2], fol); for (var d = 0; d < 6; d++) rect(c[0] + (hash1(d + c[0]) - 0.5) * c[2] * 1.4, c[1] + (hash1(d + c[1]) - 0.5) * c[2] * 1.2, 2, 2, folL); }); }
        else { FLAKES.slice(0, 30).forEach(function (f) { rect(20 + (f[0] + 40) % 140, 124 + (f[1] + t * 30) % 142, 1, 1, C.white); }); }
        if (season < 1) for (var pt = 0; pt < 10; pt++) rect(20 + (hash1(pt) * 140 + t * 30) % 140, 124 + (hash1(pt + 5) * 100 + t * 20) % 120, 2, 1, C.blossom);
        disc(40, 146, 8, season < 3 ? C.gold : C.white);
        g.restore();
        rect(88, 124, 4, 142, C.woodD); rect(20, 192, 140, 3, C.woodD); rect(12, 266, 156, 6, C.woodL);
        // she grows up and grows old at the window
        var age = p, hair = age < 0.6 ? C.hair : age < 0.85 ? C.greyD : C.grey;
        girl(60, 262 + (1 - Math.min(1, age * 2)) * 8, 1.2 + 0.25 * Math.min(1, age * 2), t, { pose: "sit", hair: hair, long: age > 0.25, wrinkles: age > 0.8, dress: age < 0.5 ? C.quiltL : C.teal });
        vignette(0.35, "rgba(10,10,40,");
      }
      function springUI(t) {
        if (t < T_SPRING + 0.2 || t > T_LEAP) return;
        var p = clamp01((t - T_SPRING) / (T_LEAP - T_SPRING - 0.2)), n = Math.max(1, Math.round(p * 250));
        box("SPRINGS SEEN", String(n), C.gold, p);
      }
      function box(label, val, col, prog) {
        var x = 14, y = 64, w = 160;
        u.fillStyle = "rgba(6,5,10,0.85)"; u.fillRect(x, y, w, 40);
        u.fillStyle = col; u.fillRect(x, y, 2, 40);
        uText(label, x + 6, y + 5, 1, C.paper);
        uText(val, x + 6, y + 16, 2, col);
        u.fillStyle = "#3a3450"; u.fillRect(x + 6, y + 33, w - 12, 2);
        u.fillStyle = col; u.fillRect(x + 6, y + 33, Math.round((w - 12) * clamp01(prog)), 2);
      }
      function pourUI(t) {
        if (t < T_POUR + 0.1 || t > T_SPRING) return;
        var te = WT(4, "seconds"), tt = WT(4, "that's");
        if (t < tt) { var p = clamp01((t - T_POUR) / (te - T_POUR + 0.3)); box("SECONDS STOLEN", p < 1 ? (8 * p * p).toFixed(2) + " BILLION" : "8 BILLION", C.gold, p); }
        else box("= LIFE GIVEN", "~250 YEARS", C.gold, 1);
      }

      // BUT A THIEF ALWAYS PAYS. SINCE 1972... 27 EXTRA SECONDS
      function digits(str, x, y, s, col, colD) {
        var w = str.length * 6 * s - s;
        rrect(x - w / 2 - 6, y - 6, w + 12, 7 * s + 12, 3, C.ink); rrect(x - w / 2 - 4, y - 4, w + 8, 7 * s + 8, 2, C.lab);
        worldText(str.replace(/[0-9]/g, "8"), x, y, s, C.ledG); worldText(str, x, y, s, col);
      }
      function sceneLeap(t) {
        var t72 = WT(6, "since"), t27 = WT(6, "twenty"), p = clamp01((t - t72 - 0.4) / (WT(6, "seconds") - t72 - 0.3));
        var cam = camAt([[T_LEAP, 90, 180, 1.0], [t72, 90, 184, 1.1], [T_DISP, 90, 188, 1.2]], t);
        shake(cam, t, WT(6, "pays"), 3, 0.3);
        sky([[0, C.lab], [1, C.labL]]);
        setCam(cam, 1);
        // racks of blinking machines (an atomic-clock lab)
        for (var r = 0; r < 6; r++) { rect(-50 + r * 48, 40, 40, 150, C.ink); rect(-48 + r * 48, 42, 36, 146, C.labL); for (var l = 0; l < 14; l++) if (Math.sin(t * (3 + l) + r * 2 + l) > 0.2) rect(-44 + r * 48 + (l % 4) * 8, 50 + Math.floor(l / 4) * 10, 3, 2, l % 3 ? C.led : C.cyan); }
        rect(-60, 282, 300, 60, C.ink); rect(-60, 282, 300, 2, C.cyan);
        // the display: the year rolls 1972 -> 2016 and the leap seconds stack up
        var year = 1972 + Math.round(44 * p), leaps = Math.round(27 * p);
        digits(t < t72 ? "UTC" : String(year), 90, 212, 3, C.led, C.ledD);
        // "+1" seconds fly up out of the display
        for (var k = 0; k < 9; k++) { var tk = t72 + 0.3 + 0.32 * k, uu = t - tk; if (uu > 0 && uu < 0.9) { g.globalAlpha = 1 - uu / 0.9; worldText("+1", 60 + (k % 3) * 30, 244 - uu * 26, 2, C.gold); g.globalAlpha = 1; } }
        // a little stack of gold seconds
        for (var s = 0; s < leaps; s++) disc(30 + (s % 9) * 15, 270 - Math.floor(s / 9) * 8, 3, s === leaps - 1 && t > t27 ? C.white : C.gold);
        vignette(0.35, "rgba(0,10,30,");
      }
      function leapUI(t) {
        if (t < WT(6, "since") || t > T_DISP) return;
        var p = clamp01((t - WT(6, "since") - 0.4) / (WT(6, "seconds") - WT(6, "since") - 0.3));
        box("LEAP SECONDS ADDED", String(Math.round(27 * p)), C.gold, p);
      }

      // SCIENTISTS CALL THEM LEAP SECONDS: 23:59:60.  SOME SAY... (his reflection in the glass)
      function sceneDisplay(t) {
        var t60 = T_6060, ts = WT(7, "some");
        var cam = camAt([[T_DISP, 90, 186, 1.2], [t60, 90, 186, 1.4], [T_BACK, 90, 188, 1.55]], t);
        shake(cam, t, t60, 3, 0.3);
        sky([[0, C.lab], [1, C.labL]]);
        setCam(cam, 1);
        var sec = t < t60 - 0.66 ? "58" : t < t60 - 0.33 ? "59" : t < t60 ? "59" : "60";
        var col = sec === "60" ? C.gold : C.led;
        if (sec === "60") { lighter(); glow(90, 242, 70, C.gold, 0.5); normalBlend(); }
        // some say... a figure in a top hat rises behind the clock, spectacles catching the light
        var rk = ease(clamp01((t - ts) / 0.9));
        if (rk > 0) { g.globalAlpha = 0.85 * rk; clockmaker(90, 312 - 20 * rk, 2.0, t, { pose: "stand", col: C.cityD, colL: C.city, glint: 1 }); g.globalAlpha = 1; }
        digits("23:59:" + sec, 90, 236, 2, col, C.ledD);
        vignette(0.4, "rgba(0,10,30,");
      }

      // ...HE'S PAYING IT BACK. (he tips his hat; the second falls home into the city)
      function sceneBack(t) {
        var tb = BEATS.BACK || T_BACK + 0.3, fall = clamp01((t - tb - 0.2) / 1.6);
        var cam = camAt([[T_BACK, 90, 176, 1.2], [tb + 0.3, 90, 172, 1.1], [LOOP, 90, 172, 1.18]], t);
        sky([[0, C.night], [0.6, C.nightMid], [1, C.nightLow]]);
        setCam(cam, 0.3); stars(t, 1);
        setCam(cam, 0.8);
        lighter(); glow(90, 86, 60, C.gold, 0.35); normalBlend();
        clockFace(90, 86, 38, t * 0.2 + 3, C.face);
        setCam(cam, 1);
        cityLine(t, 300); rect(-60, 300, 300, 60, C.cityD);
        rooftop();
        clockmaker(80, 246, 1.05, t, { pose: t > tb + 0.6 ? "tip" : "raise" });
        // the returned second: a falling star into the sleeping city
        if (t > tb - 0.2) {
          var sx = lerp(93, 150, fall), sy = lerp(203, 300, fall * fall);
          if (fall < 1) { lighter(); glow(sx, sy, 12, C.gold, 0.9); normalBlend(); disc(sx, sy, 2, C.white); for (var tr = 1; tr < 8; tr++) rect(sx - tr * 2.4 * (fall > 0 ? 1 : 0), sy - tr * 4 * (fall > 0 ? 1 : 0), 1, 1, C.gold); }
          else { lighter(); glow(150, 300, 30, C.gold, 0.6 * clamp01(1 - (t - tb - 1.8) / 0.5)); normalBlend(); }
        }
        vignette(0.35, "rgba(10,5,40,");
      }

      // ============================================================ the film
      PX.setup(C, {
        scenes: { hook: sceneHook, city: sceneCity, room: sceneRoom, shop: sceneShop, earth: sceneEarth, pour: scenePour, spring: sceneSpring, leap: sceneLeap, display: sceneDisplay, back: sceneBack },
        sceneAt: function (t) {
          return t < T1 ? "hook" : t < T_ROOM ? "city" : t < T_SHOP ? "room" : t < T_EARTH ? "shop" : t < T_POUR ? "earth" : t < T_SPRING ? "pour"
            : t < T_LEAP ? "spring" : t < T_DISP ? "leap" : t < T_BACK ? "display" : t < LOOP ? "back" : "hook";
        },
        cuts: [[T_ROOM, "city", "room"], [T_SHOP, "room", "shop"], [T_EARTH, "shop", "earth"], [T_POUR, "earth", "pour"], [T_SPRING, "pour", "spring"], [T_LEAP, "spring", "leap"], [T_DISP, "leap", "display"], [T_BACK, "display", "back"]],
        post: function (t, img) {
          if (t < 0.14) tintImg(img, C.white, 1 - t / 0.14);
          var gl = T1 - 0.3;
          if (t > gl && t < gl + 0.5) glitchRows(img, 22 * Math.sin((t - gl) / 0.5 * Math.PI), Math.floor(t * 30));
          var tk = BEATS.TOOK || 4;
          if (t > tk && t < tk + 0.12) tintImg(img, C.gold, 0.7 * (1 - (t - tk) / 0.12));
          var ts = WT(3, "steal");
          if (t > ts && t < ts + 0.1) tintImg(img, C.zap, 0.7 * (1 - (t - ts) / 0.1));
          if (t > T_6060 && t < T_6060 + 0.12) tintImg(img, C.gold, 0.6 * (1 - (t - T_6060) / 0.12));
          if (t > LOOP - 0.35 && t < LOOP) tintImg(img, C.white, ramp(t, LOOP - 0.35, LOOP));
          if (t >= LOOP) tintImg(img, C.white, 1);
        },
        captions: (window.CAPS || []).map(function (c) {
          return { a: c.a, b: c.b, lines: c.segs.map(function (ln) { return ln.map(function (s) { return [s[0], s[1] === "g" ? C.gold : C.paper]; }); }) };
        }),
        ui: function (t) { pourUI(t); springUI(t); leapUI(t); },
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { PX.render(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
