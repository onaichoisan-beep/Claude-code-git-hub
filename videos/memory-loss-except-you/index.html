      function stars(t) { for (var i = 0; i < 60; i++) { g.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * (1 + hash1(i)) + i)); rect(hash1(i * 3.3) * 180, hash1(i * 5.1 + 2) * 320, 0.6, 0.6, C.star); } g.globalAlpha = 1; }

        for (var c = 0; c < 26; c++) { var a = hash1(c * 2.3) * 6.28, d = hash1(c * 4.1) * (R - 6); rect(EX + Math.cos(a) * d, EY + Math.sin(a) * d * 0.95, 1, 1, C.light); }
        // the "?"s pop over the cities (same schedule as the audio)

        rect(-200, 280, 600, 100, C.street); for (var ln = 0; ln < 12; ln++) rect(-100 + ln * 30, 302, 14, 2, C.line);
        // cars stopped every which way, one crashed (smoke)
        function car(x, y, col, rot) { g.save(); g.translate(x, y); g.rotate(rot); rrect(-16, -8, 32, 10, 3, col); rrect(-9, -14, 18, 8, 3, col); rect(-7, -13, 6, 5, "#a8d8f0"); rect(1, -13, 6, 5, "#a8d8f0"); disc(-9, 2, 3.5, C.black); disc(9, 2, 3.5, C.black); g.restore(); }
        car(120, 300, C.car1, 0.15); car(152, 306, C.car2, -0.25);
        if (tt > T.CARS + 0.6) for (var sm = 0; sm < 5; sm++) { var ph = (tt * 0.8 + sm / 5) % 1; g.globalAlpha = 0.6 * (1 - ph); disc(140 + Math.sin(sm) * 4, 292 - ph * 40, 4 + ph * 8, C.smoke); g.globalAlpha = 1; }
        // people staring at their hands
        for (var q = 0; q < 6; q++) { var qx = 10 + q * 18 + (q > 2 ? 130 : 0), c2 = crowdCol(q); character(function () { person(qx, 300, 1.4, c2[0], c2[1], q, tt, { hands: !run, run: run, look: run ? 1 : 1 }); }); qmark(qx, 258, 0.8, tt, q); }
        // the man points at YOU
        var mx = run ? lerp(60, 150, ease(clamp01((tt - T.RUN - 0.2) / 1.4))) : 60;
        if (tt > T.MAN - 0.2) { character(function () { man(mx, 302, 1.15, tt, talk("man", tt), { point: !run }); }); qmark(mx, 196, 1.0, tt, 9); }
        var kx = run ? lerp(100, 220, ease(clamp01((tt - T.RUN) / 1.4))) : 100;
        character(function () { kid(kx, 302, 1.0, { t: tt, mood: tt > T.MAN ? "scared" : "calm", run: run, look: tt > T.MAN && !run ? -1 : 1 }); });
        if (run) for (var sl = 0; sl < 6; sl++) line(kx - 30 - sl * 6, 250 + sl * 8, kx - 12 - sl * 6, 250 + sl * 8, 0.8, C.white);
        vignette(0.4, "rgba(0,0,20,");
      }
      // RULE / DAY cards
      function cardKind(t) {
        if (t < T.STREET) return ["RULE", 1];
        if (t >= T.R2 && t < NOTES[0]) return ["RULE", 2];
        if (t >= T.DAY4 && t < T.DAY4 + 0.9) return ["DAY", 4];
        if (t >= T.R3 && t < T.DAY9) return ["RULE", 3];
        return ["DAY", 9];
      }
      function scene_card(t) {
        var k = cardKind(t), t0 = k[0] === "RULE" ? (k[1] === 1 ? T.R1 : k[1] === 2 ? T.R2 : T.R3) : (k[1] === 4 ? T.DAY4 : T.DAY9);
        sky(); var cam = { x: 90, y: 214 - (t - t0) * 2, z: 1.05 + (t - t0) * 0.06 }; setCam(cam, 1);
        rect(-40, 100, 260, 260, "#0e1430");
        for (var gx = -40; gx < 220; gx += 12) rect(gx, 100, 0.5, 260, "#1a2448");
        var p = Math.min(1.15, pop(t, t0));
        g.save(); g.translate(90, 270); g.scale(p, p);
        if (k[0] === "DAY") {
          rrect(-30, -32, 60, 64, 4, C.paper); rect(-30, -32, 60, 16, C.red); worldText("DAY", 0, -27, 1, C.white);
          worldText(String(k[1]), 0, -6, 4, C.black);
          worldText(k[1] === 4 ? "07:40" : "23:51", 0, 22, 1, C.dim);
        } else {
          worldText("RULE " + k[1], 0, -30, 2, C.gold);
          if (k[1] === 1) { character(function () { kid(0, 44, 0.62, { t: t, arms: "shh", mood: "calm" }); }); }
          if (k[1] === 2) { rrect(-22, -14, 44, 30, 2, C.paper); line(0, -14, 0, 16, 0.8, C.paperD); for (var r = 0; r < 5; r++) line(-18, -8 + r * 5, -18 + 14 * Math.min(1, (t - t0) * 3 - r * 0.3), -8 + r * 5, 0.8, C.inkB); line(10, 12, 22, -6, 2, C.amber); }
          if (k[1] === 3) { rrect(-26, -12, 52, 24, 3, C.white); rect(-26, -12, 52, 8, C.red); worldText("HELLO, I AM", 0, -11, 1, C.white); worldText("ME", 0, 0, 2, C.black); }
        }
        g.restore();
        vignette(0.35, "rgba(0,0,20,");
      }
      function scene_notebook(t) {
        sky();
        var day4 = t > T.DAY4 + 0.9;
        var cam = { x: 90, y: 186, z: 1.25 + 0.03 * Math.sin(t) };
        if (day4) cam = camAt([[T.DAY4 + 0.9, 90, 236, 2.0], [T.R3, 90, 230, 1.6]], t);
        setCam(cam, 1);
        rect(-40, 150, 260, 200, C.woodD); for (var gr = 0; gr < 8; gr++) rect(-40, 150 + gr * 22, 260, 1, C.wood);
        if (!day4) {
          var idx = 0; for (var i = 0; i < NOTES.length; i++) if (t >= NOTES[i] - 0.05) idx = i;
          var flip = clamp01((t - NOTES[idx] + 0.05) / 0.18);
          rect(40, 196, 100, 70, C.paperD); rect(42, 198, 96, 66, C.paper); line(90, 198, 90, 264, 1, C.paperD);
          for (var r = 0; r < 8; r++) line(46, 206 + r * 7.5, 86, 206 + r * 7.5, 0.4, "#c8d8f0");
          var titles = ["NAMES", "FACES", "NUMBERS", "MOM BDAY"];
          worldText(titles[idx], 66, 200, 1, C.red);
          var wr = clamp01((t - NOTES[idx]) / 0.6);
          if (idx === 0) { var nm = ["MOM", "DAD", "AMIT", "PRIYA", "SAM"]; for (var a = 0; a < 5; a++) if (wr * 5 > a) worldText(nm[a], 66, 210 + a * 9, 1, C.inkB); }
          if (idx === 1) { for (var f = 0; f < 4; f++) if (wr * 4 > f) { var fx = 54 + (f % 2) * 22, fy = 218 + Math.floor(f / 2) * 22; g.strokeStyle = C.inkB; g.lineWidth = 0.8; g.beginPath(); g.arc(fx, fy, 7, 0, 6.28); g.stroke(); disc(fx - 2.5, fy - 1, 0.8, C.inkB); disc(fx + 2.5, fy - 1, 0.8, C.inkB); g.beginPath(); g.arc(fx, fy + 2, 3, 0.3, 2.8); g.stroke(); } }
          if (idx === 2) { var nb = ["555-0101", "555-0142", "100", "112"]; for (var n = 0; n < 4; n++) if (wr * 4 > n) worldText(nb[n], 66, 212 + n * 10, 1, C.inkB); }
          if (idx === 3) { rect(54, 236, 26, 14, C.red); rect(54, 232, 26, 5, C.paper); for (var cd = 0; cd < 3; cd++) { line(59 + cd * 8, 232, 59 + cd * 8, 226, 1, C.cyan); disc(59 + cd * 8, 224, 1.2, C.amber); } worldText("12 MAR", 67, 212, 1, C.inkB); }
          // right page: scribbles
          for (var s2 = 0; s2 < 8; s2++) line(94, 206 + s2 * 7.5, 94 + 38 * clamp01(wr * 2 - s2 * 0.15), 206 + s2 * 7.5, 0.6, C.inkB);
          // page turning
          if (flip < 1 && idx > 0) { g.globalAlpha = 1 - flip; rect(90 + (1 - flip) * -48, 198, 48 * (1 - flip), 66, C.paperD); g.globalAlpha = 1; }
          character(function () { g.save(); g.translate(124 + Math.sin(t * 20) * 2, 236 + Math.cos(t * 17) * 2); line(0, 0, 14, -16, 3, C.amber); disc(15, -17, 2.4, C.skin); g.restore(); });
        } else {
          // three full notebooks stacked
          for (var nbk = 0; nbk < 3; nbk++) { var sy = 270 - nbk * 12, pp = Math.min(1, pop(t, T.DAY4 + 1.1 + nbk * 0.22)); if (pp <= 0) continue; g.save(); g.translate(90, sy); g.scale(pp, pp); rect(-34, -6, 68, 11, ["#a83a3a", "#3a6aa8", "#3a8a5a"][nbk]); rect(-32, -4, 64, 2, C.paper); rect(-32, 0, 64, 2, C.paper); g.restore(); }
          if (t > T.DAY4 + 2.0) worldText("FULL", 90, 220, 2, C.red);
        }
        vignette(0.35, "rgba(0,0,20,");
      }
      function scene_night(t) {
        var tt = tapeT(t, T);
        var page = tt > T.PAGE - 0.1 && tt < T.BUT;
        var cam = page ? camAt([[T.PAGE - 0.1, 90, 214, 1.4], [T.NOTE, 90, 216, 1.5], [T.BUT, 90, 218, 1.6]], tt)
          : tt < T.BUT ? camAt([[T.DAY9 + 0.8, 90, 214, 1.2], [T.PAGE, 90, 222, 1.5]], tt)
          : camAt([[T.BUT, 80, 213, 2.0], [T.LAST, 82, 198, 1.55], [T.HIT, 84, 196, 1.5], [T.STOP, 84, 196, 1.45]], tt);
        shake(cam, tt, T.HIT, 8, 0.5);
        sky(); setCam(cam, 1);
        rect(-60, 100, 300, 260, "#1a1428");
        var fl = 0.8 + 0.2 * Math.sin(tt * 13) * Math.sin(tt * 7.3);
        lighter(); glow(132, 250, 90 * fl, C.flame, 0.35); normalBlend();
        rect(-60, 280, 300, 80, C.woodD); rect(-60, 278, 300, 4, C.wood);
        // candle
        rect(128, 258, 8, 20, C.candle); poly([[132, 246 - fl * 2], [129.5, 256], [134.5, 256]], C.flame); disc(132, 254, 1.5, C.goldL);
        if (!page) {
          // YOU at the desk with the open notebook
          var md = tt > T.BUT ? "shock" : "calm";
          character(function () { kid(70, 302, 1.0, { t: tt, mood: md, arms: tt < T.BUT ? "write" : "" }); });
          rect(80, 270, 40, 10, C.paperD); rect(82, 268, 36, 9, C.paper);
          // the twist: a "?" grows over YOUR head
          if (tt > T.LAST - 0.3) { var gq = clamp01((tt - T.LAST + 0.3) / 1.2); qmark(70, 220, 1.3 * gq, tt, 3); if (tt > T.HIT) { lighter(); glow(70, 220, 26, C.red, 0.5); normalBlend(); } }
        } else {
          // close-up of page one: the handwriting writes itself, word by word
          rect(30, 222, 120, 80, C.paperD); rect(32, 224, 116, 76, C.paper);
          for (var r = 0; r < 8; r++) line(36, 234 + r * 8, 144, 234 + r * 8, 0.4, "#c8d8f0");
          worldText("PAGE 1", 124, 227, 1, C.dim);
          var words = ["DON'T", "TRUST", "WHAT", "YOU", "REMEMBER."];
          var vo = (window.VO || [])[15], shown = 0;
          if (vo) for (var w = 0; w < vo.w.length; w++) if (tt >= vo.w[w][1]) shown = w + 1;
          var l1 = words.slice(0, Math.min(3, shown)).join(" "), l2 = shown > 3 ? words.slice(3, shown).join(" ") : "";
          worldText(l1, 90, 250, 1, C.inkB); worldText(l2, 90, 264, 1, C.inkB);
          if (shown >= 5) { line(52, 274, 128, 274, 0.8, C.red); }
        }
        vignette(0.45, "rgba(0,0,10,");
      }

      function sceneAt(t) {
        if (t < T.EXCEPT) return "globe";
        if (t < T.MOM) return "bed";
        if (t < T.CROWD) return "kitchen";
        if (t < T.R1) return "city";
        if (t < T.STREET) return "card";
        if (t < T.R2) return "city";
        if (t < NOTES[0]) return "card";
        if (t < T.DAY4) return "notebook";
        if (t < T.DAY4 + 0.9) return "card";
        if (t < T.R3) return "notebook";
        if (t < T.DAY9 + 0.8) return "card";
        if (t < T.REWIND) return "night";
        return "globe";
      }

      function drawUI(t) {
        var day = t < T.DAY4 ? 1 : t < T.DAY9 ? 4 : 9, place = t < T.CROWD ? "HOME" : t < T.R2 ? "STREET" : t < T.DAY9 ? "HIDEOUT" : "HIDEOUT";
        var clock = t < T.CROWD ? "07:1" + Math.min(9, 2 + Math.floor(t / 3)) : t < T.DAY4 ? "08:" + (10 + Math.floor(t) % 40) : t < T.DAY9 ? "07:40" : "23:51";
        var tag = t >= T.HIT ? "DAY ? · ??:?? · ???" : "DAY " + day + " · " + clock + " · " + place;
        if (t >= T.REWIND) tag = "DAY 1 · 07:12 · HOME";
        uiCentre(tag, 16, 2, t >= T.HIT && t < T.REWIND ? C.red : C.white);
        // the three rules
        var done = [t >= T.R1 && t < T.REWIND, t >= T.R2 && t < T.REWIND, t >= T.R3 && t < T.REWIND];
        var x0 = 180 - (3 * 7 * 6 * 2 + 2 * 12) / 2;
        for (var i = 0; i < 3; i++) { var s = "RULE " + (i + 1) + (done[i] ? "+" : " "); uiText(s, x0 + i * (7 * 12 + 12) + 1, 37, 2, C.black); uiText(s, x0 + i * (7 * 12 + 12), 36, 2, done[i] ? C.gold : C.dim); }
        // who remembers
        var rem = t < T.EXCEPT ? "WHO REMEMBERS: ..." : t < T.HIT || t >= T.REWIND ? "WHO REMEMBERS: 1" : "WHO REMEMBERS: 0?";
        uiCentre(rem, 56, 2, t >= T.HIT && t < T.REWIND ? C.red : C.green);
      }

      KIT.start(C, T, {
        scenes: { globe: scene_globe, bed: scene_bed, kitchen: scene_kitchen, city: scene_city, card: scene_card, notebook: scene_notebook, night: scene_night },
        sceneAt: sceneAt, ui: drawUI, hitCol: "#ff3a4a",
        cuts: [[T.EXCEPT, "globe", "bed"], [T.MOM, "bed", "kitchen"], [T.CROWD, "kitchen", "city"], [T.R1, "city", "card"], [T.STREET, "card", "city"],
               [T.R2, "city", "card"], [NOTES[0], "card", "notebook"], [T.DAY4, "notebook", "card"], [T.DAY4 + 0.9, "card", "notebook"],
               [T.R3, "notebook", "card"], [T.DAY9 + 0.8, "card", "night"]],
      });
    </script>
  </body>
