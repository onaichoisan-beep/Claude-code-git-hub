        var s = Math.floor(sq(t) + 1e-6), l1, l2 = "", c1 = C.gold, c2 = C.white, S1 = 3;
        if (t < T.S1 || t >= T.REWIND) { l1 = "GRAINS OWED: 0"; S1 = 2; c1 = C.gold; l2 = "SQUARES: 64"; }
        else if (t < T.BREAK) { l1 = "SQUARE " + s; l2 = grains(s) + (s === 1 ? " GRAIN" : ""); c2 = s >= 32 ? C.red : C.white; if (s > 26) S1 = 3; }
        else if (t < T.HIT) { l1 = ""; }
        else if (t < T.NEVER) { l1 = "SQUARE 64"; c1 = Math.floor(t * 6) % 2 ? C.red : C.white; l2 = grains(64); c2 = C.gold; }
        else if (t < T.CHECK) { l1 = "TOTAL OWED"; S1 = 2; c1 = C.white; l2 = "18.4 QUINTILLION GRAINS"; c2 = C.red; }
        else { l1 = "SAGE 1 : KING 0"; S1 = 2; c1 = C.gold; l2 = "CHECKMATE"; c2 = C.green; }
        if (l1) counterLines(l1, c1, S1, l2, c2);
      }

      KIT.start(C, T, {
        scenes: { court: scene_court, board: scene_board, earth: scene_earth }, sceneAt: sceneAt, ui: drawUI, hitCol: "#fff8e8",
        cuts: [[T.S1, "court", "board"], [T.NEVER, "earth", "court"]],
      });
    </script>
