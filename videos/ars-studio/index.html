<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"ink","type":"color","label":"Ink","default":"#5E0B10"},{"id":"red","type":"color","label":"Accent (signal red)","default":"#E8231B"},{"id":"canvas","type":"color","label":"Canvas","default":"#F1E3DD"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #5E0B10;
        --red: #E8231B;
        --canvas: #f1e3dd;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--canvas);
        z-index: 0;
      }
      /* Camera: plate and matte share one transform so the cutout always lines up. */
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 540px 1050px;
      }
      #plate {
        z-index: 1;
      }
      #matte {
        z-index: 3;
      }
      .cam video,
      .cam img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #behind {
        z-index: 2;
      }
      #front {
        z-index: 4;
      }
      #fx {
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11.9"
      data-fps="24"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="bg"></div>

      <!-- A-roll plate (trimmed 0.34 s, upscaled to 1080x1920) -->
      <div id="plate" class="cam">
        <video
          id="aroll"
          class="clip"
          src="assets/footage/aroll.mp4"
          data-start="0"
          data-duration="9.66"
          data-track-index="0"
          data-has-audio="true"
          data-volume="1"
          playsinline
        ></video>
        <img
          id="aroll-freeze"
          class="clip"
          src="assets/footage/aroll-last.jpg"
          data-start="9.66"
          data-duration="2.24"
          data-track-index="0"
          alt=""
        />
      </div>

      <!-- Hero words that sit behind the speaker -->
      <div
        id="behind"
        data-composition-id="behind"
        data-composition-src="compositions/behind.html"
        data-start="0"
        data-duration="11.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Person matte, same camera transform as the plate -->
      <div id="matte" class="cam" data-layout-allow-occlusion>
        <video
          id="cutout"
          class="clip"
          src="assets/footage/aroll-cutout.webm"
          data-start="0"
          data-duration="9.66"
          data-track-index="2"
          muted
          playsinline
          data-layout-allow-occlusion
        ></video>
        <img
          id="cutout-freeze"
          class="clip"
          src="assets/footage/aroll-last-cutout.png"
          data-start="9.66"
          data-duration="2.24"
          data-track-index="2"
          alt=""
          data-layout-allow-occlusion
        />
      </div>

      <!-- Lead-ins, cards, chips, accents in front of the speaker -->
      <div
        id="front"
        data-composition-id="front"
        data-composition-src="compositions/front.html"
        data-start="0"
        data-duration="11.9"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Resets: letterbox, 9:16 iris, end lockup -->
      <div
        id="fx"
        data-composition-id="fx"
        data-composition-src="compositions/fx.html"
        data-start="0"
        data-duration="11.9"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Sound design -->
      <audio id="sfx-whoosh-t1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.48" data-duration="0.6" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-shutter-t1" class="clip" src="assets/sfx/shutter.mp3" data-start="1.6" data-duration="0.32" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-tick-c1" class="clip" src="assets/sfx/tick.mp3" data-start="1.92" data-duration="0.4" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-tick-c2" class="clip" src="assets/sfx/tick.mp3" data-start="2.42" data-duration="0.4" data-track-index="13" data-volume="1"></audio>
      <audio id="sfx-tick-c3" class="clip" src="assets/sfx/tick.mp3" data-start="2.75" data-duration="0.4" data-track-index="14" data-volume="1"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact.mp3" data-start="2.66" data-duration="2.2" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-whoosh-t3" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.45" data-duration="0.6" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-rev-t4" class="clip" src="assets/sfx/revwhoosh.mp3" data-start="6.0" data-duration="0.6" data-track-index="17" data-volume="0.6"></audio>
      <audio id="sfx-shutter-t4" class="clip" src="assets/sfx/shutter.mp3" data-start="6.36" data-duration="0.32" data-track-index="18" data-volume="0.8"></audio>
      <audio id="sfx-tick-slot" class="clip" src="assets/sfx/tick.mp3" data-start="7.12" data-duration="0.4" data-track-index="19" data-volume="1"></audio>
      <audio id="sfx-tick-fill" class="clip" src="assets/sfx/tick.mp3" data-start="7.98" data-duration="0.4" data-track-index="20" data-volume="1"></audio>
      <audio id="sfx-shutter-t5" class="clip" src="assets/sfx/shutter.mp3" data-start="8.64" data-duration="0.32" data-track-index="21" data-volume="0.6"></audio>
      <audio id="sfx-tick-join" class="clip" src="assets/sfx/tick.mp3" data-start="9.5" data-duration="0.4" data-track-index="22" data-volume="1"></audio>
      <audio id="sfx-shutter-end" class="clip" src="assets/sfx/shutter.mp3" data-start="10.07" data-duration="0.32" data-track-index="23" data-volume="0.9"></audio>
    </div>

    <script>
      // Camera ladder (scale of the native frame): WIDE 1.25 / MID 1.45 / TIGHT 1.65.
      // WIDE carries y +70 so the generator watermark stays below the frame edge.
      const tl = gsap.timeline({ paused: true });
      const cam = "#plate, #matte";
      tl.set(cam, { scale: 1.25, x: 0, y: 70 }, 0);
      // B01 opening push on "Hey"
      tl.to(cam, { scale: 1.65, y: 0, duration: 0.83, ease: "expo.out" }, 0.1);
      // T1: under the closed letterbox
      tl.set(cam, { scale: 1.25, y: 70 }, 1.71);
      // T2: punch on "engaging"
      tl.to(cam, { scale: 1.65, y: 0, duration: 0.42, ease: "expo.out" }, 3.12);
      // B03 held-statement drift
      tl.to(cam, { y: 24, duration: 0.91, ease: "none" }, 3.67);
      // T3: horizontal whip — leave left, land from the right at MID
      tl.to(cam, { x: -200, duration: 0.08, ease: "power3.in" }, 4.58);
      tl.set(cam, { scale: 1.45, x: 200, y: 0 }, 4.66);
      tl.to(cam, { x: 0, duration: 0.16, ease: "power3.out" }, 4.66);
      // B04 the breath: the one slow linear push
      tl.to(cam, { scale: 1.53, duration: 1.25, ease: "none" }, 4.88);
      // T4: under the solid red frame — WIDE, reframed left
      tl.set(cam, { scale: 1.25, x: -130, y: 70 }, 6.47);
      // T5: under the closed letterbox — TIGHT, centred
      tl.set(cam, { scale: 1.65, x: 0, y: 0 }, 8.76);
      // End: keep the freeze moving
      tl.to(cam, { scale: 1.7, duration: 0.65, ease: "power1.out" }, 9.52);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
