    // running timecode, derived from timeline time only
    const tc = { f: 0 };
    const tcEl = document.querySelector("#f-tc-val");
    tl.fromTo(
      tc,
      { f: 0 },
      {
        f: 41,
        duration: 41 * F,
        ease: "none",
        onUpdate: () => {
          const fr = Math.floor(tc.f);
          tcEl.textContent = "00:00:0" + Math.floor(fr / 24) + ":" + String(fr % 24).padStart(2, "0");
        },
      },
      0,
    );
    tl.fromTo("#f-hey-in", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 3 * F, ease: "power2.out" }, 0.1);

    tl.fromTo("#f-studio-in span", { opacity: 0 }, { opacity: 1, duration: 0.001, stagger: F }, 1.17);
    pop("#f-kf1", 0.75);
    pop("#f-kf2", 1.42);
    // squash out with ARS under the letterbox
    tl.to(["#f-hey-in", "#f-studio-in"], { scaleY: 0, transformOrigin: "50% 50%", duration: 0.08, ease: "power3.in" }, 1.62);

    // ---- B02: proof row

      tl.to(id, { scale: 1, duration: 5 * F, ease: "power2.inOut" }, t + 4 * F);

    tl.fromTo("#f-sweep-band", { attr: { x: -60 } }, { attr: { x: 230 }, duration: 1.1, ease: "power1.inOut" }, 2.0);

    pop("#f-kf3", 2.1);
