    const F = 1 / 24;
    const top_ = "#x-bar-top";

    // bars rest off-frame
    tl.fromTo(top_, { yPercent: -101 }, { yPercent: -101, duration: F }, 0);

    // T1 — shutter on the breath after "hoon"

    tl.to(bot, { yPercent: 0, duration: 0.08, ease: "expo.in" }, 1.62);
    tl.to(top_, { yPercent: -101, duration: 0.17, ease: "expo.out" }, 1.75);

    // T5 — shutter again before the CTA

    tl.to(bot, { yPercent: 0, duration: 0.07, ease: "expo.in" }, 8.68);

    tl.to(bot, { yPercent: 101, duration: 0.14, ease: "expo.out" }, 8.79);

    tl.to(bot, { yPercent: 0, duration: 0.34, ease: "power3.inOut" }, 9.83);

    // T4 — three 9:16 outlines grow from the face, then a solid frame covers, then a hole opens
    const origin = { transformOrigin: "50% 50%" };
    ["#x-iris-1", "#x-iris-2", "#x-iris-3"].forEach((id, i) => {
      tl.fromTo(
        id,
        { scale: 0.08, opacity: 1, ...origin },
        { scale: 2.8, opacity: 0.2, duration: 0.25, ease: "expo.in", ...origin },
        6.13 + i * 2 * F,
      );
    });
    tl.fromTo("#x-iris-solid", { scale: 0.08, opacity: 1, ...origin }, { scale: 2.8, duration: 0.1, ease: "expo.in", ...origin }, 6.36);
    tl.to("#x-iris-solid", { opacity: 0, duration: 0.001 }, 6.49);
    tl.fromTo("#x-iris-hole", { scale: 0.001, opacity: 0, ...origin }, { scale: 0.001, opacity: 0, duration: 0.001, ...origin }, 6.12);
    tl.to("#x-iris-hole", { opacity: 1, duration: 0.001 }, 6.49);
    tl.to("#x-iris-hole", { scale: 2.9, duration: 0.14, ease: "expo.out" }, 6.49);

    // End card lockup
    tl.fromTo("#x-end-in", { opacity: 0 }, { opacity: 1, duration: 4 * F, ease: "power1.out" }, 10.17);

    window.__timelines["fx"] = tl;
