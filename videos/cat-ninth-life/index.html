          deathFlash(t, img);
          if (t > T_BOOM && t < T_BOOM + 0.15) tintImg(img, C.flame, 0.8 * (1 - (t - T_BOOM) / 0.15));
          if (t > T_SMASH && t < T_SMASH + 0.1) tintImg(img, C.white, 0.7 * (1 - (t - T_SMASH) / 0.1));
          if (t > LOOP - 0.4 && t < LOOP) tintImg(img, C.white, ramp(t, LOOP - 0.4, LOOP));
          if (t >= LOOP) tintImg(img, C.white, 1);
        },
        captions: (window.CAPS || []).map(function (c) {
          return { a: c.a, b: c.b, lines: c.segs.map(function (ln) { return ln.map(function (s) { return [s[0], s[1] === "g" ? C.gold : C.paper]; }); }) };
        }),
        ui: livesUI,
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { PX.render(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
