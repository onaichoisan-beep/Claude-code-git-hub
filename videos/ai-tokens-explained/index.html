          t: t, talk: talk("kid", t), pose: "up", eyes: "stars", brow: "up",
          extra: function (tt) { for (var i = 0; i < 6; i++) { var a = i * 1.05 + tt * 1.5; sparkle(62 + Math.cos(a) * 28, 218 + Math.sin(a) * 7, 2 + 1.5 * Math.abs(Math.sin(tt * 8 + i)), i % 2 ? C.gold : C.white); } },
        }, [[A(7) - 0.1, 62, 196, 2.0], [WT(7, "tyrannosaurus"), 62, 192, 2.3]]);
      }

      // T-REX stomps in; TYRANNOSAURUS splits into 4 tokens
      var TREX = ["TYR", "ANN", "OS", "AURUS"];
      function sceneTrex(t) {
        var t0 = WT(7, "tyrannosaurus"), roarT = t0 + 1.15;
        var steps = [t0 + 0.05, t0 + 0.47, t0 + 0.89];
        var cam = { x: 90, y: 160, z: 1.0 };
        steps.forEach(function (s) { shake(cam, t, s, 7, 0.3); });
        shake(cam, t, roarT, 6, 1.0);
        space(t, 300);
        setCam(cam, 1);
        var walk = clamp01((t - t0) / 1.0);
        var tx = 230 - 125 * easeOut(walk);
        var st = t < t0 + 1.0 ? Math.abs(Math.sin((t - t0) * Math.PI / 0.42)) * 3 : 0;
        var jaw = t > roarT && t < roarT + 1.2 ? Math.sin(clamp01((t - roarT) / 1.2) * Math.PI) : 0.1;
        trex(tx, 300, 1.15, { t: t, jaw: jaw, step: st });
        if (jaw > 0.3) for (var r = 0; r < 4; r++) { var rr = 8 + ((t - roarT) * 40 + r * 7) % 26; g.globalAlpha = 0.7; g.strokeStyle = C.white; g.lineWidth = 1; g.beginPath(); g.arc(tx - 46, 234, rr, Math.PI * 0.75, Math.PI * 1.25); g.stroke(); g.globalAlpha = 1; }
        // the word, then its 4 blocks
        var fk = pop(t, WT(8, "four") - 0.1);
        var cuts = [WT(8, "tyre"), WT(8, "ann"), WT(8, "oss"), WT(8, "aurus")];
        var nCut = cuts.filter(function (c) { return t >= c - 0.03; }).length;
        if (fk > 0) {
          if (nCut === 0) block(90, 200, "TYRANNOSAURUS", 1, fk);
          else {
            // each cut snaps one piece off the front of the word; the uncut rest slides along to its spot
            var xs = rowX(TREX, 90, 4);
            var edge = function (i) { return i === 0 ? 90 - bw("TYRANNOSAURUS") / 2 : xs[i] - bw(TREX[i]) / 2; };
            for (var i = 0; i < nCut; i++) {
              var u = i === nCut - 1 ? easeOut(clamp01((t - cuts[i] + 0.03) / 0.2)) : 1;
              block(lerp(edge(i) + bw(TREX[i]) / 2, xs[i], u), 200 - 6 * Math.sin(u * Math.PI), TREX[i], i, 1);
            }
            if (nCut < 4) {
              var rest = TREX.slice(nCut).join(""), j = nCut - 1, u2 = easeOut(clamp01((t - cuts[j] + 0.03) / 0.2));
              block(lerp(edge(j) + TREX[j].length * 6, edge(nCut), u2) + bw(rest) / 2, 200, rest, nCut, 1);
            }
          }
          tag("4 TOKENS", 90, 220, 1, pop(t, WT(8, "aurus") + 0.25), C.gold);
        }
        vignette(0.2, "rgba(10,20,80,");
      }

      // 1 TOKEN ~ 3/4 OF A WORD
      function sceneRatio(t) {
        var cam = camAt([[A(9) - 0.2, 90, 162, 1.02], [A(10), 90, 160, 1.08]], t);
        space(t);
        setCam(cam, 1);
        robot(90, 90, 1.35, { t: t, talk: talk("ai", t), eyes: "open", arm: "point", pa: 1.4 });
        var wk = pop(t, A(9) + 0.1);
        if (wk > 0) {
          g.save(); g.translate(90, 206); g.scale(wk, wk);
          rrect(-45, -8, 90, 16, 3, C.ink); rrect(-44, -7, 88, 14, 3, C.white);
          worldText("1 WORD", 0, -3, 1, C.ink);
          g.restore();
        }
        var u = easeOut(clamp01((t - WT(9, "one") + 0.05) / 0.4));
        if (u > 0) block(-60 + (78 + 60) * u, 230, "1 TOKEN", 2, 1, 66, 14);
        var tk = ramp(t, WT(9, "three") - 0.05, WT(9, "three") + 0.25);
        if (tk > 0) {
          for (var y = 196; y < 240; y += 4) rect(111, y, 1, 2, C.gold);
          tag("3/4", 130, 230, 1, pop(t, WT(9, "three")), C.gold);
        }
        tag("100 TOKENS ~ 75 WORDS", 90, 262, 1, pop(t, WT(9, "word") + 0.15), C.white);
        vignette(0.2, "rgba(10,20,80,");
      }

      // "WHY DOES THAT MATTER?"
      function sceneWhy(t) {
        kidCU(t, { t: t, talk: talk("kid", t), pose: "cross", eyes: "open", look: 0.6, brow: "skeptic", mouth: "smirk" },
          [[A(10) - 0.1, 70, 196, 2.1], [A(11), 66, 196, 2.3]]);
      }

      // PRICED BY THE TOKEN: blocks ride a belt into the meter, a coin pops out for each
      var BELT = ["HOW", "BIG", "IS", "THE", "SUN", "?", "IT", "IS", "HUGE"];
      function scenePrice(t) {
        var c0 = WT(11, "by") + 0.1;
        var cam = camAt([[A(11) - 0.2, 90, 164, 1.0], [A(12), 92, 166, 1.05]], t);
        space(t);
        setCam(cam, 1);
        robot(44, 92, 1.15, { t: t, talk: talk("ai", t), eyes: t > WT(11, "tiny") ? "happy" : "open", arm: "point", pa: 0.6 });
        tag("$ PER TOKEN", 126, 74, 1, pop(t, WT(11, "priced")), C.gold);
        // belt
        rect(-10, 262, 140, 8, C.metalD); rect(-10, 262, 140, 2, C.metal);
        for (var i = 0; i < 12; i++) { var bx = ((i * 14 - t * 30) % 168 + 168) % 168 - 14; rect(bx, 265, 6, 2, C.ink); }
        for (var r = 0; r < 7; r++) disc(4 + r * 20, 272, 3, C.metal);
        // blocks: each reaches the meter at c0 + 0.32 i
        BELT.forEach(function (lb, i) {
          var arrive = c0 + 0.32 * i, x = 128 - (arrive - t) * 60;
          if (x < -30 || x > 132) return;
          block(x - bw(lb) / 2 + 8, 254, lb, i, 1);
        });
        // meter box
        rrect(124, 222, 52, 56, 4, C.ink); rrect(125, 221, 50, 55, 4, C.metal);
        rrect(130, 228, 40, 16, 2, C.screen);
        var paid = BELT.filter(function (lb, i) { return t >= c0 + 0.32 * i; }).length;
        worldText("x" + paid, 150, 233, 1, C.lime);
        worldText("TOKENS", 150, 262, 1, C.ink);
        rect(130, 250, 40, 4, C.ink);
        // coins popping out of the top
        for (var j = 0; j < paid; j++) {
          var ct = t - (c0 + 0.32 * j);
          if (ct > 0.9) continue;
          coin(150 + (j % 2 ? 6 : -6) * ct * 3, 218 - 60 * ct + 50 * ct * ct, 5, ct * 12);
        }
        if (t > WT(11, "tiny")) tag("TINY!", 150, 204, 1, pop(t, WT(11, "tiny")), C.white);
        vignette(0.2, "rgba(10,20,80,");
      }

      // CONTEXT WINDOW: a real window that fills up with blocks
      var WIN = { x0: 34, x1: 146, y0: 194, y1: 298, cols: 5, rows: 6 };
      var WORDS = ["THE", "CAT", "SAT", "ON", "A", "MAT", "AND", "IT", "WAS", "SO", "NAP", "PED", "!", "THEN", "IT", "ATE", "A", "BUG"];
      function cellXY(c) {
        var cw = (WIN.x1 - WIN.x0) / WIN.cols, ch = (WIN.y1 - WIN.y0) / WIN.rows;
        var col = ((c % WIN.cols) + WIN.cols) % WIN.cols, row = Math.floor(c / WIN.cols);
        return [WIN.x0 + cw * (col + 0.5), WIN.y1 - ch * (row + 0.5)];
      }
      function windowFrame(front) {
        if (!front) {
          rrect(WIN.x0 - 7, WIN.y0 - 7, WIN.x1 - WIN.x0 + 14, WIN.y1 - WIN.y0 + 14, 3, C.ink);
          rrect(WIN.x0 - 6, WIN.y0 - 6, WIN.x1 - WIN.x0 + 12, WIN.y1 - WIN.y0 + 12, 3, C.desk);
          g.globalAlpha = 0.5; rect(WIN.x0, WIN.y0, WIN.x1 - WIN.x0, WIN.y1 - WIN.y0, C.skyL); g.globalAlpha = 1;
          return;
        }
        rect(WIN.x0 - 6, WIN.y0 - 6, WIN.x1 - WIN.x0 + 12, 5, C.deskL);
        rect(WIN.x0 - 9, WIN.y1 + 4, WIN.x1 - WIN.x0 + 18, 4, C.deskD);
        g.globalAlpha = 0.35; line(WIN.x0 + 10, WIN.y0 + 40, WIN.x0 + 40, WIN.y0 + 4, 3, C.white); line(WIN.x0 + 20, WIN.y0 + 50, WIN.x0 + 56, WIN.y0 + 8, 1.5, C.white); g.globalAlpha = 1;
      }
      function landT(i) { return A(12) + 0.15 + i * 0.075; }
      function cellBlock(i, x, y, k) { block(x, y, WORDS[i % WORDS.length], i, k, 20, 14); }
      function sceneWindow(t) {
        var cam = camAt([[A(12) - 0.2, 90, 162, 1.0], [A(13), 90, 166, 1.06]], t);
        space(t);
        setCam(cam, 1);
        var full = t > landT(29) + 0.1;
        robot(34, 96, 1.05, { t: t, talk: talk("ai", t), eyes: "open", arm: "point", pa: 0.9 });
        tag("CONTEXT WINDOW", 112, 96, 1, pop(t, WT(12, "context")), C.gold);
        windowFrame(false);
        for (var i = 0; i < 30; i++) {
          var lt = t - landT(i);
          if (lt < -0.22) continue;
          var p = cellXY(i), u = clamp01((lt + 0.22) / 0.22);
          cellBlock(i, p[0], lerp(WIN.y0 + 6, p[1], u * u), 1);
        }
        windowFrame(true);
        if (full && Math.floor(t * 4) % 2 === 0) tag("FULL!", 90, 186, 1, 1, C.red);
        vignette(0.2, "rgba(10,20,80,");
      }

      // "WHAT HAPPENS WHEN IT'S FULL?"
      function sceneFull(t) {
        kidCU(t, {
          t: t, talk: talk("kid", t), pose: "cheeks", eyes: "wide", brow: "worry", mouth: "o",
          extra: function (tt) { if (Math.floor(tt * 4) % 2 === 0) tag("FULL!", 62, 184, 1, 1, C.red); },
        }, [[A(13) - 0.1, 62, 197, 2.2], [A(14), 62, 196, 2.45]]);
      }

      // PUSHED OUT: new blocks shove the oldest ones out, the robot forgets
      function sceneForget(t) {
        var pushes = [0, 1, 2, 3, 4].map(function (k) { return WT(14, "pushed") - 0.1 + 0.2 * k; });
        var cam = camAt([[A(14) - 0.2, 90, 164, 1.04], [A(15), 90, 162, 1.0]], t);
        space(t);
        setCam(cam, 1);
        var fg = t > WT(14, "forget") - 0.1;
        robot(34, 96, 1.05, { t: t, talk: talk("ai", t), eyes: fg ? "q" : "open", mouth: fg ? "wobble" : "", arm: fg ? "scratch" : "rest" });
        tag("OLDEST OUT", 118, 96, 1, pop(t, WT(14, "out")), C.white);
        windowFrame(false);
        var shift = 0;
        pushes.forEach(function (p) { shift += easeOut(clamp01((t - p) / 0.18)); });
        for (var i = 0; i < 35; i++) {
          var pos = i - shift;
          if (i >= 30) { // new blocks drop in once their push starts
            var pt = pushes[i - 30];
            if (t < pt) continue;
          }
          if (pos < 0) { // falling out of the window
            var leave = pushes[i], u = t - leave;
            if (u > 1.2) continue;
            var p0 = cellXY(0);
            var fade = clamp01(1 - (t - WT(14, "forget")) / 0.6);
            g.save(); g.globalAlpha = fg ? fade : 1; g.translate(p0[0] - 34 * u, p0[1] - 10 * u + 160 * u * u); g.rotate(-u * 3);
            cellBlock(i, 0, 0, 1); g.restore(); g.globalAlpha = 1;
            continue;
          }
          var a = cellXY(Math.floor(pos)), b = cellXY(Math.ceil(pos)), f = pos - Math.floor(pos);
          var x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f) - Math.sin(f * Math.PI) * 4;
          cellBlock(i, x, y, 1);
        }
        windowFrame(true);
        // forgotten blocks dissolve into pixels
        if (fg) for (var s = 0; s < 30; s++) {
          var du = t - WT(14, "forget"), px = 20 + hash1(s) * 40 - du * 20, py = 240 + hash1(s + 9) * 80 - du * 30 * hash1(s + 3);
          g.globalAlpha = clamp01(1 - du); rect(px, py, 2, 2, BCOL[s % 4][0]); g.globalAlpha = 1;
        }
        vignette(0.2, "rgba(10,20,80,");
      }

      // "WAIT. SO YOU DON'T SEE LETTERS?"
      function sceneLetters(t) {
        kidCU(t, {
          t: t, talk: talk("kid", t), pose: "chin", eyes: "open", look: -0.6, brow: t < WT(15, "so") ? "up" : "skeptic",
          extra: function (tt) { "ABC".split("").forEach(function (ch, i) { var k = pop(tt, WT(15, "letters") + 0.08 * i); if (k > 0) { g.save(); g.translate(44 + i * 14, 186 + Math.sin(tt * 4 + i) * 1.5); g.scale(k, k); tag(ch, 0, 0, 1, 1, C.white); g.restore(); } }); },
        }, [[A(15) - 0.1, 66, 196, 2.2], [A(16), 62, 195, 2.4]]);
      }

      // STRAWBERRY = ONE BLOCK; miscount
      var LET = "STRAWBERRY".split("");
      function letterX(i) { return 90 + (i - 4.5) * 11; }
      function sceneStraw(t) {
        var fuse = WT(16, "one") - 0.05;
        var cam = camAt([[A(16) - 0.2, 90, 162, 1.02], [A(17), 90, 164, 1.07]], t);
        shake(cam, t, fuse + 0.15, 4, 0.3);
        space(t);
        setCam(cam, 1);
        var think = t > WT(16, "reason") - 0.05;
        robot(80, 92, 1.3, { t: t, talk: talk("ai", t), eyes: think ? "dizzy" : "open", arm: think ? "scratch" : "point", pa: 1.3 });
        strawberry(90, 262, 1.15, t);
        var u = easeOut(clamp01((t - fuse) / 0.18));
        if (t < fuse + 0.18) {
          LET.forEach(function (ch, i) {
            var k = pop(t, A(16) + 0.1 + 0.05 * i);
            var x = lerp(letterX(i), 90 + (i - 4.5) * 6, u);
            if (k > 0) block(x, 204, ch, 0, k, u > 0 ? 11 - 5 * u : 11, 14);
          });
        } else {
          block(90, 204, "STRAWBERRY", 0, bump(t, [fuse + 0.18], 0.3), 0, 15);
          tag("1 TOKEN", 90, 224, 1, pop(t, fuse + 0.25), C.gold);
        }
        if (t < fuse + 0.4 && t > fuse + 0.1) { lighter(); glow(90, 204, 40, C.white, 0.7 * (1 - (t - fuse - 0.1) / 0.3)); normalBlend(); }
        // thought bubble: "2 R'S?" -> buzzed wrong
        var bk = pop(t, WT(16, "reason"));
        if (bk > 0) {
          g.save(); g.translate(140, 52); g.scale(bk, bk);
          disc(-18, 34, 2, C.white); disc(-12, 28, 3, C.white);
          rrect(-24, -12, 48, 28, 10, C.ink); rrect(-23, -11, 46, 26, 10, C.white);
          worldText("2 R'S?", 0, -2 + Math.sin(t * 9) * 0.8, 1, C.ink);
          if (t > WT(16, "r's") + 0.05) { line(-14, -7, 14, 11, 3, C.red); line(14, -7, -14, 11, 3, C.red); }
          g.restore();
        }
        vignette(0.2, "rgba(10,20,80,");
      }

      // "SO HOW MANY R'S ARE IN STRAWBERRY?"
      function sceneHowMany(t) {
        kidCU(t, { t: t, talk: talk("kid", t), pose: "point", eyes: "open", look: 0.8, brow: "skeptic", mouth: "smirk" },
          [[A(17) - 0.1, 64, 195, 2.1], [A(18), 62, 194, 2.6]]);
      }

      // THREE: the block opens up, three R's light up gold
      function sceneThree(t) {
        var t0 = A(18), Rs = [2, 7, 8];
        var cam = { x: 90, y: 162, z: 1.0 * bump(t, [t0], 0.12) + 0.03 * ramp(t, t0, DUR) };
        space(t);
        setCam(cam, 1);
        var ck = WT(18, "checked");
        robot(90, 90, 1.4, { t: t, talk: talk("ai", t), eyes: t > ck + 0.2 ? "wink" : "happy", arm: t > ck ? "thumb" : "point", pa: 1.2 });
        strawberry(90, 266, 1.2 * bump(t, [t0], 0.15), t);
        LET.forEach(function (ch, i) {
          var ri = Rs.indexOf(i), lit = ri >= 0 && t >= t0 + 0.12 + 0.09 * ri;
          var k = lit ? bump(t, [t0 + 0.12 + 0.09 * ri], 0.5) : 1;
          var y = 204 - (lit ? 3 : 0);
          if (lit) { lighter(); glow(letterX(i), y, 10, C.gold, 0.5); normalBlend(); rrect(letterX(i) - 6.5, y - 8.5, 13, 17, 2, C.gold); }
          block(letterX(i), y, ch, lit ? 3 : 0, k, 11, 14);
        });
        tag("3 R'S", 90, 230, 2, pop(t, t0 + 0.35), C.gold);
        // confetti
        for (var c = 0; c < 40; c++) {
          var u = t - t0 - 0.1;
          if (u < 0) break;
          var cx = 90 + (hash1(c) - 0.5) * 40 + (hash1(c + 3) - 0.5) * 220 * Math.min(1, u * 2), cy = 210 - 90 * hash1(c + 6) * Math.min(1, u * 2) + 60 * u * u;
          if (cy > 186 && cy < 320) rect(cx, cy, 2, 2, BCOL[c % 4][0]);
        }
        vignette(0.2, "rgba(10,20,80,");
      }

      var LOOP = DUR - 0.6;
      PX.setup(C, {
        scenes: {
          hook: sceneHook, room: sceneRoom, jargon: sceneJargon, five: sceneFive, blocks: sceneBlocks, snap: sceneSnap,
          catjelly: sceneCatJelly, ooh: sceneOoh, trex: sceneTrex, ratio: sceneRatio, why: sceneWhy, price: scenePrice,
          window: sceneWindow, full: sceneFull, forget: sceneForget, letters: sceneLetters, straw: sceneStraw,
          howmany: sceneHowMany, three: sceneThree,
        },
        sceneAt: function (t) {
          var tr = WT(7, "tyrannosaurus") - 0.05;
          return t < A(1) - 0.3 ? "hook" : t < A(2) ? "room" : t < A(3) ? "jargon" : t < A(4) ? "five" : t < A(5) ? "blocks"
            : t < A(6) ? "snap" : t < A(7) ? "catjelly" : t < tr ? "ooh" : t < A(9) ? "trex" : t < A(10) ? "ratio"
            : t < A(11) ? "why" : t < A(12) ? "price" : t < A(13) ? "window" : t < A(14) ? "full" : t < A(15) ? "forget"
            : t < A(16) ? "letters" : t < A(17) ? "straw" : t < A(18) ? "howmany" : t < LOOP ? "three" : "hook";
        },
        cuts: [[A(2), "room", "jargon"], [A(4), "five", "blocks"], [A(5), "blocks", "snap"], [A(6), "snap", "catjelly"],
          [A(7), "catjelly", "ooh"], [A(9), "trex", "ratio"], [A(10), "ratio", "why"], [A(11), "why", "price"],
          [A(12), "price", "window"], [A(13), "window", "full"], [A(14), "full", "forget"], [A(15), "forget", "letters"],
          [A(16), "letters", "straw"], [A(17), "straw", "howmany"]],
        post: function (t, img) {
          if (t < 0.12) tintImg(img, C.white, 1 - t / 0.12);
          var gl = A(1) - 0.55;
          if (t > gl && t < gl + 0.45) glitchRows(img, 22 * Math.sin((t - gl) / 0.45 * Math.PI), Math.floor(t * 30));
          var cut = B(2) - 0.08;
          if (t > cut && t < cut + 0.2) glitchRows(img, 10 * Math.sin((t - cut) / 0.2 * Math.PI), Math.floor(t * 30) + 7);
          var tr = WT(7, "tyrannosaurus") - 0.05;
          if (t > tr && t < tr + 0.1) tintImg(img, C.white, 1 - (t - tr) / 0.1);
          if (t > A(18) && t < A(18) + 0.15) tintImg(img, C.white, 0.8 * (1 - (t - A(18)) / 0.15));
          if (t > DUR - 0.25) tintImg(img, C.white, ramp(t, DUR - 0.25, DUR));
        },
        captions: (window.CAPS || []).map(function (c) {
          return { a: c.a, b: c.b, lines: [c.segs.map(function (s) { return [s[0], s[1] === "g" ? C.gold : C.paper]; })] };
        }),
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { PX.render(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
