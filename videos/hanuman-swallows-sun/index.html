<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Hanuman Swallows the Sun</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #ff9a5a;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ff9a5a;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <section id="stage" class="clip" data-start="0" data-duration="30" data-track-index="0">
        <canvas id="world" width="180" height="320" data-layout-allow-overflow></canvas>
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <!-- built by scripts/synth_audio.py: cinematic sound effects only -->
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="1"></audio>
    </div>
    <script src="pixel-engine.js"></script>
    <script>
      var C = {
        skyTop: "#4a6ae8", skyMid: "#ff9ac0", skyLow: "#ffd070", day: "#7ac8ff", dayLight: "#c8ecff",
        sun: "#ff5a2a", sunMid: "#ff8a2a", sunGlow: "#ffb03a", sunCore: "#fff0a0",
        night: "#0a0a2a", nightMid: "#1a1a5a", star: "#ffffff",
        cloud: "#ffffff", cloudShade: "#d8e0ff", cloudDusk: "#ffc8e0",
        treeDark: "#1f7a4a", tree: "#36b04a", treeLight: "#8ae05a", bark: "#8a5230", hill: "#2a9a6a", hillDark: "#1a6a4a",
        mango: "#ffb020", mangoRed: "#ff6a2a", leaf: "#3cb44a",
        fur: "#ff6a2a", furDark: "#c8401a", furLight: "#ff9a5a", muzzle: "#ffd8b0", muzzleShade: "#f0a878", dhoti: "#e83a3a", gold: "#ffd23f", goldDark: "#c8901a",
        white: "#ffffff", elephant: "#f4f6ff", elephantShade: "#c8d0f0", indra: "#ffd8a8", vajra: "#9ff0ff",
        wind: "#bff4ff", windDark: "#7ad0f0", rock: "#8a7a9a", rockDark: "#5a4a6a", rockLight: "#b8a8c8",
        bless: "#fff4b0", blessGold: "#ffd23f", grey: "#9aa0b8",
        ink: "#06050a", paper: "#f1eef4",
      };
      var STARS = (function () { var r = rng(3), a = []; for (var i = 0; i < 70; i++) a.push({ x: r() * 220 - 20, y: r() * 360 - 20, k: r() }); return a; })();
      function stars(t, alpha) {
        if (alpha <= 0) return;
        g.globalAlpha = alpha;
        STARS.forEach(function (s, i) { if (Math.sin(t * 3 + i) > -0.6) rect(s.x, s.y, s.k > 0.85 ? 2 : 1, s.k > 0.85 ? 2 : 1, C.star); });
        g.globalAlpha = 1;
      }
      function cloud(x, y, w, col, shade) {
        ell(x, y + 3, w * 0.55, w * 0.18, 0, shade);
        ell(x, y, w * 0.5, w * 0.2, 0, col);
        disc(x - w * 0.18, y - w * 0.1, w * 0.17, col); disc(x + w * 0.12, y - w * 0.14, w * 0.2, col);
      }
      function sunDisc(x, y, r, t) {
        for (var i = 0; i < 12; i++) {
          var a = i * 0.5236 + t * 0.3;
          poly([[x + Math.cos(a - 0.12) * r, y + Math.sin(a - 0.12) * r], [x + Math.cos(a) * r * 1.35, y + Math.sin(a) * r * 1.35], [x + Math.cos(a + 0.12) * r, y + Math.sin(a + 0.12) * r]], C.sunGlow);
        }
        disc(x, y, r * 1.08, C.sunGlow); disc(x, y, r, C.sun); disc(x, y, r * 0.72, C.sunMid); disc(x - r * 0.25, y - r * 0.25, r * 0.28, C.sunCore);
      }

      // ============================================================ HANUMAN
      // o: { pose: sit|crouch|fly|gulp|full|lie|wake, rot, eyes: open|closed, glow }
      function baby(cx, cy, s, o, t) {
        g.save(); g.translate(cx, cy); g.rotate(o.rot || 0); g.scale(s, s);
        // tail
        g.strokeStyle = C.furDark; g.lineWidth = 2.6; g.lineCap = "round";
        g.beginPath(); g.moveTo(-6, 8); g.bezierCurveTo(-20, 10, -22, -8, -14, -10); g.stroke();
        g.strokeStyle = C.fur; g.lineWidth = 1.8; g.stroke();
        // body
        var fly = o.pose === "fly";
        ell(0, 6, 9, 10, 0, C.furDark); ell(0, 5.5, 8.4, 9.4, 0, C.fur); ell(0, 8, 5.5, 6, 0, C.furLight);
        rrect(-8, 9, 16, 7, 3, C.dhoti); rect(-8, 9, 16, 1.2, C.gold);
        // legs
        if (o.pose === "sit") { ell(-5, 16, 4, 2.5, 0, C.fur); ell(5, 16, 4, 2.5, 0, C.fur); }
        else if (fly) { line(-3, 15, -6, 24, 3.4, C.fur); line(3, 15, 4, 24, 3.4, C.fur); }
        else { ell(-5, 17, 3.5, 3, 0, C.fur); ell(5, 17, 3.5, 3, 0, C.fur); }
        // arms
        if (fly || o.pose === "gulp") { line(6, -1, 12, -16, 3, C.fur); disc(12, -17, 2, C.muzzle); line(-6, -1, -11, 6, 3, C.fur); }
        else { line(6, 0, 10, 8, 3, C.fur); line(-6, 0, -10, 8, 3, C.fur); disc(10, 9, 1.8, C.muzzle); disc(-10, 9, 1.8, C.muzzle); }
        // head
        var full = o.pose === "full" ? 1 : 0;
        disc(0, -10, 11, C.furDark); disc(0, -10.5, 10.4, C.fur);
        poly([[-2, -21], [0, -26], [2, -21]], C.furDark);
        disc(-10.5, -10, 3.4, C.fur); disc(10.5, -10, 3.4, C.fur); disc(-10.5, -10, 1.8, C.muzzleShade); disc(10.5, -10, 1.8, C.muzzleShade);
        disc(-11, -6, 1.6, C.gold); disc(11, -6, 1.6, C.gold);
        // face: heart-shaped muzzle, cheeks puff when full of sun
        ell(0, -9, 7.5 + full * 2, 6.5, 0, C.muzzle);
        ell(-4 - full, -5.5, 4 + full * 3, 3.2 + full * 2.5, 0, C.muzzle); ell(4 + full, -5.5, 4 + full * 3, 3.2 + full * 2.5, 0, C.muzzle);
        if (full) {
          g.globalAlpha = 0.55 + 0.3 * Math.sin(t * 10);
          disc(-6, -5, 6, C.sunGlow); disc(6, -5, 6, C.sunGlow);
          g.globalAlpha = 1;
          disc(-6, -5, 2.6, C.sunMid); disc(6, -5, 2.6, C.sunMid);
        }
        if (o.eyes === "closed") { line(-5, -11, -2, -11, 0.9, C.ink); line(2, -11, 5, -11, 0.9, C.ink); }
        else { disc(-3.4, -11, 1.9, C.white); disc(3.4, -11, 1.9, C.white); disc(-3, -11, 1.1, C.ink); disc(3.8, -11, 1.1, C.ink); }
        if (o.pose === "gulp") ell(0, -4, 4, 4.5, 0, C.dhoti);
        else if (full) ell(0, -3.5, 2, 1.2, 0, C.furDark);
        else { g.strokeStyle = C.furDark; g.lineWidth = 0.8; g.beginPath(); g.arc(0, -5, 2.5, 0.3, Math.PI - 0.3); g.stroke(); }
        rect(-0.5, -17, 1, 3, C.dhoti);
        g.restore();
      }
      function adult(cx, cy, s, t, flying) {
        g.save(); g.translate(cx, cy); g.rotate(flying ? -0.35 : 0); g.scale(s, s);
        // cape
        poly([[-10, -16], [10, -16], [16 + Math.sin(t * 8) * 2, 22], [-16 + Math.sin(t * 8 + 1) * 2, 22]], C.dhoti);
        // legs
        line(-4, 12, -7, 28, 5, C.fur); line(4, 12, 9, 26, 5, C.fur);
        rrect(-9, 6, 18, 10, 3, C.goldDark); rrect(-8.5, 6.5, 17, 9, 3, C.gold);
        // torso
        poly([[-12, -18], [12, -18], [8, 8], [-8, 8]], C.furDark); poly([[-11, -17], [11, -17], [7.5, 7], [-7.5, 7]], C.fur);
        ell(-4.5, -11, 4, 3, 0, C.furLight); ell(4.5, -11, 4, 3, 0, C.furLight);
        g.strokeStyle = C.gold; g.lineWidth = 1.6; g.beginPath(); g.arc(0, -18, 7, 0.4, Math.PI - 0.4); g.stroke();
        // gada over the shoulder, free fist forward
        line(12, -14, 22, -34, 2, C.goldDark); disc(23, -36, 6, C.goldDark); disc(22.4, -36.6, 5, C.gold);
        line(10, -14, 14, -8, 4.5, C.fur); line(-10, -14, -18, -24, 4.5, C.fur); disc(-19, -26, 3, C.muzzle);
        // head
        disc(0, -27, 9, C.furDark); disc(0, -27.5, 8.5, C.fur);
        ell(0, -25, 6.5, 5.5, 0, C.muzzle); ell(0, -21.5, 5, 3.4, 0, C.muzzleShade);
        disc(-2.8, -28, 1.3, C.ink); disc(2.8, -28, 1.3, C.ink);
        poly([[-6, -33], [-4, -40], [0, -36], [4, -40], [6, -33]], C.gold); rect(-6, -34, 12, 2, C.goldDark);
        disc(-8.5, -25, 1.5, C.gold); disc(8.5, -25, 1.5, C.gold);
        line(0, -31, 0, -34, 1, C.dhoti);
        g.restore();
      }

      // ============================================================ SCENES
      function sceneCold(t) {
        var endMode = t >= 15;
        screen();
        var dark = endMode ? 0 : ramp(t, 0.25, 0.5);
        g.fillStyle = vgrad(0, H, [[0, mix(C.sunMid, C.night, dark)], [0.6, mix(C.sunGlow, C.nightMid, dark)], [1, mix(C.skyLow, C.nightMid, dark)]]);
        g.fillRect(0, 0, W, H);
        var cam = endMode ? camAt([[28.6, 90, 200, 0.7], [29.8, 90, 160, 1], [30, 90, 160, 1]], t) : shake({ x: 90, y: 160, z: 1 + 0.15 * Math.exp(-t * 5) }, t, 0.3, 8, 0.8);
        setCam(cam, 1);
        stars(t, dark);
        var shrink = endMode ? 1 : 1 - ramp(t, 0.02, 0.32);
        if (shrink > 0.02) {
          var sx = 90, sy = lerp(205, 180, shrink);
          g.globalAlpha = 0.5; disc(sx, sy, 90 * shrink, C.sunCore); g.globalAlpha = 1;
          sunDisc(sx, sy, 58 * shrink, t);
        }
        if (dark > 0.2) { g.globalAlpha = 0.4 * dark; disc(90, 214, 30, C.sunGlow); g.globalAlpha = 1; }
        var by = endMode ? lerp(330, 236, ramp(t, 28.6, 29.9)) : 236;
        var silhouette = endMode || t < 0.32;
        if (silhouette) { g.globalAlpha = 1; baby(90, by, 2.2, { pose: "gulp", rot: -0.2 }, t); g.globalCompositeOperation = "source-atop"; g.globalCompositeOperation = "source-over"; }
        else baby(90, by, 2.2, { pose: "full", rot: 0 }, t);
        vignette(0.3, "rgba(20,10,60,");
      }
      var TREES = (function () { var r = rng(7), a = []; for (var i = 0; i < 9; i++) a.push({ x: -20 + i * 26 + r() * 10, h: 30 + r() * 30 }); return a; })();
      function forestFloor(t, sway) {
        g.fillStyle = C.hillDark; g.beginPath(); g.moveTo(-100, 330);
        for (var x = -100; x <= 300; x += 8) g.lineTo(x, 250 + Math.sin(x * 0.04) * 8);
        g.lineTo(300, 400); g.lineTo(-100, 400); g.closePath(); g.fill();
        TREES.forEach(function (tr, i) {
          var sw = Math.sin(t * 1.5 + i) * 2 * sway;
          rect(tr.x - 2, 262 - tr.h * 0.5, 4, tr.h * 0.5, C.bark);
          disc(tr.x + sw, 262 - tr.h * 0.6, tr.h * 0.32, C.treeDark); disc(tr.x + sw - 3, 262 - tr.h * 0.66, tr.h * 0.22, C.tree);
        });
        rect(-100, 270, 400, 120, C.tree);
        rect(-100, 270, 400, 2, C.treeLight);
      }
      function sceneDawn(t) {
        var cam = camAt([[1.5, 90, 150, 1.15], [2.2, 90, 150, 1.0], [5.1, 80, 162, 1.15]], t);
        screen();
        g.fillStyle = vgrad(0, H, [[0, C.skyTop], [0.5, C.skyMid], [0.8, C.skyLow]]); g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        var sunY = 262 - 26 * ramp(t, 1.6, 4.6);
        sunDisc(136, sunY, 20, t);
        cloud(40, 70, 46, C.cloud, C.cloudDusk); cloud(150, 110, 36, C.cloud, C.cloudDusk);
        forestFloor(t, 1);
        // big tree + branch with baby Hanuman
        rect(10, 180, 12, 100, C.bark); line(14, 236, 70, 230, 6, C.bark);
        disc(20, 170, 30, C.treeDark); disc(10, 162, 20, C.tree); disc(36, 160, 16, C.treeLight);
        var crouch = t > 4.6;
        baby(56, 216, 1.6, { pose: crouch ? "crouch" : "sit", rot: crouch ? 0.15 : 0 }, t);
        // hunger rumble
        if (t > 1.8 && t < 2.6) for (var k = 0; k < 3; k++) line(64 + k * 3, 222 + Math.sin(t * 30 + k) * 1.5, 66 + k * 3, 226, 0.7, C.white);
        // thought bubble: a mango
        var pop = easeOut((t - 2.3) / 0.3);
        if (t > 2.3) {
          disc(66, 196, 2 * pop, C.white); disc(72, 186, 3 * pop, C.white);
          disc(92, 100, 26 * pop, C.white); disc(78, 94, 14 * pop, C.white); disc(106, 92, 15 * pop, C.white);
          ell(92, 102, 13 * pop, 16 * pop, 0.4, C.mango); ell(88, 106, 8 * pop, 10 * pop, 0.4, C.mangoRed); ell(96, 96, 3 * pop, 4 * pop, 0.4, C.sunCore);
          ell(99, 86, 5 * pop, 2.2 * pop, -0.6, C.leaf);
        }
        vignette(0.2, "rgba(60,20,60,");
      }
      var CLOUDS = (function () { var r = rng(11), a = []; for (var i = 0; i < 16; i++) a.push({ x: r() * 200 - 10, y: 120 - i * 50 - r() * 30, w: 30 + r() * 30 }); return a; })();
      function leapY(t) { return t < 5.4 ? 0 : -820 * Math.pow(clamp01((t - 5.4) / 3.3), 1.4); }
      function sceneLeap(t) {
        var ly = leapY(t);
        var cam = { x: 90, y: 180 + ly, z: 1 };
        shake(cam, t, 5.4, 6, 0.4);
        var alt = clamp01(-ly / 820);
        screen();
        g.fillStyle = vgrad(0, H, [[0, mix(C.skyTop, C.sunGlow, alt)], [0.6, mix(C.skyMid, C.sunMid, alt)], [1, mix(C.skyLow, C.sunGlow, alt)]]);
        g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        // the sun ahead, growing
        sunDisc(96, -700, 50 + 40 * alt, t);
        CLOUDS.forEach(function (c) { cloud(c.x, c.y, c.w, C.cloud, C.cloudDusk); });
        forestFloor(t, 1);
        rect(10, 180, 12, 100, C.bark); line(14, 236, 70, 230, 6, C.bark);
        disc(20, 170, 30, C.treeDark); disc(10, 162, 20, C.tree);
        var by = t < 5.4 ? 216 + 3 * ramp(t, 5.0, 5.35) : 216 + ly + 40 * clamp01((t - 5.4) / 0.6) - 0;
        var bx = t < 5.4 ? 56 : lerp(56, 92, clamp01((t - 5.4) / 1.2));
        baby(bx, Math.max(by, cam.y + 50), 1.6, { pose: t < 5.4 ? "crouch" : "fly", rot: t < 5.4 ? 0.15 : -0.25 }, t);
        // speed lines
        if (t > 5.4) {
          screen(); g.globalAlpha = 0.7;
          for (var i = 0; i < 14; i++) {
            var x = (i * 37) % W + 4, y = ((i * 53 + t * 900) % (H + 60)) - 60;
            line(x, y, x, y + 24, 1, C.white);
          }
          g.globalAlpha = 1;
        }
        vignette(0.2, "rgba(60,20,60,");
      }
      function sceneGulp(t) {
        var cam = camAt([[8.7, 90, 160, 1.2], [9.3, 90, 160, 1.0], [10.0, 90, 166, 1.06], [12.0, 90, 160, 1.0]], t);
        shake(cam, t, 10.0, 8, 0.6);
        var dark = ramp(t, 9.85, 10.2);
        screen();
        g.fillStyle = vgrad(0, H, [[0, mix(C.sunMid, C.night, dark)], [0.7, mix(C.sunGlow, C.nightMid, dark)], [1, mix(C.skyLow, C.nightMid, dark)]]);
        g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        stars(t, dark);
        var k = ramp(t, 9.3, 10.0);
        if (k < 1) {
          var sx = 90, sy = lerp(110, 222, k), r = lerp(78, 3, k);
          sunDisc(sx, sy, r, t);
        }
        if (dark > 0) { g.globalAlpha = 0.35 * dark; disc(90, 226, 34, C.sunGlow); g.globalAlpha = 1; }
        baby(90, 252, 2.4, { pose: t < 10.0 ? "gulp" : "full", rot: t < 10 ? -0.15 : 0 }, t);
        vignette(0.3, "rgba(20,10,60,");
      }
      function airavata(x, y, s, t) {
        g.save(); g.translate(x, y); g.scale(s, s);
        cloud(0, 22, 70, C.cloud, C.cloudShade);
        ell(0, 0, 24, 15, 0, C.elephantShade); ell(-1, -1, 23, 14, 0, C.elephant);
        rect(-18, 8, 7, 14, C.elephantShade); rect(10, 8, 7, 14, C.elephantShade);
        disc(24, -6, 12, C.elephant); ell(18, -6, 8, 10, 0, C.elephantShade);
        line(32, -2, 36, 14 + Math.sin(t * 3) * 2, 4, C.elephant);
        line(30, 2, 38, 4, 1.4, C.white); line(30, 4, 37, 8, 1.4, C.white);
        disc(27, -9, 1.2, C.ink);
        rect(-14, -16, 30, 4, C.gold); poly([[16, -14], [22, -20], [28, -14]], C.gold);
        // Indra on top
        rrect(-6, -32, 12, 16, 3, C.gold);
        disc(0, -36, 5, C.indra); poly([[-4, -40], [0, -48], [4, -40]], C.gold);
        g.restore();
      }
      function vajra(x, y, s) {
        line(x - 4 * s, y, x + 4 * s, y, 1.6 * s, C.gold);
        poly([[x - 4 * s, y], [x - 9 * s, y - 3 * s], [x - 7 * s, y], [x - 9 * s, y + 3 * s]], C.vajra);
        poly([[x + 4 * s, y], [x + 9 * s, y - 3 * s], [x + 7 * s, y], [x + 9 * s, y + 3 * s]], C.vajra);
        disc(x, y, 1.8 * s, C.gold);
      }
      function sceneIndra(t) {
        var cam = camAt([[11.9, 90, 160, 1.15], [12.5, 90, 160, 1.0], [15.6, 92, 166, 1.06]], t);
        shake(cam, t, 13.6, 14, 0.7);
        var lightBack = ramp(t, 13.7, 14.4);
        screen();
        g.fillStyle = vgrad(0, H, [[0, mix(C.night, C.day, lightBack)], [1, mix(C.nightMid, C.dayLight, lightBack)]]);
        g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        stars(t, 1 - lightBack);
        // Indra on Airavata sweeps in
        var ix = lerp(-70, 46, easeOut((t - 12.0) / 0.9));
        airavata(ix, 104, 1.1, t);
        var raised = ramp(t, 12.8, 13.25);
        // the vajra flies to the baby's jaw
        var fly = clamp01((t - 13.3) / 0.3);
        var bx = 132, byy = 214;
        if (t < 13.3) vajra(ix + 6, 104 - 50 - 10 * raised, 1.2);
        else if (t < 13.62) {
          var vx = lerp(ix + 6, bx - 4, fly), vy = lerp(44, byy - 4, fly);
          g.globalAlpha = 0.5; line(ix + 6, 44, vx, vy, 3, C.vajra); g.globalAlpha = 1;
          vajra(vx, vy, 1.3);
        }
        if (t >= 13.6 && t < 14.0) {
          var k = (t - 13.6) / 0.4;
          for (var i = 0; i < 12; i++) { var a = i * 0.5236; line(bx + Math.cos(a) * 3, byy + Math.sin(a) * 3, bx + Math.cos(a) * (8 + 26 * k), byy + Math.sin(a) * (8 + 26 * k), 2 * (1 - k) + 0.4, i % 2 ? C.vajra : C.white); }
        }
        // the sun pops out and returns to the sky
        if (t > 13.62) {
          var sk = easeOut((t - 13.62) / 0.8);
          sunDisc(lerp(bx, 140, sk), lerp(byy - 6, 52, sk), lerp(3, 26, sk), t);
        }
        // the baby glows (sun inside), then falls
        var fall = clamp01((t - 13.75) / 1.6);
        var by = byy + 160 * fall * fall;
        if (t < 13.62) { g.globalAlpha = 0.35; disc(bx, byy - 6, 22, C.sunGlow); g.globalAlpha = 1; }
        baby(bx, by, 1.7, { pose: t < 13.62 ? "full" : "lie", rot: fall * 2.4, eyes: t > 13.62 ? "closed" : "open" }, t);
        vignette(0.3, "rgba(20,10,60,");
      }
      var WINDS = (function () { var r = rng(19), a = []; for (var i = 0; i < 18; i++) a.push({ y: r() * 320, sp: 60 + r() * 80, l: 10 + r() * 20, ph: r() * 200 }); return a; })();
      function sceneVayu(t) {
        var cam = camAt([[15.4, 90, 170, 1.15], [16.0, 90, 170, 1.0], [20.1, 90, 172, 1.08]], t);
        var still = ramp(t, 16.9, 17.4);
        screen();
        g.fillStyle = vgrad(0, H, [[0, C.day], [1, C.dayLight]]); g.fillRect(0, 0, W, H);
        setCam(cam, 1);
        // Vayu: a vast face woven from wind, grieving
        g.globalAlpha = 0.85;
        for (var h = 0; h < 10; h++) {
          var yy = 40 + h * 8, ph = t * 2 * (1 - still);
          g.strokeStyle = h % 2 ? C.wind : C.windDark; g.lineWidth = 2;
