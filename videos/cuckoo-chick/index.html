<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>This Is Not Her Baby</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #9ad8f0; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #9ad8f0; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <!--
      "This Is Not Her Baby" (the common cuckoo and the reed warbler) — narrated story (Kokoro af_heart), story loop
      (STYLE_GUIDE sections 7 + 9), safe zone (section 8), layout checked with _engine/qa_layout.js. Facts: a female
      cuckoo lays one egg in a reed warbler nest in roughly 10 seconds; the cuckoo egg hatches after ~11-12 days, often
      first; within about a day the blind, naked chick heaves the host eggs out; the hosts feed it until it is several
      times their weight (a fledgling ~8x an adult warbler); its rapid begging call mimics a whole brood of warbler chicks
      (Davies, Kilner & Noble 1998, Proc. R. Soc. B); cuckoos migrate to sub-Saharan Africa.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="55.3" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="55.3" data-track-index="0">
        <canvas id="world" width="360" height="640" data-layout-allow-overflow></canvas>
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="55.3" data-track-index="1"></audio>
    </div>
    <script src="pixel-engine.js"></script>
    <script src="captions.js"></script>
    <script src="short-kit.js"></script>
    <script>
      var T = window.BEATS || {};
      var C = {
        sky0: "#6ab8f0", sky1: "#d8f4ff", night0: "#141a44", night1: "#2a2a5a", water: "#3a8ac8", waterL: "#6ab0e0",
        reed: "#8aa84a", reedD: "#5a7a2a", reedL: "#c8d87a", nest: "#a8784a", nestD: "#6a4a2a", nestL: "#d0a070",
        warb: "#a89a6a", warbD: "#7a6a42", warbL: "#f0e4c4",
        chick: "#9a6a4a", chickD: "#6a4430", chickL: "#c8946a", gape: "#ff7a1a", gapeIn: "#ff3a2a",
        cuck: "#7a8494", cuckD: "#4a5262", cuckL: "#e8e8f0", bar: "#4a5262", beakY: "#ffd23a",
        egg: "#c8d8b0", eggSp: "#6a7a4a", eggC: "#d8d0b0",
        ink: "#0a0614", mouth: "#7a1a3a", eyeW: "#ffffff", blush: "#ff8a9a", ghost: "#ffd0a0",
        gold: "#ffc83a", green: "#3ae86a", pink: "#ff5ab8", cyan: "#3ae8ff", red: "#ff3a4a", white: "#ffffff", paper: "#f1eef4",
      };
      DISSOLVE = 0.12;
      var NX = 90, NY = 120;
      function arcS(cx, cy, r, a0, a1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke(); }
      function say(x, y, str) { g.save(); screen(); bubble(x, y, str, C.ink); g.restore(); }
      function label(str, x, y, col) { g.save(); screen(); worldText(str, x, y + 1, 1, C.ink); worldText(str, x, y, 1, col || C.white); g.restore(); }

      function warblerC(x, y, s, t, o) {       // facing left (towards the nest) unless o.right
        o = o || {};
        g.save(); g.translate(x, y); g.scale(s * (o.right ? 1 : -1), s);
        var f = o.fly ? Math.sin(t * 20) * 7 : 0;
        poly([[-8, 0], [-17, -2], [-16, 3]], C.warbD);
        if (o.fly) poly([[-2, -3], [-9, -13 - f], [5, -4]], C.warbD);
        ell(0, 0, 9, 6, -0.1, C.warb); ell(1, 2, 6, 3.4, 0, C.warbL);
        if (!o.fly) poly([[-5, -2], [5, -2], [-8, 3]], C.warbD);
        disc(8, -5, 4.5, C.warb); poly([[11.5, -6], [17, -5 + (o.feed ? 1 : 0)], [11.5, -4]], C.ink);
        if (o.feed) ell(17.5, -4.5, 2, 1, 0, C.green);
        disc(9, -6, 1.5, C.eyeW); disc(9.4, -6, 0.8, C.ink);
        if (o.tired) line(7.5, -7.6, 10.5, -7.2, 0.8, C.ink);
        if (!o.fly) { line(-1, 5, -2, 9, 0.9, C.warbD); line(2, 5, 2, 9, 0.9, C.warbD); }
        g.restore();
      }
      function warbler(x, y, s, t, o) { character(function () { warblerC(x, y, s, t, o); }); }
      function cuckooC(x, y, s, t, o) {
        o = o || {};
        g.save(); g.translate(x, y); g.scale(s * (o.right ? -1 : 1), s);
        var f = o.fly ? Math.sin(t * 16) * 8 : 0;
        poly([[-9, 0], [-24, 0], [-22, 5]], C.cuckD);
        if (o.fly) poly([[-2, -3], [-12, -15 - f], [6, -4]], C.cuckD);
        ell(0, 0, 11, 6.5, -0.05, C.cuck); ell(1, 2, 7, 4, 0, C.cuckL); for (var b = 0; b < 4; b++) line(-3 + b * 2.4, 0, -2 + b * 2.4, 5, 0.6, C.bar);
        disc(10, -5, 5, C.cuck); poly([[14, -6], [20, -4.5], [14, -3.5]], C.ink);
        disc(11, -6, 1.8, C.beakY); disc(11.3, -6, 0.9, C.ink); line(8.6, -8.4, 13, -7.6, 0.9, C.ink);
        g.restore();
      }
      function cuckoo(x, y, s, t, o) { character(function () { cuckooC(x, y, s, t, o); }); }
      function chickC(x, y, s, t, o) {          // the giant cuckoo chick sitting in the nest (x, y = nest rim centre)
        o = o || {};
        var beg = o.beg === undefined ? (0.5 + 0.5 * Math.sin(t * 12)) : o.beg;
        g.save(); g.translate(x, y); g.scale(s, s);
        if (o.naked) { ell(0, -6, 9, 7, 0, "#ffb8a0"); ell(0, -7, 7, 5, 0, "#ffd0c0"); }
        else { ell(0, -10, 16, 13, 0, C.chickD); ell(0, -11, 15, 12, 0, C.chick); for (var k = 0; k < 6; k++) disc(-10 + k * 4, -16 + (k % 2) * 3, 2, C.chickL); }
        var hy = o.naked ? -14 : -24;
        disc(2, hy, o.naked ? 6 : 10, o.naked ? "#ffb8a0" : C.chick);
        // the bright begging gape
        var gw = (o.naked ? 4 : 7) * (0.6 + 0.4 * beg);
        poly([[2, hy + 1], [2 + gw * 1.6, hy - gw * 0.9], [2 + gw * 1.6, hy + gw]], C.gape); poly([[3, hy + 1], [2 + gw * 1.4, hy - gw * 0.5], [2 + gw * 1.4, hy + gw * 0.6]], C.gapeIn);
        if (o.naked) line(-1, hy - 2, 2, hy - 2, 0.8, C.ink); else { disc(-2, hy - 3, 2.2, C.eyeW); disc(-1.6, hy - 3, 1.2, C.ink); }
        g.restore();
      }
      function chick(x, y, s, t, o) { character(function () { chickC(x, y, s, t, o); }); }
      function egg(x, y, s, cuck) { ell(x, y, 3.6 * s, 4.8 * s, 0, C.nestD); ell(x, y - 0.3, 3.2 * s, 4.4 * s, 0, cuck ? C.eggC : C.egg); for (var k = 0; k < 4; k++) disc(x - 1.5 * s + (k % 2) * 2.4 * s, y - 2 * s + k * 1.3 * s, 0.5 * s, C.eggSp); }
      function marsh(t, cam, night) {
        sky(night ? [[0, C.night0], [1, C.night1]] : [[0, C.sky0], [0.55, C.sky1], [1, C.sky1]]);
        setCam(cam, 1);
        rect(-60, 150, 300, 240, C.water); for (var w = 0; w < 6; w++) rect(((w * 40 + t * 8) % 240) - 30, 156 + w * 9, 18, 1, C.waterL);
        for (var r = 0; r < 9; r++) { var rx = 6 + r * 21, sw = Math.sin(t * 1.5 + r) * 2; line(rx, 330, rx + sw, 70 + (r % 3) * 10, 2, C.reedD); ell(rx + sw, 68 + (r % 3) * 10, 2.4, 7, 0, C.reedL); }
      }
      function nestBack() { ell(NX, NY, 26, 9, 0, C.nestD); ell(NX, NY - 1, 23, 7, 0, "#5a3a1a"); }
      function nestFront() { g.fillStyle = C.nest; g.beginPath(); g.ellipse(NX, NY, 26, 14, 0, 0, Math.PI); g.fill(); for (var k = 0; k < 8; k++) line(NX - 24 + k * 6.5, NY + 2, NX - 20 + k * 6.5, NY + 10, 0.8, C.nestL); }

      // ============================================================ scenes
      function scene_nest(t) {
        var tt = tapeT(t, T);
        var night = tt >= T.WORKS && tt < T.TOOBIG && Math.floor((tt - T.WORKS) / 0.42) % 2 === 1;
        var cam = { x: 90, y: 160, z: 1.0 };
        if (tt >= T.MEET && tt < T.HORRIBLE) cam = { x: 90, y: 150, z: 1.35 };
        marsh(tt, cam, night);
        nestBack();
        var phase = tt < T.MEET ? "giant" : tt < T.HATCH ? "eggs" : tt < T.ONLY ? "hatch" : tt < T.FLY ? "giant" : tt < T.SPRING ? "empty" : "spring";
        var eggsLeft = 4;
        if (phase === "eggs" || phase === "hatch" || phase === "spring") {
          var showCuck = phase !== "spring" && tt >= T.FIVE;
          if (phase === "hatch") eggsLeft = 4 - countOf(T.PUSHES, tt);
          for (var e = 0; e < eggsLeft; e++) egg(NX - 13 + e * 7, NY - 2, 1, false);
          if (showCuck && phase === "eggs") egg(NX + 16, NY - 3, 1.3, true);
          if (phase === "hatch") chick(NX + 14, NY + 2, 1.0, tt, { naked: true, beg: 0.3 });
          // the egg being pushed: lifts on the chick's back and tumbles over the rim
          if (phase === "hatch") { var lp = lastOf(T.PUSHES, tt), d = tt - lp; if (d >= -0.4 && d < 0.6 && lp > 0) { var p = clamp01((d + 0.4) / 1.0); egg(NX + 14 + p * 18, NY - 10 - Math.sin(p * Math.PI) * 10 + p * p * 40, 1, false); } }
        }
        if (phase === "giant") {
          var s = tt < T.MEET ? 1.25 : tt < T.TOOBIG ? lerp(0.8, 1.25, clamp01((tt - T.ONLY) / (T.TOOBIG - T.ONLY))) : 1.35;
          chick(NX, NY + 4, s, tt, {});
          var fd = tt < T.MEET ? 1.5 : lastOf(T.FEEDS, tt), d2 = tt - fd;
          var wx = d2 >= -0.5 && d2 < 0.5 ? NX + 22 * s + 8 : 150, wy = d2 >= -0.5 && d2 < 0.5 ? NY - 30 * s : 88;
          warbler(wx, wy, 1.1, tt, { feed: d2 > -0.3 && d2 < 0.2, fly: !(d2 >= -0.5 && d2 < 0.5), tired: tt > T.WORKS });
        }
        if (phase === "empty") {
          warbler(NX + 18, NY - 8, 1.2, tt, { tired: true });
          var fp = clamp01((tt - T.FLY - 0.5) / 2.0); character(function () { chickC(NX + fp * 60, NY - 6 - fp * 22, 0.9, tt, { beg: 0 }); });
          if (tt > T.FLY + 1.2) label("TO AFRICA", 90, 196, C.gold);
        }
        if (phase === "spring") cuckoo(146, 86, 1.0, tt, { right: true });
        nestFront();
        if (tt >= T.CUCKOO && tt < T.HATCH) { var cp = clamp01((tt - T.CUCKOO) / 1.0); cuckoo(lerp(10, NX + 30, cp > 0.8 ? 1 - (cp - 0.8) * 5 + 0.8 : cp), lerp(90, NY - 14, Math.min(cp, 0.8) / 0.8), 1.1, tt, { fly: cp < 0.6 || tt > T.CUCKOO + 2.0 }); }
        if (tt >= T.BIG && tt < T.CUCKOO) { line(NX + 16, NY - 12, NX + 16, NY - 22, 1, C.red); label("?", NX + 16, NY - 34, C.red); }
        if (phase === "eggs" && tt < T.FIVE) warbler(NX - 30, NY - 10, 1.2, tt, { right: true, fly: tt > W2(2) });
        if (tt >= T.THANKS && tt < T.SPRING) say(70, 66, "...BYE?");
      }
      function W2() { return T.MEET + 3.0; }
      function scene_listen(t) {
        var cam = { x: 90, y: 160, z: 1.0 };
        sky([[0, C.night0], [1, C.night1]]); setCam(cam, 1);
        var on = t >= T.CHORUS;
        chick(90, 132, 1.5, t, { beg: on ? 0.5 + 0.5 * Math.sin(t * 20) : 0.2 });
        if (on) {
          for (var w = 0; w < 4; w++) { var p = ((t - T.CHORUS) * 1.4 + w / 4) % 1; g.strokeStyle = C.white; g.globalAlpha = 1 - p; g.lineWidth = 1; g.beginPath(); g.arc(104, 96, 10 + p * 40, -1.0, 1.0); g.stroke(); } g.globalAlpha = 1;
          var n = Math.min(8, Math.floor((t - T.CHORUS) * 3.5) + 1);
          for (var k = 0; k < n; k++) { var gx = [28, 150, 40, 140, 22, 158, 60, 120][k], gy = [72, 72, 104, 104, 130, 130, 64, 64][k]; g.globalAlpha = 0.85; character(function () { chickC(gx, gy, 0.42, t + k, { naked: true }); }); g.globalAlpha = 1; }
          label("= 4+ BABIES", 90, 196, C.gold);
        }
      }

      function sceneAt(t) { var tt = tapeT(t, T); return tt >= T.LISTEN && tt < T.WORKS ? "listen" : "nest"; }
      function drawUI(t) {
        var tt = tapeT(t, T), c2 = (tt >= T.LISTEN && tt < T.WORKS) ? C.white : C.ink;
        if (tt < T.MEET) counterLines("WEIGHT: 8X", C.red, 3, "NOT HER BABY", c2);
        else if (tt < T.FIVE) counterLines("EGGS: 4", C.green, 3, "REED WARBLER", c2);
        else if (tt < T.HATCH) counterLines("EGGS: 5", C.red, 3, tt < T.CUCKOO ? "ONE TOO MANY" : "CUCKOO: 10 SEC", c2);
        else if (tt < T.ONLY) counterLines("EGGS: " + (4 - countOf(T.PUSHES, tt)), C.red, 3, "DAY 12", c2);
        else if (tt < T.LISTEN) counterLines("FOOD TRIPS: " + countOf(T.FEEDS, tt), C.gold, 3, "BABIES: 1", c2);
        else if (tt < T.WORKS) counterLines("BABIES: 1", C.gold, 3, tt < T.CHORUS ? "SHH..." : "SOUNDS LIKE: 4+", c2);
        else if (tt < T.FLY) counterLines("FOOD TRIPS: " + countOf(T.FEEDS, tt), C.gold, 3, "DAY AND NIGHT", tt >= T.WORKS && tt < T.TOOBIG && Math.floor((tt - T.WORKS) / 0.42) % 2 === 1 ? C.white : C.ink);
        else if (tt < T.SPRING) counterLines("THANKS: 0", C.red, 3, "OFF TO AFRICA", c2);
        else counterLines("EGGS: 4", C.green, 3, "NEXT SPRING", c2);
      }

      KIT.start(C, T, {
        scenes: { nest: scene_nest, listen: scene_listen },
        sceneAt: sceneAt, ui: drawUI, hitCol: C.gape,
        cuts: [[T.LISTEN, "nest", "listen"], [T.WORKS, "listen", "nest"]],
      });
    </script>
  </body>
</html>
