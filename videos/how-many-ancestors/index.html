          line(X(-w3 / 2), Yy(ty3), X(w3 / 2), Yy(ty3), Math.max(0.3, lw * 0.5), C.goldD);
          g.globalAlpha = 1;
        }
        // the frontier: the row being added glows bright
        if (gc >= 3.5 && t < T.FOLD + 1.5) {
          var fr = Math.min(gc, 33), wf = rowW(fr, t), yf = Yy(KID_H + Y(fr));
          g.globalAlpha = 1 - foldAt(t);
          lighter(); glow(X(0), yf, wf * s * 0.55, C.amber, 0.25); normalBlend();
          line(X(-wf / 2), yf, X(wf / 2), yf, 1.1, C.goldL);
          // the 300-million reveal: only a sliver of the 1036 row were real people
          if (t > T.FEW && t < T.FOLD + 1.5) {
            var k = ramp(t, T.FEW + 0.2, T.FEW + 1.4), real = wf * lerp(1, 0.035, k);
            line(X(-wf / 2), yf, X(wf / 2), yf, 1.1, C.dim);
            line(X(-real / 2), yf, X(real / 2), yf, 2.2, C.red);
            if (k > 0.9) { worldText("REAL PEOPLE", X(0), yf - 10, 1, C.red); poly([[X(0) - 2, yf - 3], [X(0) + 2, yf - 3], [X(0), yf - 1]], C.red); }
          }
          g.globalAlpha = 1;
        }
        // the shared ancestor: one glowing node at the top of the diamond, lines from many spots meet in them
        if (t > T.ONE - 0.3) {
          var ga = clamp01((t - T.ONE + 0.3) / 0.4), tg = topGen(t), ya = Yy(KID_H + Y(tg)) - 2;
          lighter(); glow(X(0), ya, 26, C.goldL, 0.8 * ga); normalBlend();
          character(function () { head(X(0), ya, 3.4 * Math.min(1.2, pop(t, T.ONE - 0.1)), 7); });
          if (t < T.ALL) {
            for (var q = 0; q < 10; q++) {
              var gq = 16 + q * 1.6, wq = rowW(gq, t), side = q % 2 ? 1 : -1;
              g.globalAlpha = ga * (0.6 + 0.4 * Math.sin(t * 6 + q));
              line(X(side * wq * 0.42 * hash1(q + 3)), Yy(KID_H + Y(gq)), X(0), ya, 0.6, C.goldL);
            }
            g.globalAlpha = 1;
          }
        }
        // everyone alive today: a row of people spreading out beside YOU
        var ev = ramp(t, T.SHARE - 0.4, T.SHARE + 1.6);
        if (ev > 0) {
          var nP = 26, wP = 560 * ev;
          for (var pp = 0; pp < nP; pp++) {
            if (pp === nP / 2) continue;
            var xp = (pp + 0.5) / nP * wP - wP / 2, ta = hash1(pp * 5.3);
            g.globalAlpha = ev * 0.6; line(X(xp), Yy(KID_H - 8), X(xp * 0.25 + (ta - 0.5) * 30), Yy(KID_H + Y(10)), 0.4, C.goldD); g.globalAlpha = 1;
          }
          character(function () {
            for (var pp = 0; pp < nP; pp++) {
              if (pp === nP / 2) continue;
              var xp = (pp + 0.5) / nP * wP - wP / 2;
              kid(X(xp), ROOT_Y + 2, s * 0.62, { t: t, seed: pp, pal: { skin: SKINS[pp % 6][0], skinD: SKINS[pp % 6][1], skinL: SKINS[pp % 6][0], hair: HAIRS[pp % 7], hairL: HAIRS[(pp + 1) % 7], hoodie: [C.cyan, C.pink, C.green, C.gold, C.red][pp % 5], hoodieD: C.goldD }, bun: pp % 2 === 0 });
            }
          });
        }
        // YOU at the root
        var puzzled = t > T.WAIT - 0.1 && t < T.Y1036 || t > T.WHERE - 0.1 && t < T.FOLD + 0.8;
        character(function () {
          kid(X(0), ROOT_Y + 2, s * 0.62, { t: t, talk: talk("you", t), puzzled: puzzled, shrug: t > T.EASY && t < T.DOUBLE - 0.2 || t > T.WHERE && t < T.FOLD });
        });
        if (t > T.EASY + 0.15 && t < T.DOUBLE - 0.1) bubble(X(0) + 22, Yy(KID_H) - 18, "EASY.", C.ink);
        if (t > T.WAIT + 0.1 && t < T.Y1036 - 0.6) bubble(X(0) + 26, Yy(KID_H) - 14, "WAIT...", C.red);
        if (t > T.WHERE + 0.1 && t < T.FOLD + 0.2) bubble(X(0) + 26, Yy(KID_H) - 14, "WHERE?", C.red);
        if (s < 0.8) { worldText("YOU", X(0), ROOT_Y + 6, 1, C.goldL); }
        vignette(0.35, "rgba(10,6,30,");
      }

      // ============================================================ the shared ancestor speaks
      function scene_anc(t) {
        var cam = camAt([[T.ANC - 0.2, 90, 176, 1.0], [T.CTA, 90, 182, 1.12]], t);
        night(t);
        setCam(cam, 1);
        // the diamond's lines pour down from their feet into today's billions
        for (var m = 0; m < 70; m++) {
          var h1 = hash1(m * 3.7), xb = -40 + h1 * 260, sway = Math.sin(t * 1.5 + m) * 2;
          g.globalAlpha = 0.35 + 0.3 * hash1(m + 9); line(90, 300, xb + sway, 420, 0.6, m % 3 ? C.goldD : C.gold); g.globalAlpha = 1;
        }
        lighter(); glow(90, 250, 90, C.goldL, 0.45); glow(90, 300, 40, C.amber, 0.6); normalBlend();
        // light rays
        for (var r = 0; r < 9; r++) { var a = -Math.PI / 2 + (r - 4) * 0.22 + Math.sin(t * 0.5) * 0.04; g.globalAlpha = 0.07; poly([[90, 200], [90 + Math.cos(a - 0.05) * 200, 200 + Math.sin(a - 0.05) * 200], [90 + Math.cos(a + 0.05) * 200, 200 + Math.sin(a + 0.05) * 200]], C.goldL); }
        g.globalAlpha = 1;
        ell(90, 302, 30, 5, 0, C.goldD); ell(90, 301, 26, 3.5, 0, C.gold);
        var pp = Math.min(1, pop(t, T.ANC - 0.1));
        character(function () { elder(90, 300, 1.0 * pp, t, talk("ancestor", t)); });
        // the little dots of 8 billion descendants twinkle in at "all 8 billion"
        if (t > T.EIGHTB) {
          var e = clamp01((t - T.EIGHTB) / 1.2);
          for (var d = 0; d < 120 * e; d++) { var dx = hash1(d * 1.3) * 180, dy = 310 + hash1(d * 2.9) * 12; g.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5 + d); rect(dx, dy, 1, 1, d % 4 ? C.goldL : C.white); }
          g.globalAlpha = 1;
        }
        vignette(0.35, "rgba(10,6,30,");
      }

      // ============================================================ CTA: YOU meets a long-lost cousin
      function scene_cta(t) {
        var tt = t; if (t > T.STOP) { var tau = t - T.STOP, TT = T.REWIND - T.STOP; tt = T.STOP + tau - tau * tau / (2 * TT); }
        var cam = camAt([[T.CTA - 0.2, 90, 172, 1.0], [T.STOP, 90, 178, 1.1]], tt);
        night(tt);
        setCam(cam, 1);
        // a golden thread from a tiny ancestor up top, splitting down to both kids
        lighter(); glow(90, 70, 26, C.goldL, 0.7); normalBlend();
        var dr = ramp(tt, T.CTA + 0.2, T.CTA + 1.0);
        line(90, 74, 90, lerp(74, 200, dr), 1, C.gold);
        if (dr >= 1) { var d2 = ramp(tt, T.CTA + 1.0, T.CTA + 1.5); line(90, 200, lerp(90, 56, d2), lerp(200, 222, d2), 1, C.gold); line(90, 200, lerp(90, 124, d2), lerp(200, 222, d2), 1, C.gold); }
        character(function () { head(90, 68, 4, 7); });
        var meet = ease(clamp01((tt - T.CTA) / 0.8));
        character(function () {
          kid(lerp(30, 56, meet), 302, 1.15, { t: tt, wave: tt > T.CTA + 0.6, seed: 1 });
          kid(lerp(150, 124, meet), 302, 1.15, { t: tt, wave: tt > T.CTA + 0.6, look: -1, pal: COUSIN, bun: false, seed: 4 });
        });
        if (tt > T.CTA + 0.7) { bubble(146, 206, "COUSIN!", C.goldD); }
        for (var c = 0; c < 26; c++) { var y = ((tt - T.CTA) * (30 + hash1(c) * 30) + hash1(c + 7) * 320) % 340 - 10, x = hash1(c + 3) * 180; poly([[x, y], [x + 2, y + 1], [x, y + 3]], [C.gold, C.pink, C.cyan, C.green][c % 4]); }
        vignette(0.3, "rgba(10,6,30,");
      }

      function sceneAt(t) { return t < T.ANC ? "tree" : t < T.CTA ? "anc" : t < T.REWIND ? "cta" : "tree"; }

      // ============================================================ the counter at the top, the whole time
      function drawUI(t) {
        var gc = gen(t), gi = Math.floor(gc + 1e-6), l0 = "ANCESTORS", l1, l2 = "", c1 = C.gold, S1 = 3;
        if (t >= T.REWIND) gi = 0;
        if (t < T.BREAK || t >= T.REWIND) {
          l1 = gi === 0 ? "0" : commas(Math.pow(2, gi));
          c1 = gi >= 30 ? C.amber : C.gold;
          l2 = gi === 0 ? "YEAR 2026" : "YEAR " + (2026 - 30 * gi) + "  -  GEN " + gi;
        } else if (t < T.PEAK) { l1 = ""; }
        else if (t < T.FEW) {
          l1 = "8,589,934,592"; c1 = Math.floor(t * 8) % 2 ? C.red : C.white;
          l2 = t > T.MORE ? "ALIVE TODAY: ~8.2 BILLION" : "YEAR 1036  -  GEN 33";
        } else if (t < T.FOLD) {
          l0 = "ALIVE IN 1036"; l1 = "~300,000,000"; c1 = C.red; l2 = "NEEDED: 8,589,934,592";
        } else if (t < T.ALL) {
          l0 = "SAME PEOPLE,"; l1 = "MANY SPOTS"; S1 = 3; c1 = C.gold;
          l2 = t > T.ONE ? "1 ANCESTOR = 1000S OF SPOTS" : "THE TREE FOLDS IN";
        } else if (t < T.ANC) {
          l0 = "YEARS AGO"; var ya = Math.round(990 + 2000 * ramp(t, T.ALL + 0.1, T.SHARE + 0.8));
          l1 = (ya >= 2990 ? "3,000+" : commas(ya)); c1 = C.gold; l2 = t > T.SHARE ? "EVERYONE: SAME ANCESTORS" : "";
        } else if (t < T.CTA) {
          l0 = "THEIR DESCENDANTS"; var dsc = t > T.EIGHTB ? Math.round(8e9 * ramp(t, T.EIGHTB, T.EIGHTB + 1.2)) : 0;
          l1 = commas(dsc); c1 = C.gold; l2 = "INCLUDING YOU";
        } else {
          l0 = "YOUR COUSINS"; l1 = "~8 BILLION"; c1 = Math.floor(t * 4) % 2 ? C.gold : C.pink; l2 = "";
        }
        uiCentre(l0, 22, 2, C.paper);
        if (l1) uiCentre(l1, 42, S1, c1);
        if (l2) uiCentre(l2, 42 + 7 * S1 + 9, 2, C.white);
      }

      PX.setup(C, {
        scenes: { tree: scene_tree, anc: scene_anc, cta: scene_cta },
        sceneAt: sceneAt,
        cuts: [[T.ANC, "tree", "anc"], [T.CTA, "anc", "cta"]],
        post: function (t, img) {
          if (t > T.BREAK && t < T.PEAK) tintImg(img, C.ink, 0.5);
          if (t >= T.PEAK && t < T.PEAK + 0.15) tintImg(img, C.white, 0.9 * (1 - (t - T.PEAK) / 0.15));
          if (t >= T.ONE - 0.05 && t < T.ONE + 0.12) tintImg(img, C.goldL, 0.4 * (1 - (t - T.ONE + 0.05) / 0.17));
          if (t > T.STOP && t < T.REWIND) tintImg(img, C.ink, 0.7 * (t - T.STOP) / (T.REWIND - T.STOP));
        },
        ui: drawUI,
        captions: (window.CAPS || []).map(function (c) {
          return { a: c.a, b: c.b, lines: c.segs.map(function (ln) { return ln.map(function (s) { return [s[0], s[1] === "g" ? C.gold : C.paper]; }); }) };
        }),
      });

      var proxy = { t: 0 };
      var tl = gsap.timeline({ paused: true });
      // the loop: after the tape-stop, a short rewind glitch lands exactly on frame 1
      function renderLoop(t) {
        if (t < T.REWIND) { PX.render(t); return; }
        PX.render(0);
        var img0 = wctx.getImageData(0, 0, PW, PH);
        var k = 1 - clamp01((t - T.REWIND) / 0.35);
        if (k > 0) { glitchRows(img0, 12 * k, Math.floor(t * 30)); wctx.putImageData(img0, 0, 0); }
      }
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { renderLoop(proxy.t); } }, 0);
      PX.render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
