<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Don't Yawn</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #2a2a6a; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #2a2a6a; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <!--
      "Don't Yawn" (contagious yawning) — text cards + sound only (STYLE_GUIDE.md section 6), safe zone (section 8),
      layout checked with _engine/qa_layout.js. Facts: roughly 40-60 % of adults yawn after seeing a yawn (Provine 1986;
      Platek et al. 2003); reading about or thinking about yawning can trigger it (Provine 2005, Am. Sci.); dogs can catch
      human yawns (Joly-Mascheroni et al. 2008, Biol. Lett.); it spreads more between close friends and family than
      strangers (Norscia & Palagi 2011, PLoS ONE); why we yawn is still debated, one hypothesis is brain cooling (Gallup
      & Gallup 2007); contagious yawning usually appears around age 4-5 (Anderson & Meno 2003; Helt et al. 2010).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="27.2" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="27.2" data-track-index="0">
        <canvas id="world" width="360" height="640" data-layout-allow-overflow></canvas>
        <canvas id="ui" width="360" height="640"></canvas>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="27.2" data-track-index="1"></audio>
    </div>
    <script src="pixel-engine.js"></script>
    <script src="captions.js"></script>
    <script src="short-kit.js"></script>
    <script>
      var T = window.BEATS || {};
      var C = {
        bg0: "#3a3a8a", bg1: "#1a1a4a", bgW: "#ffe8c8", bgWD: "#f0c898", floor: "#8a5a3a", floorD: "#5a3a22",
        skin1: "#ffc8a0", skin1D: "#d8946a", skin2: "#c8845a", skin2D: "#9a5a3a", skin3: "#8a5a3a", skin3D: "#5a3a22",
        hairB: "#3a2418", hairY: "#ffd23a", hairR: "#d84a2a", hairG: "#d8d8e0",
        shirtB: "#3a7aff", shirtR: "#ff4a4a", shirtG: "#3ac86a", shirtP: "#a85ad8", shirtY: "#ffb83a", pants: "#3a3a5a",
        mouthIn: "#5a0a2a", tongue: "#ff7a9a", tooth: "#ffffff", tear: "#9ae8ff",
        dog: "#e8b878", dogD: "#b8844a", dogL: "#fff0d8",
        brain: "#ff9ac0", brainD: "#d8608a", fan: "#c8d4e8", book: "#e83a3a", page: "#fff8e8",
        moon: "#fff4b0", star: "#ffe87a", bed: "#7a8aff",
        ink: "#0a0614", mouth: "#7a1a3a", eyeW: "#ffffff", blush: "#ff8a9a",
        gold: "#ffc83a", green: "#3ae86a", pink: "#ff5ab8", cyan: "#3ae8ff", red: "#ff3a4a", white: "#ffffff", paper: "#f1eef4",
      };
      DISSOLVE = 0.12;
      function arcS(cx, cy, r, a0, a1, w, col) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke(); }
      function say(x, y, str) { g.save(); screen(); bubble(x, y, str, C.ink); g.restore(); }
      function label(str, x, y, col) { g.save(); screen(); worldText(str, x, y + 1, 1, C.ink); worldText(str, x, y, 1, col || C.white); g.restore(); }
      function yk(who, t) {
        var i = T.WHO.indexOf(who); if (i < 0) return 0;
        var d = t - T.YAWNS[i];
        return d < 0 ? 0 : d < 0.45 ? ease(d / 0.45) : d < 1.0 ? 1 : d < 1.5 ? 1 - ease((d - 1.0) / 0.5) : 0;
      }
      var SK = [["skin1", "skin1D"], ["skin2", "skin2D"], ["skin3", "skin3D"]];

      // ============================================================ a head (front), radius r, yawn 0..1
      function headC(x, y, r, o) {
        o = o || {};
        var sk = SK[o.skin || 0], y0 = o.yawn || 0;
        var hair = o.hair || C.hairB;
        g.save(); g.translate(x, y); g.scale(r / 10, r / 10);
        if (o.long) { rrect(-11, -6, 22, 18, 5, hair); }
        disc(-10, 1, 2.4, C[sk[1]]); disc(10, 1, 2.4, C[sk[1]]);
        ell(0, 0, 10, 11 + y0 * 1.5, 0, C[sk[1]]); ell(0, -0.4, 9.4, 10.4 + y0 * 1.5, 0, C[sk[0]]);
        if (o.kid) { disc(0, -9, 6, hair); disc(-5, -8, 4, hair); disc(5, -8, 4, hair); }
        else if (o.bun) { ell(0, -8, 9.5, 4.5, 0, hair); disc(0, -13, 3.5, hair); }
        else { ell(0, -7.5, 9.8, 5, 0, hair); rect(-9.8, -8, 3, 7, hair); rect(6.8, -8, 3, 7, hair); }
        // eyes: open -> squeezed shut during a yawn
        if (y0 > 0.3) { line(-6, -1, -2, -0.4, 1, C.ink); line(2, -0.4, 6, -1, 1, C.ink); if (y0 > 0.8) ell(-7, 1.5, 0.8, 1.4, 0, C.tear); }
        else { disc(-4, -1, 1.5, C.ink); disc(4, -1, 1.5, C.ink); disc(-4.4, -1.6, 0.5, C.white); disc(3.6, -1.6, 0.5, C.white); }
        line(-6, -4 - y0, -2, -4.5 - y0 * 1.5, 0.8, C.ink); line(2, -4.5 - y0 * 1.5, 6, -4 - y0, 0.8, C.ink);
        disc(-6, 3, 1.4, C.blush); disc(6, 3, 1.4, C.blush);
        // mouth: smile -> huge yawn
        if (y0 > 0.05) { ell(0, 5.5 + y0, 2 + 2.6 * y0, 1 + 4.2 * y0, 0, C.mouthIn); ell(0, 7 + 3.6 * y0, 1.6 + 1.6 * y0, 0.6 + 1.4 * y0, 0, C.tongue); rect(-1.5 - 1.5 * y0, 1.6 + 0.4 * (1 - y0), 3 + 3 * y0, 0.9, C.tooth); }
        else if (o.mood === "o") ell(0, 5.5, 1.3, 1.6, 0, C.mouth);
        else arcS(0, 4, 2.4, 0.3, Math.PI - 0.3, 0.8, C.mouth);
        g.restore();
      }
      function head(x, y, r, o) { character(function () { headC(x, y, r, o); }); }
      function personC(x, y, s, t, o) {
        o = o || {};
        var kid = o.kid ? 0.7 : 1, y0 = o.yawn || 0;
        g.save(); g.translate(x, y); g.scale(s * kid, s * kid);
        rect(-6, -16, 5, 16, C.pants); rect(1, -16, 5, 16, C.pants); rect(-7, -1, 6, 2, C.ink); rect(1, -1, 6, 2, C.ink);
        var sh = o.shirt || C.shirtB, sk = SK[o.skin || 0];
        rrect(-9, -34, 18, 20, 4, sh);
        // arms: stretch up on a big yawn
        var up = y0 > 0.5 ? (y0 - 0.5) * 2 : 0;
        line(-9, -31, -12 - 2 * up, -18 - 22 * up, 3, sh); line(9, -31, 12 + 2 * up, -18 - 22 * up, 3, sh);
        disc(-12 - 2 * up, -17 - 22 * up, 2, C[sk[0]]); disc(12 + 2 * up, -17 - 22 * up, 2, C[sk[0]]);
        g.restore();
        headC(x, y - 43 * s * kid, 9 * s * kid, o);
      }
      function person(x, y, s, t, o) { character(function () { personC(x, y, s, t, o); }); }
      function dogC(x, y, s, t, y0) {
        g.save(); g.translate(x, y); g.scale(s, s);
        ell(4, -10, 12, 9, 0, C.dogD); ell(4, -10.5, 11, 8.2, 0, C.dog); ell(2, -6, 6, 5, 0, C.dogL);
        line(14, -6, 20, -14 + Math.sin(t * 10) * 3, 2.6, C.dogD);
        rect(-4, -4, 3, 4, C.dogD); rect(6, -4, 3, 4, C.dogD);
        // head (facing left), tilts back when yawning
        g.save(); g.translate(-6, -20); g.rotate(-0.3 * y0);
        disc(0, 0, 8, C.dogD); disc(0, -0.4, 7.4, C.dog);
        poly([[3, -6], [9, -14], [8, -3]], C.dogD); poly([[-3, -6], [-8, -14], [-7, -3]], C.dogD);
        ell(-7, 3, 5, 3.4, 0, C.dogL); disc(-11, 2, 1.6, C.ink);
        if (y0 > 0.05) { ell(-8, 5.5, 3.4, 1 + 3.6 * y0, 0, C.mouthIn); ell(-8, 7 + 2 * y0, 2, 1 + y0, 0, C.tongue); }
        if (y0 > 0.3) { line(-5, -3, -2, -2, 0.9, C.ink); } else { disc(-3.5, -2.5, 1.4, C.ink); disc(-3.9, -3, 0.4, C.white); }
        g.restore();
        g.restore();
      }
      function dog(x, y, s, t, y0) { character(function () { dogC(x, y, s, t, y0); }); }
      function room(cam, night) {
        sky([[0, night ? C.bg0 : C.bgW], [1, night ? C.bg1 : C.bgWD]]);
        setCam(cam, 1);
        if (night) for (var s = 0; s < 20; s++) rect(hash1(s) * 180, 40 + hash1(s + 5) * 80, 1, 1, C.star);
        rect(-60, 138, 300, 240, C.floorD); rect(-60, 138, 300, 3, C.floor);
      }

      // ============================================================ scenes
      function scene_face(t) {
        var tt = tapeT(t, T);
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, true);
        disc(146, 64, 9, C.moon); disc(150, 61, 8, C.bg0);
        var y0 = Math.max(yk("face", tt), yk("face2", tt), yk("face3", tt));
        head(90, 102, 32, { yawn: y0, skin: 0, hair: C.hairB });
        if (tt > T.CTA + 1.0) { for (var z = 0; z < 3; z++) { var zp = ((tt - T.CTA) * 0.8 + z / 3) % 1; worldText("Z", 126 + zp * 14, 76 - zp * 16, 1 + (z % 2), C.white); } }
        if (tt >= T.YOU) { label("YOU, RIGHT NOW", 90, 196, C.gold); }
      }
      function scene_chain(t) {
        var chain = t >= T.CHAIN;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        if (!chain) {
          person(58, 138, 1.35, t, { yawn: yk("a", t), shirt: C.shirtB, skin: 0 });
          person(122, 138, 1.35, t, { yawn: yk("b", t), shirt: C.shirtR, skin: 2, hair: C.hairB, long: true, mood: t > T.SEE + 0.6 && t < T.SEE + 1.1 ? "o" : "" });
          if (t > T.SEE + 0.4 && t < T.SEE + 1.0) { line(70, 70, 100, 70, 1.4, C.gold); poly([[100, 67], [104, 70], [100, 73]], C.gold); }
        } else {
          var X = [24, 68, 112, 156], sh = [C.shirtG, C.shirtP, C.shirtY, C.shirtB], sk = [1, 0, 2, 0];
          for (var i = 0; i < 4; i++) person(X[i] - (i === 3 ? 6 : 0), 138, 1.15, t, { yawn: yk("c" + i, t), shirt: sh[i], skin: sk[i], hair: i === 1 ? C.hairY : i === 2 ? C.hairB : C.hairR, long: i === 1 });
          // domino arrows
          for (var j = 0; j < 3; j++) { var a = clamp01((t - T.YAWNS[T.WHO.indexOf("c" + j)] - 0.3) / 0.3); if (a > 0) { line(X[j] + 10, 72, X[j] + 10 + 22 * a, 72, 1.2, C.gold); } }
        }
      }
      function scene_half(t) {
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        for (var i = 0; i < 10; i++) {
          var r = Math.floor(i / 5), c = i % 5, x = 22 + c * 34, y = 80 + r * 34;
          var yi = i % 2 === 0 ? yk("h" + (i / 2), t) : 0;
          var stays = i % 2 === 0 && t > T.YAWNS[T.WHO.indexOf("h" + (i / 2))] + 0.5;
          head(x, y, 12, { yawn: stays ? Math.max(yi, 0.7) : yi, skin: i % 3, hair: [C.hairB, C.hairY, C.hairR, C.hairB, C.hairG][c], long: i % 4 === 1 });
        }
        label("5 OUT OF 10", 90, 196, C.gold);
      }
      function scene_read(t) {
        var think = t >= T.THINK;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        var who = think ? "thinker" : "reader", y0 = yk(who, t);
        person(72, 138, 1.25, t, { yawn: y0, shirt: think ? C.shirtP : C.shirtG, skin: think ? 2 : 1, long: think, hair: think ? C.hairB : C.hairR });
        if (!think) {
          g.save(); g.translate(104, 112); g.rotate(-0.15);
          rect(-16, -12, 32, 22, C.book); rect(-15, -11, 14.5, 20, C.page); rect(0.5, -11, 14.5, 20, C.page);
          worldText("YAWN", -8, -6, 1, C.ink); for (var l = 0; l < 3; l++) { rect(-13, 2 + l * 2.5, 11, 0.8, C.ink); rect(2.5, -8 + l * 3, 11, 0.8, C.ink); }
          g.restore();
        } else {
          disc(96, 84, 2.5, C.white); disc(104, 80, 3.4, C.white);
          rrect(106, 66, 40, 16, 7, C.white); worldText("YAWN", 126, 71, 1, C.ink);
        }
      }
      function scene_dog(t) {
        var friends = t >= T.FRIEND;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        if (!friends) {
          person(56, 138, 1.25, t, { yawn: yk("dog", t - 0.6) || (t < T.HIT + 0.6 && t > T.HIT - 0.6 ? 1 : 0), shirt: C.shirtB, skin: 0 });
          dog(128, 138, 1.6, t, yk("dog", t));
        } else {
          person(40, 138, 1.25, t, { yawn: yk("f1", t), shirt: C.shirtR, skin: 1, hair: C.hairR });
          person(84, 138, 1.25, t, { yawn: yk("f2", t), shirt: C.shirtG, skin: 0, long: true, hair: C.hairY });
          var hb = 1 + 0.15 * Math.sin(t * 8); g.save(); g.translate(62, 64); g.scale(hb, hb); disc(-2.5, 0, 3, C.red); disc(2.5, 0, 3, C.red); poly([[-5.4, 1], [5.4, 1], [0, 6.5]], C.red); g.restore();
          g.globalAlpha = 0.85; person(140, 138, 1.1, t, { shirt: C.shirtY, skin: 2, mood: "o" }); g.globalAlpha = 1;
          if (t > T.FRIEND + 1.2) say(124, 66, "WHAT?");
          label("FRIENDS", 62, 196, C.gold); label("STRANGER", 140, 196, C.white);
        }
      }
      function scene_brain(t) {
        var cool = t >= T.COOL;
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, true);
        var bx = 90, by = 100;
        character(function () {
          ell(bx, by, 32, 24, 0, C.brainD); ell(bx, by - 1, 30, 22, 0, C.brain);
          g.strokeStyle = C.brainD; g.lineWidth = 1.2;
          for (var k = 0; k < 6; k++) { g.beginPath(); g.arc(bx - 20 + k * 8, by - 8 + (k % 2) * 6, 5, 0.3, 2.8); g.stroke(); }
          line(bx, by - 20, bx, by + 18, 1, C.brainD);
          var y0 = cool ? 0 : 0;
          disc(bx - 9, by + 4, 2, C.ink); disc(bx + 9, by + 4, 2, C.ink); disc(bx - 9.6, by + 3.4, 0.6, C.white); disc(bx + 8.4, by + 3.4, 0.6, C.white);
          if (cool) arcS(bx, by + 10, 3, 0.3, Math.PI - 0.3, 1, C.mouth); else ell(bx, by + 12, 1.6, 2, 0, C.mouth);
          if (!cool) ell(bx + 20, by - 12, 1.4, 2.4, 0, C.tear);
        });
        if (!cool) { worldText("?", 60, 70, 2, C.gold); worldText("?", 118, 66, 2, C.gold); }
        else {
          // a fan blowing cool air at it
          var fx = 30, fy = 128; rect(fx - 1, fy - 8, 2, 14, C.fan); disc(fx, fy - 12, 9, C.fan); var a = t * 20;
          for (var b = 0; b < 3; b++) line(fx, fy - 12, fx + Math.cos(a + b * 2.1) * 7, fy - 12 + Math.sin(a + b * 2.1) * 7, 2, C.ink);
          for (var w = 0; w < 4; w++) { var p = ((t - T.COOL) * 1.5 + w / 4) % 1; line(fx + 12 + p * 30, 104 + w * 6, fx + 18 + p * 30, 104 + w * 6, 1, C.cyan); }
          label("HYPOTHESIS", 90, 196, C.cyan);
        }
      }
      function scene_kids(t) {
        var cam = { x: 90, y: 160, z: 1.0 };
        room(cam, false);
        person(58, 138, 1.25, t, { yawn: yk("adult", t), shirt: C.shirtP, skin: 2, long: true, hair: C.hairB });
        person(124, 138, 1.4, t, { kid: true, shirt: C.shirtY, skin: 0, hair: C.hairY, mood: t > T.KIDS + 1.0 ? "o" : "" });
        if (t > T.KIDS + 1.1 && t < T.YOU - 0.2) say(124, 70, "?");
        // a toy block
        rect(140, 128, 10, 10, C.red); worldText("A", 145, 130, 1, C.white);
      }

      function sceneAt(t) {
        var tt = tapeT(t, T);
        return tt < T.SEE || tt >= T.YOU ? "face" : tt < T.HALF ? "chain" : tt < T.READ ? "half" : tt < T.BREAK + 0.25 ? "read" : tt < T.WHY ? "dog" : tt < T.KIDS ? "brain" : "kids";
      }
      function drawUI(t) {
        var tt = tapeT(t, T), n = countOf(T.YAWNS, tt);
        var l2 = tt < T.SEE ? "DON'T DO IT" : tt < T.HALF ? "AND COUNTING" : tt < T.READ ? "~50% OF ADULTS" : tt < T.HIT ? "JUST FROM WORDS" : tt < T.FRIEND ? "EVEN DOGS" : tt < T.WHY ? "FRIENDS: MORE" : tt < T.KIDS ? "WHY? DEBATED" : tt < T.YOU ? "KIDS UNDER ~4: NO" : "YOURS?";
        counterLines("YAWNS: " + n, n > 15 ? C.pink : C.gold, 3, l2, C.white);
      }

      KIT.start(C, T, {
        scenes: { face: scene_face, chain: scene_chain, half: scene_half, read: scene_read, dog: scene_dog, brain: scene_brain, kids: scene_kids },
        sceneAt: sceneAt, ui: drawUI, hitCol: C.white,
        cuts: [[T.SEE, "face", "chain"], [T.HALF, "chain", "half"], [T.READ, "half", "read"], [T.WHY, "dog", "brain"], [T.KIDS, "brain", "kids"], [T.YOU, "kids", "face"]],
      });
    </script>
  </body>
</html>
